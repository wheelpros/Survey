<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Messages — Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:#f6f7fb;
  color:#101828;
  padding:35px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

h2{
  margin-bottom:10px;
}

a{
  color:var(--nav-active);
  font-weight:bold;
}

.empty{
  background:#fff;
  padding:25px;
  border-radius:15px;
  color:#667085;
}
.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden;}
.panel-head{padding:24px 28px;border-bottom:1px solid #eef1f5;}
.panel-head h1{font-size:24px;margin-bottom:6px;}
.panel-head p{color:#667085;font-size:14px;}
.panel-body{padding:24px 28px;}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
body{padding:0}
.admin-sidebar{
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  padding:26px 12px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:100;
}
.side-logo{padding:0 6px;margin-bottom:30px}
.side-logo img{width:150px;max-width:100%;height:auto;display:block}

.side-nav a{
  display:flex;gap:12px;align-items:center;
  text-decoration:none;color:var(--muted);
  padding:11px 12px;border-radius:10px;margin-bottom:4px;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.side-nav a svg{width:18px;height:18px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{
  width:100%;font:inherit;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;gap:10px;align-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{
  width:36px;height:36px;border-radius:50%;
  background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-content{padding:35px}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{padding:0}
:root.sidebar-collapsed .side-logo img{display:none}

:root.sidebar-collapsed .side-nav a{justify-content:center;padding:12px 0}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}
@media(max-width:950px){

  .admin-content{padding:24px 18px}
}


/* ── Shell refresh: the collapse control lives in the sidebar head ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}

.side-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}

/* Tighter nav rows: the active/hover pill was heavier than the label needs. */
.side-nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .side-nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}


@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
}
/* ── Messages: conversation list beside the open thread ── */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}
.page-title h1{font-size:30px;margin-bottom:8px}
.page-title p{font-size:14px;color:var(--muted);max-width:620px}
.create-btn{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--nav-active);color:#fff;border:none;padding:11px 18px;border-radius:10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.create-btn:hover{background:#282c52}
.create-btn:disabled{opacity:.45;cursor:not-allowed}
.create-btn svg{width:16px;height:16px}
.head-actions{flex:none;display:flex;gap:10px;align-items:center}
.sound-btn{width:40px;height:40px;border:1px solid #dfe3ea;background:#fff;border-radius:10px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.sound-btn:hover{background:#f6f7f9;color:var(--text)}
.sound-btn svg{width:18px;height:18px}
.sound-btn .off,.sound-btn[aria-pressed="true"] .on{display:none}
.sound-btn[aria-pressed="true"] .off{display:block}

.chat{display:grid;grid-template-columns:320px minmax(0,1fr);background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden;height:calc(100vh - 190px);min-height:460px}

.convos{border-right:1px solid #eef1f5;display:flex;flex-direction:column;min-height:0}
.convos-head{padding:16px;border-bottom:1px solid #eef1f5}
.convos-head input{width:100%;height:38px;border:1px solid #dfe3ea;border-radius:9px;padding:0 12px;font:inherit;font-size:13px}
.convo-list{overflow-y:auto;flex:1}
.convo{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;border:0;border-bottom:1px solid #f2f4f7;background:#fff;text-align:left;font:inherit;cursor:pointer;color:inherit}
.convo:hover{background:#fafbfc}
.convo.active{background:#f3f4fb}
.convo-meta{flex:1;min-width:0}
.convo-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.convo-top strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-top time{font-size:11px;color:#98a2b3;flex:none}
.convo-preview{display:flex;justify-content:space-between;gap:8px;margin-top:3px}
.convo-preview span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo.unread .convo-preview span{color:var(--text);font-weight:700}
.unread-pill{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}

.av{width:40px;height:40px;border-radius:50%;flex:none;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.small{width:34px;height:34px;font-size:13px}

.thread{display:flex;flex-direction:column;min-height:0;min-width:0}
.thread-head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #eef1f5}
.thread-head strong{display:block;font-size:15px}
.thread-head span{font-size:12px;color:var(--muted)}
.back-btn{display:none;border:1px solid #dfe3ea;background:#fff;border-radius:9px;width:36px;height:36px;cursor:pointer;color:var(--text);flex:none}
.back-btn svg{width:18px;height:18px}

.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:6px;background:#fbfbfd}
.older-btn{align-self:center;border:1px solid #dfe3ea;background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:8px}
.day{align-self:center;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#98a2b3;margin:12px 0 6px}
/* Mine on the left, theirs on the right. */
.msg{max-width:min(520px,78%);display:flex;flex-direction:column;gap:3px;align-self:flex-end;align-items:flex-end}
.msg.mine{align-self:flex-start;align-items:flex-start}
.bubble{padding:9px 13px;border-radius:14px;background:#fff;border:1px solid #eaecf0;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.mine .bubble{background:var(--nav-active);border-color:var(--nav-active);color:#fff}
.msg.mine .bubble a{color:#fff}
.bubble a{color:var(--nav-active);text-decoration:underline}
.msg time{font-size:11px;color:#98a2b3}

.composer{display:flex;gap:10px;align-items:flex-end;padding:14px 20px;border-top:1px solid #eef1f5;background:#fff}
.composer-field{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.composer textarea{width:100%;min-height:42px;max-height:160px;resize:none;border:1px solid #dfe3ea;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.45}
.composer textarea:focus,.convos-head input:focus{outline:2px solid var(--nav-active);outline-offset:1px}
.counter{font-size:11px;color:#98a2b3;text-align:right}
.counter.over{color:var(--brand);font-weight:700}
.composer-note{padding:14px 20px;border-top:1px solid #eef1f5;color:var(--muted);font-size:13px;background:#fff}
.send-error{padding:0 20px 10px;color:var(--brand);font-size:13px;background:#fff}

.placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}
.placeholder strong{color:var(--text);font-size:16px}
.list-empty{padding:28px 18px;color:var(--muted);font-size:13px;text-align:center;line-height:1.5}

/* The people picker for a new chat */
.picker{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:99998}
.picker.show{display:flex}
.picker-box{background:#fff;border-radius:18px;width:100%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.picker-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #eef1f5}
.picker-head h2{font-size:18px}
.picker-close{border:1px solid #dfe3ea;background:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
.picker-search{padding:12px 20px;border-bottom:1px solid #eef1f5}
.picker-search input{width:100%;height:38px;border:1px solid #dfe3ea;border-radius:9px;padding:0 12px;font:inherit;font-size:13px}
.picker-search input:focus{outline:2px solid var(--nav-active);outline-offset:1px}
.picker-list{overflow-y:auto;max-height:min(360px,55vh)}
.person{display:flex;gap:12px;align-items:center;width:100%;padding:12px 20px;border:0;border-bottom:1px solid #f2f4f7;background:#fff;text-align:left;font:inherit;cursor:pointer;color:inherit}
.person:hover,.person.current{background:#f3f4fb}
.person strong{display:block;font-size:14px}
.person span{font-size:12px;color:var(--muted)}

/* ── On a phone: the list, or the open thread, never both ── */
@media(max-width:768px){
  .page-head{flex-direction:column;gap:12px}
  .chat{grid-template-columns:minmax(0,1fr);height:calc(100vh - 220px)}
  .chat.open .convos{display:none}
  .chat:not(.open) .thread{display:none}
  .convos{border-right:0}
  .back-btn{display:inline-flex;align-items:center;justify-content:center}
  .messages{padding:14px}
  .composer,.thread-head{padding:12px 14px}
  .msg{max-width:88%}
}

/* ── Unread badge on the Notifications nav item ──
   Collapsed, the sidebar hides labels, so the count degrades to a dot on
   the icon - the same affordance the old topbar bell had. */
.side-nav a{position:relative}
.nav-badge{
  margin-left:auto;font-style:normal;font-size:11px;font-weight:800;line-height:1;
  min-width:18px;padding:3px 6px;border-radius:9px;
  background:var(--brand);color:#fff;text-align:center;
}
.nav-badge[hidden]{display:none}
.side-nav a.active .nav-badge{background:#fff;color:var(--nav-active)}
:root.sidebar-collapsed .nav-badge{
  position:absolute;top:4px;right:8px;margin:0;
  width:8px;height:8px;min-width:0;padding:0;border-radius:50%;
  font-size:0;border:2px solid #fff;
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  var DRAWER = 768;   // below this the sidebar is a drawer, never a rail
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth > DRAWER && (window.innerWidth <= MOBILE || prefersCollapsed())); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> popup. Admins have no editable profile record, so this
// is identity + logout only; system config lives on settings.html.
function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = ({ owner: "Director", super_admin: "Super Admin", account_manager: "Account Manager", seo_admin: "Admin" })[a.role] || "";
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctRole", label);
});
</script>

    </div>

<script>
const adminToken = localStorage.getItem("admin_token");
const adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

/* ── Messages ───────────────────────────────────────────────────────────────
   api/admin-messages.php holds the chats; this page lists them and keeps the
   open one fresh by asking for anything newer every few seconds while the
   tab is visible. The open chat lives in the URL (?with=<admin id>). */

const POLL_MS = 5000;
const LIST_POLL_MS = 15000;
const MAX_CHARS = 2000;
const ROLE_LABELS = { owner: "Director", super_admin: "Super Admin", account_manager: "Account Manager", seo_admin: "Admin" };

let conversations = [];
let openWith = null;      // the other admin, as the API returns them
let messages = [];        // the open thread, oldest first
let hasOlder = false;
let pollTimer = null;
let sending = false;

function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* Escapes first, then turns http(s) addresses into links - nothing else a
   message contains is ever treated as markup. */
function linkify(text){
  return esc(text).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g,
    url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

function timeAgo(seconds){
  if(!seconds) return "";
  const diff = Math.round(Date.now() / 1000) - seconds;
  if(diff < 60) return "now";
  if(diff < 3600) return Math.floor(diff / 60) + "m";
  if(diff < 86400) return Math.floor(diff / 3600) + "h";
  if(diff < 604800) return Math.floor(diff / 86400) + "d";
  return new Date(seconds * 1000).toLocaleDateString(undefined, {day:"numeric", month:"short"});
}

const clock = s => new Date(s * 1000).toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});

function dayLabel(seconds){
  const d = new Date(seconds * 1000);
  const today = new Date();
  const yesterday = new Date(Date.now() - 86400000);
  if(d.toDateString() === today.toDateString()) return "Today";
  if(d.toDateString() === yesterday.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short", year:"numeric"});
}

function avatar(person, small){
  const cls = "av" + (small ? " small" : "");
  if(person.avatar_path) return `<span class="${cls}"><img src="${esc(person.avatar_path)}" alt=""></span>`;
  return `<span class="${cls}">${esc((person.name || "?").charAt(0).toUpperCase())}</span>`;
}

const subtitle = p => p.removed ? "No longer on the team" : (p.position || ROLE_LABELS[p.role] || "");

async function api(params, body){
  const options = { headers: { Authorization: "Bearer " + adminToken } };
  if(body){
    options.method = "POST";
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const res = await fetch("api/admin-messages.php" + (params ? "?" + new URLSearchParams(params) : ""), options);
  if(res.status === 401){
    logoutAdmin();
    throw new Error("signed out");
  }
  return res.json();
}

function paintBadge(){
  const badge = document.getElementById("msgBadge");
  if(!badge) return;
  const n = conversations.reduce((sum, c) => sum + c.unread, 0);
  badge.textContent = n > 9 ? "9+" : String(n);
  badge.hidden = n <= 0;
}

/* ── The list ── */

async function loadList(){
  let fresh;
  try{
    const data = await api({ action: "list" });
    if(!data.success) throw new Error(data.message);
    fresh = data.conversations || [];
  }catch(err){
    if(!conversations.length){
      document.getElementById("convoList").innerHTML = `<div class="list-empty">Could not load your chats. Reload the page to try again.</div>`;
    }
    return;
  }
  noticeIncoming(fresh.filter(c => c.last && !c.last.mine).map(c => c.last.id), true);

  // The list is re-fetched in the background, so leave the rows alone
  // (and any focus on them) when nothing has changed.
  const changed = JSON.stringify(fresh) !== JSON.stringify(conversations);
  conversations = fresh;
  if(changed || !document.querySelector("#convoList .convo")) renderList();
  paintBadge();
}

function renderList(){
  const q = document.getElementById("convoSearch").value.trim().toLowerCase();
  const rows = conversations.filter(c => !q || c.with.name.toLowerCase().includes(q));
  const list = document.getElementById("convoList");

  if(!conversations.length){
    list.innerHTML = `<div class="list-empty">No chats yet. Use New message to write to someone on the team.</div>`;
    return;
  }
  if(!rows.length){
    list.innerHTML = `<div class="list-empty">No one matches "${esc(q)}".</div>`;
    return;
  }

  list.innerHTML = rows.map(c => `
    <button type="button" class="convo${c.unread ? " unread" : ""}${openWith && openWith.id === c.with.id ? " active" : ""}" onclick="openChat(${c.with.id})">
      ${avatar(c.with)}
      <span class="convo-meta">
        <span class="convo-top"><strong>${esc(c.with.name)}</strong><time>${c.last ? esc(timeAgo(c.last.created_ts)) : ""}</time></span>
        <span class="convo-preview">
          <span>${c.last ? (c.last.mine ? "You: " : "") + esc(c.last.preview) : ""}</span>
          ${c.unread ? `<em class="unread-pill">${c.unread > 99 ? "99+" : c.unread}</em>` : ""}
        </span>
      </span>
    </button>
  `).join("");
}

/* ── One chat ── */

async function openChat(adminId){
  closePicker();
  stopPolling();

  const data = await api({ action: "thread", with: adminId }).catch(() => null);
  if(!data || !data.success){
    renderThreadError((data && data.message) || "Could not open this chat.");
    return;
  }

  openWith = data.with;
  messages = data.messages;
  hasOlder = data.has_older;
  noticeIncoming(messages.filter(m => !m.mine).map(m => m.id), false);
  history.replaceState(null, "", "?with=" + adminId);
  document.getElementById("chat").classList.add("open");

  renderThread();
  scrollToEnd();
  markRead();
  startPolling();
}

function closeChat(){
  stopPolling();
  openWith = null;
  messages = [];
  history.replaceState(null, "", location.pathname);
  document.getElementById("chat").classList.remove("open");
  document.getElementById("thread").innerHTML = `
    <div class="placeholder"><strong>Pick a chat</strong><span>Or start one with New message.</span></div>`;
  renderList();
}

function renderThreadError(message){
  document.getElementById("chat").classList.add("open");
  document.getElementById("thread").innerHTML = `
    <div class="thread-head">
      <button class="back-btn" type="button" onclick="closeChat()" aria-label="Back to chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    </div>
    <div class="placeholder"><strong>${esc(message)}</strong></div>`;
}

function messagesHtml(){
  let lastDay = "";
  return messages.map(m => {
    const day = dayLabel(m.created_ts);
    const sep = day !== lastDay ? `<div class="day">${esc(day)}</div>` : "";
    lastDay = day;
    return sep + `
      <div class="msg${m.mine ? " mine" : ""}" data-id="${m.id}">
        <div class="bubble">${linkify(m.body)}</div>
        <time title="${esc(new Date(m.created_ts * 1000).toLocaleString())}">${esc(clock(m.created_ts))}</time>
      </div>`;
  }).join("");
}

function renderThread(){
  const p = openWith;
  const canSend = !p.removed && p.active;

  document.getElementById("thread").innerHTML = `
    <div class="thread-head">
      <button class="back-btn" type="button" onclick="closeChat()" aria-label="Back to chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      ${avatar(p, true)}
      <div><strong>${esc(p.name)}</strong><span>${esc(subtitle(p))}</span></div>
    </div>
    <div class="messages" id="messages">
      ${hasOlder ? `<button class="older-btn" type="button" onclick="loadOlder()">Show earlier messages</button>` : ""}
      ${messages.length ? messagesHtml() : `<div class="placeholder"><span>No messages yet. Say hello to ${esc(p.name)}.</span></div>`}
    </div>
    ${canSend ? `
      <div class="send-error" id="sendError" hidden></div>
      <form class="composer" id="composer" onsubmit="event.preventDefault(); sendMessage();">
        <div class="composer-field">
          <textarea id="composerInput" rows="1" placeholder="Message ${esc(p.name)}" aria-label="Message" oninput="onType()" onkeydown="onKey(event)"></textarea>
          <span class="counter" id="counter" hidden></span>
        </div>
        <button class="create-btn" type="submit" id="sendBtn" disabled>Send</button>
      </form>`
    : `<div class="composer-note">${p.removed ? "This person is no longer on the team." : esc(p.name) + "'s account is switched off, so they can't receive messages."}</div>`}
  `;

  renderList();
  const input = document.getElementById("composerInput");
  if(input && window.innerWidth > 768) input.focus();
}

function appendMessages(rows){
  if(!rows.length) return;
  const known = new Set(messages.map(m => m.id));
  const fresh = rows.filter(m => !known.has(m.id));
  if(!fresh.length) return;

  const box = document.getElementById("messages");
  const nearBottom = box && box.scrollHeight - box.scrollTop - box.clientHeight < 80;

  messages = messages.concat(fresh);
  if(box){
    // Re-rendering only the list keeps whatever is half-typed in the composer.
    box.innerHTML = (hasOlder ? `<button class="older-btn" type="button" onclick="loadOlder()">Show earlier messages</button>` : "") + messagesHtml();
  }
  if(nearBottom || fresh.some(m => m.mine)) scrollToEnd();
}

async function loadOlder(){
  if(!openWith || !messages.length) return;
  const box = document.getElementById("messages");
  const fromBottom = box.scrollHeight - box.scrollTop;

  const data = await api({ action: "thread", with: openWith.id, before: messages[0].id }).catch(() => null);
  if(!data || !data.success) return;

  messages = data.messages.concat(messages);
  hasOlder = data.has_older;
  box.innerHTML = (hasOlder ? `<button class="older-btn" type="button" onclick="loadOlder()">Show earlier messages</button>` : "") + messagesHtml();
  box.scrollTop = box.scrollHeight - fromBottom;   // stay on the message being read
}

function scrollToEnd(){
  const box = document.getElementById("messages");
  if(box) box.scrollTop = box.scrollHeight;
}

async function markRead(){
  if(!openWith) return;
  const convo = conversations.find(c => c.with.id === openWith.id);
  if(convo && convo.unread){
    convo.unread = 0;
    renderList();
    paintBadge();
  }
  api(null, { action: "read", with: openWith.id }).catch(() => {});
}

/* ── Writing ── */

function onType(){
  const input = document.getElementById("composerInput");
  const counter = document.getElementById("counter");
  const length = input.value.trim().length;

  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";

  // The counter only shows once it matters.
  counter.hidden = input.value.length < MAX_CHARS - 200;
  counter.textContent = input.value.length + " / " + MAX_CHARS;
  counter.classList.toggle("over", input.value.length > MAX_CHARS);

  document.getElementById("sendBtn").disabled = sending || length === 0 || input.value.length > MAX_CHARS;
}

// Enter sends; Shift+Enter is a new line.
function onKey(event){
  if(event.key === "Enter" && !event.shiftKey && !event.isComposing){
    event.preventDefault();
    sendMessage();
  }
}

async function sendMessage(){
  const input = document.getElementById("composerInput");
  const error = document.getElementById("sendError");
  const body = input.value.trim();
  if(!openWith || sending || !body || input.value.length > MAX_CHARS) return;

  sending = true;
  document.getElementById("sendBtn").disabled = true;
  error.hidden = true;

  try{
    const data = await api(null, { action: "send", to: openWith.id, body });
    if(!data.success) throw new Error(data.message || "Could not send the message.");

    input.value = "";
    sending = false;
    onType();
    // Clear the "No messages yet" note on a first message.
    if(!messages.length) document.getElementById("messages").innerHTML = "";
    appendMessages([data.message_row]);
    loadList();
  }catch(err){
    sending = false;
    onType();
    error.textContent = err.message === "signed out" ? "" : err.message + " Your message is still in the box.";
    error.hidden = false;
  }
}

/* ── Keeping the open chat fresh ── */

async function poll(){
  if(!openWith || document.hidden) return;
  const last = messages.length ? messages[messages.length - 1].id : 0;

  try{
    const data = last
      ? await api({ action: "thread", with: openWith.id, after: last })
      : await api({ action: "thread", with: openWith.id });
    if(!data.success) return;

    const theirs = data.messages.filter(m => !m.mine && !messages.some(x => x.id === m.id));
    noticeIncoming(theirs.map(m => m.id), true);
    if(!messages.length && data.messages.length){
      messages = [];
      document.getElementById("messages").innerHTML = "";
    }
    appendMessages(data.messages);
    if(theirs.length){
      markRead();
      loadList();
    }
  }catch(err){
    // Try again on the next tick.
  }
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(poll, POLL_MS);
}

function stopPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = null;
}

// Back on the tab: catch up at once rather than waiting for the next tick.
document.addEventListener("visibilitychange", () => {
  if(!document.hidden){
    poll();
    loadList();
  }
});

// The list is checked even in a background tab, so a message in any chat -
// not only the open one - still brings a sound. Browsers slow this timer
// down in hidden tabs, which is fine for a chime.
setInterval(loadList, LIST_POLL_MS);

/* ── A sound for new messages ───────────────────────────────────────────────
   A short two-note tone made with the Web Audio API, so there is no file to
   ship. Only for messages from the other person, and only ones that arrive
   after the page has loaded: the first look at the list and every chat
   opened just sets the mark (heardUpTo), nothing rings for it.

   Browsers only let a page make sound after someone has clicked or typed on
   it, so the audio is switched on at the first click or key press; until
   then, or with no Web Audio at all, the chime is silently skipped. Muting
   is remembered in this browser. */

const SOUND_KEY = "wz_msg_sound_muted";
const HEARD_KEY = "wz_msg_heard_id";    // shared by every open Messages tab

let audio = null;
let heardUpTo = null;     // the newest incoming message id accounted for; null until the first load

function soundMuted(){
  try{ return localStorage.getItem(SOUND_KEY) === "1"; }catch(e){ return false; }
}

function paintSoundBtn(){
  const btn = document.getElementById("soundBtn");
  const muted = soundMuted();
  const label = muted ? "Turn on the new message sound" : "Mute the new message sound";
  btn.setAttribute("aria-pressed", String(muted));
  btn.title = label;
  btn.setAttribute("aria-label", label);
}

function toggleSound(){
  const muted = !soundMuted();
  try{ localStorage.setItem(SOUND_KEY, muted ? "1" : "0"); }catch(e){}
  paintSoundBtn();
}

function unlockAudio(){
  if(!audio){
    const Context = window.AudioContext || window.webkitAudioContext;
    if(!Context) return;
    try{ audio = new Context(); }catch(e){ return; }
  }
  if(audio.state === "suspended") audio.resume().catch(() => {});
}
document.addEventListener("pointerdown", unlockAudio, true);
document.addEventListener("keydown", unlockAudio, true);

function chime(){
  if(soundMuted() || !audio || audio.state !== "running") return;
  try{
    const now = audio.currentTime;
    [[880, 0], [1320, 0.1]].forEach(([frequency, at]) => {
      const tone = audio.createOscillator();
      const volume = audio.createGain();
      tone.type = "sine";
      tone.frequency.value = frequency;
      volume.gain.setValueAtTime(0.0001, now + at);
      volume.gain.exponentialRampToValueAtTime(0.06, now + at + 0.015);
      volume.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.22);
      tone.connect(volume).connect(audio.destination);
      tone.start(now + at);
      tone.stop(now + at + 0.25);
    });
  }catch(e){
    // No sound is the right failure.
  }
}

/* ids: incoming message ids just seen. ring=false only moves the mark. */
function noticeIncoming(ids, ring){
  const newest = ids.length ? Math.max(...ids) : 0;
  if(ring && heardUpTo !== null && newest > heardUpTo){
    // With the page open in two tabs, only the first to see it rings.
    let shared = 0;
    try{ shared = Number(localStorage.getItem(HEARD_KEY)) || 0; }catch(e){}
    if(newest > shared){
      try{ localStorage.setItem(HEARD_KEY, String(newest)); }catch(e){}
      chime();
    }
  }
  heardUpTo = Math.max(heardUpTo || 0, newest);
}

paintSoundBtn();

/* ── Starting a chat ── */

/* The search box keeps focus the whole time: typing filters by name, role
   or position, the arrow keys move the highlight, Enter opens that chat. */

let people = null;        // the team, once loaded
let pickerMatches = [];   // what the search currently shows
let pickerIndex = 0;      // the highlighted row in pickerMatches

async function openPicker(){
  const picker = document.getElementById("picker");
  const search = document.getElementById("pickerSearch");
  picker.classList.add("show");
  search.value = "";
  pickerIndex = 0;
  search.focus();

  if(!people){
    document.getElementById("pickerList").innerHTML = `<div class="list-empty">Loading the team...</div>`;
    const data = await api({ action: "people" }).catch(() => null);
    if(!data || !data.success){
      document.getElementById("pickerList").innerHTML = `<div class="list-empty">Could not load the team.</div>`;
      return;
    }
    people = data.people;
  }
  renderPicker();
}

function renderPicker(){
  const list = document.getElementById("pickerList");
  const search = document.getElementById("pickerSearch");
  if(!people) return;

  const q = search.value.trim().toLowerCase();
  pickerMatches = people.filter(p => !q || [p.name, p.position, ROLE_LABELS[p.role]]
    .some(field => (field || "").toLowerCase().includes(q)));
  pickerIndex = Math.max(0, Math.min(pickerIndex, pickerMatches.length - 1));

  if(!people.length){
    list.innerHTML = `<div class="list-empty">There is nobody else on the team yet.</div>`;
  }else if(!pickerMatches.length){
    list.innerHTML = `<div class="list-empty">No one matches "${esc(search.value.trim())}".</div>`;
  }else{
    list.innerHTML = pickerMatches.map((p, i) => `
      <button type="button" class="person${i === pickerIndex ? " current" : ""}" id="person-${p.id}" role="option"
              aria-selected="${i === pickerIndex}" tabindex="-1"
              onclick="openChat(${p.id})" onmousemove="highlightPerson(${i})">
        ${avatar(p, true)}
        <span><strong>${esc(p.name)}</strong><span>${esc(subtitle(p))}</span></span>
      </button>`).join("");
  }

  const current = pickerMatches[pickerIndex];
  if(current) search.setAttribute("aria-activedescendant", "person-" + current.id);
  else search.removeAttribute("aria-activedescendant");
}

function highlightPerson(index){
  if(index === pickerIndex) return;
  pickerIndex = index;
  document.querySelectorAll("#pickerList .person").forEach((row, i) => {
    row.classList.toggle("current", i === index);
    row.setAttribute("aria-selected", String(i === index));
  });
  const current = pickerMatches[index];
  if(current) document.getElementById("pickerSearch").setAttribute("aria-activedescendant", "person-" + current.id);
}

function onPickerKey(event){
  if(!pickerMatches.length) return;
  if(event.key === "ArrowDown" || event.key === "ArrowUp"){
    event.preventDefault();
    const step = event.key === "ArrowDown" ? 1 : -1;
    highlightPerson((pickerIndex + step + pickerMatches.length) % pickerMatches.length);
    const row = document.querySelectorAll("#pickerList .person")[pickerIndex];
    if(row) row.scrollIntoView({ block: "nearest" });
  }else if(event.key === "Enter" && !event.isComposing){
    event.preventDefault();
    openChat(pickerMatches[pickerIndex].id);
  }
}

/* restoreFocus: closed by hand (Escape, the cross, the backdrop), so focus
   goes back to the button. openChat moves focus to the composer itself. */
function closePicker(restoreFocus){
  const picker = document.getElementById("picker");
  if(!picker.classList.contains("show")) return;
  picker.classList.remove("show");
  if(restoreFocus) document.getElementById("newMessageBtn").focus();
}

document.addEventListener("keydown", event => {
  if(event.key === "Escape") closePicker(true);
});

(async function start(){
  await loadList();
  const withId = Number(new URLSearchParams(location.search).get("with"));
  if(withId) openChat(withId);
})();
</script>
