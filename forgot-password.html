<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:#f6f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#101828;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:34px;
  box-shadow:0 14px 35px rgba(0,0,0,.08);
}

/* Same logo treatment as the sidebar: logo.png when the admin has
   uploaded one, the bundled wordmark otherwise. */
.brand{
  text-align:center;
  margin-bottom:26px;
}

.brand img{
  width:132px;
  max-width:100%;
  height:auto;
  display:inline-block;
}

.auth-foot{
  margin:26px 0 0;
  text-align:center;
  font-size:11px;
  font-weight:700;
  letter-spacing:.4px;
  text-transform:uppercase;
  color:#98a1ad;
}

h1{
  font-size:24px;
  margin:0 0 8px;
}

.lede{
  color:#667085;
  font-size:14px;
  line-height:1.5;
  margin:0 0 24px;
}

label{
  display:block;
  font-size:13px;
  font-weight:400;
  margin-bottom:8px;
}

input{
  width:100%;
  height:54px;
  border:1px solid #dfe3ea;
  background:#f1f3f6;
  border-radius:12px;
  padding:0 15px;
  font-size:14px;
  color:#101828;
  outline:none;
}

input:focus{
  border-color:#1b1e3a;
  background:#fff;
  box-shadow:0 0 0 3px rgba(27,30,58,.10);
}

button{
  width:100%;
  height:56px;
  margin-top:18px;
  border:none;
  background:#1b1e3a;
  color:#fff;
  border-radius:12px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#282c50;
}

button:disabled{
  opacity:.6;
  cursor:default;
}

.status{
  margin-top:14px;
  text-align:center;
  font-size:13px;
  line-height:1.5;
  color:#667085;
}

/* Claims no space until there is something to say. */
.status:empty{
  display:none;
}

.status.ok{
  color:#067647;
  font-weight:700;
}

.status.err{
  color:#c9000b;
  font-weight:700;
}

</style>
</head>

<body>

<div class="card">
  <div class="brand">
    <img src="logo.png" alt="W|ZONE London"
         onerror="this.onerror=null;this.src='assets/WZONE%20source.png'">
  </div>

  <h1>Forgot password</h1>
  <p class="lede">Enter your email address and we will send you a link to reset your password.</p>

  <form id="resetForm">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="name@company.com" autocomplete="email" required>

    <button type="submit" id="sendBtn">Send reset link</button>
    <div class="status" id="status"></div>
  </form>

  <p class="auth-foot">&copy; <span class="yr"></span> WZONE London. All rights reserved.</p>
</div>

<script>
document.querySelectorAll(".yr").forEach(el => el.textContent = new Date().getFullYear());

const form = document.getElementById("resetForm");
const sendBtn = document.getElementById("sendBtn");
const status = document.getElementById("status");

function setStatus(message, kind){
  status.innerText = message;
  status.className = "status" + (kind ? " " + kind : "");
}

form.addEventListener("submit", async function(event){
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  if(!email){
    setStatus("Email is required", "err");
    return;
  }

  sendBtn.disabled = true;
  setStatus("Sending...");

  try{
    const res = await fetch("api/forgot-password.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ email })
    });

    const data = await res.json();
    setStatus(data.message, data.success ? "ok" : "err");
  }catch(error){
    setStatus("Connection error", "err");
  }finally{
    sendBtn.disabled = false;
  }
});
</script>

</body>
</html>
