<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
background:#f6f6f6;
}

.card{
background:white;
padding:35px;
border-radius:20px;
width:350px;
box-shadow:0 10px 30px #ddd;
}

input,button{
width:100%;
height:50px;
margin-top:15px;
border-radius:10px;
border:1px solid #ddd;
padding:0 15px;
}

button{
background:#1b1e3a;
color:white;
cursor:pointer;
}

#status{
margin-top:15px;
text-align:center;
}
</style>

</head>

<body>


<div class="card">

<h2>Forgot Password</h2>

<p>
Enter your email address and we will send you a reset link.
</p>


<input 
type="email"
id="email"
placeholder="Email Address">


<button onclick="sendReset()">
Send Reset Link
</button>


<div id="status"></div>


</div>



<script>

async function sendReset(){


let email=document.getElementById("email").value;


let res=await fetch("api/forgot-password.php",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email
})

});


let data=await res.json();


document.getElementById("status").innerText=data.message;


}

</script>


</body>
</html>
