<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inquiry Response</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6f7fb;color:#101828;padding:0}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
body{padding:0}
.admin-sidebar{
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  padding:26px 12px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:100;
}
.side-logo{padding:0 6px;margin-bottom:30px}
.side-logo img{width:150px;max-width:100%;height:auto;display:block}

.side-nav a{
  display:flex;gap:12px;align-items:center;
  text-decoration:none;color:var(--muted);
  padding:11px 12px;border-radius:10px;margin-bottom:4px;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.side-nav a svg{width:18px;height:18px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{
  width:100%;font:inherit;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;gap:10px;align-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{
  width:36px;height:36px;border-radius:50%;
  background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-content{padding:35px}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{padding:0}
:root.sidebar-collapsed .side-logo img{display:none}

:root.sidebar-collapsed .side-nav a{justify-content:center;padding:12px 0}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}
@media(max-width:950px){

  .admin-content{padding:24px 18px}
}

/* ── Account popup (sidebar card) ── */
.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.acct-modal.show{display:flex}
.acct-box{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.acct-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef1f5}
.acct-head h2{font-size:17px}
.acct-head button{border:none;background:var(--nav-active);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.acct-body{padding:24px;text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px}
.acct-body strong{display:block;font-size:16px;margin-bottom:8px}
.acct-role{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-active);background:#eef0f6;border-radius:20px;padding:5px 12px;margin-bottom:22px}
.acct-logout{width:100%;height:46px;border:1px solid #f0d2d4;background:#fff;color:var(--brand);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.acct-logout:hover{background:#fff5f5}

/* ── Shell refresh: the collapse control lives in the sidebar head ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}

.side-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}

/* Tighter nav rows: the active/hover pill was heavier than the label needs. */
.side-nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .side-nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}


@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
}
/* ── Unread badge on the Notifications nav item ──
   Collapsed, the sidebar hides labels, so the count degrades to a dot on
   the icon - the same affordance the old topbar bell had. */
.side-nav a{position:relative}
.nav-badge{
  margin-left:auto;font-style:normal;font-size:11px;font-weight:800;line-height:1;
  min-width:18px;padding:3px 6px;border-radius:9px;
  background:var(--brand);color:#fff;text-align:center;
}
.nav-badge[hidden]{display:none}
.side-nav a.active .nav-badge{background:#fff;color:var(--nav-active)}
:root.sidebar-collapsed .nav-badge{
  position:absolute;top:4px;right:8px;margin:0;
  width:8px;height:8px;min-width:0;padding:0;border-radius:50%;
  font-size:0;border:2px solid #fff;
}
</style>

<!-- Feature styles first, shell.css last: the phone drawer has to win. -->

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  var DRAWER = 768;   // below this the sidebar is a drawer, never a rail
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", (window.innerWidth <= MOBILE && window.innerWidth > DRAWER) || prefersCollapsed()); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> popup. Admins have no editable profile record, so this
// is identity + logout only; system config lives on settings.html.
function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = a.role === "super_admin" ? "Super Admin" : "Administrator";
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctName", name);   set("acctRole", label);   set("acctAvatar", initial);
});
</script>

<script>
/*
|------------------------------------------------------------------------------
| Inquiries: one response, on its own
|------------------------------------------------------------------------------
|
| A phone has no room to expand an answer inside a list, so tapping one there
| comes here instead. On a desktop the same link is intercepted and the answer
| opens in place - this page is what that link points at when it is not.
|
| One fetch: api/admin-inquiry-responses.php?response_id= finds the inquiry
| from the response, so the URL only ever carries the one id.
|
*/

const adminToken = localStorage.getItem("admin_token");
let adminUser = {};
try { adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}

if (!adminToken || !adminUser.role) {
  window.location.href = "admin-login.html";
}

if (adminUser.role !== "owner" && adminUser.role !== "account_manager") {
  window.location.href = "admin.html";
}

const responseId = Number(new URLSearchParams(window.location.search).get("id") || 0);

function logoutAdmin() {
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

function block(message) {
  document.getElementById("card").hidden = true;

  const box = document.getElementById("blocked");
  box.innerHTML = `
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
    </div>
    <h3>${WZI.escapeHtml(message)}</h3>
    <a class="btn btn-ghost" href="inquiries.html">Back to inquiries</a>
  `;
  box.hidden = false;
}

async function load() {
  if (!responseId) {
    block("No response was named in the link.");
    return;
  }

  try {
    const res = await fetch("api/admin-inquiry-responses.php?response_id=" + responseId, {
      headers: { Authorization: "Bearer " + adminToken }
    });
    const data = await res.json();

    if (!data.success) {
      block(data.message || "Unable to load this response.");
      return;
    }

    fill(data);

  } catch (error) {
    block("Connection error.");
  }
}

const ICON = {
  mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg>`,
  phone: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  copy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`
};

function fill(data) {
  const fields = data.fields || [];
  const response = data.response || {};
  const answers = response.answers || {};
  const who = WZI.identify(fields, answers, response.position || 0);

  document.getElementById("backLink").href =
    "inquiry-details.html?id=" + data.id + "#response-" + response.id;

  document.title = who.name + " - " + data.title;
  document.getElementById("pageTitle").textContent = who.name;

  /* Which inquiry this answers, under the name of whoever answered it. Clipped
     to one line on a phone, so the full string rides along as a title. */
  const headName = document.getElementById("headName");
  headName.textContent = data.title;
  headName.title = data.title;

  document.getElementById("vAvatar").textContent = who.initials;
  document.getElementById("vName").textContent = who.name;

  const sub = document.getElementById("vSub");
  sub.textContent = who.sub;
  sub.hidden = !who.sub;

  /* Where this one sits in the pile, which is the question anybody arriving
     from the list has: is this the newest, or one of forty. */
  const place = data.total
    ? "Response " + ((response.position || 0) + 1) + " of " + data.total
    : "";

  document.getElementById("vMeta").innerHTML = `
    <span>${ICON.clock} Submitted ${WZI.escapeHtml(WZI.fmtDateTime(response.submitted_at))}</span>
    ${place ? `<span class="lead-place">${place}</span>` : ``}
  `;

  renderActions(fields, answers, who.name);
  renderAnswers(fields, answers);

  document.getElementById("card").hidden = false;
}

/* The two things anybody does with a lead. Only offered when the answers
   actually carry an address or a number - a dead button is worse than none. */
function renderActions(fields, answers, name) {
  const email = WZI.findAnswer(fields, answers, "email");
  const phone = WZI.findAnswer(fields, answers, "phone");

  const buttons = [];

  if (email) {
    buttons.push(`<a class="btn btn-dark btn-lg" href="mailto:${WZI.escapeHtml(encodeURI(email))}">
      ${ICON.mail} Email
    </a>`);
  }

  if (phone) {
    buttons.push(`<a class="btn btn-ghost btn-lg" href="tel:${WZI.escapeHtml(phone.replace(/[^0-9+]/g, ""))}">
      ${ICON.phone} Call
    </a>`);
  }

  const box = document.getElementById("vActions");
  box.innerHTML = buttons.join("");
  box.hidden = !buttons.length;
}

function renderAnswers(fields, answers) {
  document.getElementById("vAnswers").innerHTML = fields.map(field => {
    const raw = String(answers[field.id] || "").trim();
    const kind = WZI.answerKind(field.field_label, raw);

    // Long answers get the full width; so does anything that simply runs long.
    const wide = field.field_type === "textarea" || raw.length > 60;

    // Worth a copy button only where copying is the point.
    const copyable = kind === "email" || kind === "phone";

    return `
      <div class="answer${wide ? " full" : ""}${kind === "empty" ? " is-empty" : ""}">
        <span class="f-label">${WZI.escapeHtml(field.field_label)}</span>
        <div class="f-value${wide && kind === "text" ? " pre" : ""}">${WZI.answerHtml(field.field_label, raw)}</div>
        ${copyable ? `
          <button class="answer-copy" type="button"
                  aria-label="Copy ${WZI.escapeHtml(field.field_label)}"
                  data-copy="${WZI.escapeHtml(raw)}"
                  onclick="copyValue(this)">
            ${ICON.copy}
          </button>` : ``}
      </div>
    `;
  }).join("");
}

async function copyValue(button) {
  const ok = await WZI.copy(button.dataset.copy || "");
  WZI.toast(ok ? "Copied." : "Copying was blocked - select the text instead.", !ok);
}

load();
</script>

</body>
