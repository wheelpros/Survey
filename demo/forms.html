    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      :root {
        --brand: #c9000b;
        --nav-active: #1b1e3a;
        --text: #101828;
        --muted: #667085;
        --line: #eaecf0;
        --sidebar-w: 260px;
      }
      body {
        background: #f7f8fc;
        color: var(--text);
      }
      .app {
        display: flex;
        min-height: 100vh;
      }

      /* ── Sidebar ── */
      .sidebar {
        width: var(--sidebar-w);
        background: #fff;
        border-right: 1px solid var(--line);
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        padding: 26px 12px 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .logo {
        padding: 0 6px;
        margin-bottom: 30px;
      }
      .logo img {
        width: 150px;
        max-width: 100%;
        height: auto;
        display: block;
      }
      .nav a {
        display: flex;
        gap: 12px;
        align-items: center;
        text-decoration: none;
        color: var(--muted);
        padding: 11px 12px;
        border-radius: 10px;
        margin-bottom: 4px;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.15s, color 0.15s;
      }
      .nav a svg {
        width: 18px;
        height: 18px;
        flex: none;
      }
      .nav a:hover {
        background: #f6f7f9;
        color: var(--text);
      }
      .nav a.active {
        background: var(--nav-active);
        color: #fff;
      }
      .user-card {
        width: 100%;
        font: inherit;
        text-align: left;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .user-card:hover {
        background: #fafbfc;
        border-color: #d7dae0;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #dce3ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 13px;
        color: #3745a4;
        background-size: cover;
        background-position: center;
        flex: none;
      }
      .user-meta {
        flex: 1;
        min-width: 0;
      }
      .user-meta h4 {
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .user-meta p {
        font-size: 11px;
        color: #98a2b3;
      }
      .user-dots {
        color: #98a2b3;
        flex: none;
      }

      /* ── Main / header ── */
      .main {
        margin-left: var(--sidebar-w);
        width: calc(100% - var(--sidebar-w));
      }
      .content {
        padding: 34px 44px;
      }
      .welcome h1 {
        font-size: 30px;
        margin-bottom: 8px;
      }
      .welcome p {
        font-size: 14px;
        color: #667085;
        margin-bottom: 28px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        margin-bottom: 34px;
      }
      .stat {
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        display: flex;
        gap: 18px;
        align-items: center;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.04);
        cursor: pointer;
      }
      .icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        background: #eef0f6;
        color: var(--nav-active);
      }
      .stat:nth-child(2) .icon {
        background: #f2f4ff;
        color: #6670d8;
      }
      .stat:nth-child(3) .icon {
        background: #effaf3;
        color: #2fbf6b;
      }
      .stat p {
        font-size: 13px;
        color: #667085;
        margin-bottom: 6px;
      }
      .stat h2 {
        font-size: 26px;
      }
      .panel {
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.04);
        overflow: hidden;
        margin-bottom: 34px;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 26px;
      }
      .panel-head h3 {
        font-size: 17px;
      }
      .panel-head a {
        font-size: 13px;
        color: var(--nav-active);
        text-decoration: none;
        font-weight: 700;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        background: #f8fafc;
        text-align: left;
        font-size: 12px;
        color: #667085;
        padding: 14px 26px;
      }
      td {
        border-top: 1px solid #eef1f5;
        padding: 15px 26px;
        font-size: 13px;
      }
      .badge {
        padding: 5px 13px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
      }
      .waiting {
        background: #e7f0ff;
        color: #3478f6;
      }
      .responded {
        background: #e8faef;
        color: #20a95a;
      }
      .closed {
        background: #e9eef7;
        color: #64748b;
      }
      .rejected {
        background: #ffe8e8;
        color: #c9000b;
      }
      .view {
        color: var(--nav-active);
        text-decoration: none;
        font-weight: 700;
      }
      /* The stat cards are filter buttons now. */
      button.stat {
        font: inherit;
        color: inherit;
        text-align: left;
        border: 2px solid transparent;
        transition: border-color 0.15s;
      }
      button.stat:hover {
        border-color: #e4e7ec;
      }
      button.stat.active {
        border-color: var(--nav-active);
      }
      td.empty {
        text-align: center;
        color: #888;
      }
      .row-action {
        text-align: right;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* Phone only: the icon that stands in for the text link. */
      .eye-btn {
        display: none;
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: #475467;
        align-items: center;
        justify-content: center;
      }
      .eye-btn:hover {
        background: #f6f7f9;
      }
      .eye-btn svg {
        width: 16px;
        height: 16px;
      }

      /* ── Latest content: the same card the Content page uses, three wide ── */
      .latest-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .latest-head h3 {
        font-size: 17px;
      }
      .latest-head a {
        font-size: 13px;
        color: var(--nav-active);
        text-decoration: none;
        font-weight: 700;
        white-space: nowrap;
      }
      .latest-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .latest-card {
        display: block;
        background: #fff;
        border-radius: 14px;
        padding: 8px;
        box-shadow: 0 6px 18px rgba(16, 24, 40, 0.06);
        border: 2px solid transparent;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s, transform 0.15s;
      }
      .latest-card:hover {
        transform: translateY(-2px);
        border-color: #e4e7ec;
      }
      .latest-img {
        background: #f1f3f7 center / cover no-repeat;
        aspect-ratio: 16 / 10;
        border-radius: 10px;
      }
      .latest-body {
        padding: 12px 8px 8px;
        min-width: 0;
      }
      .latest-eyebrow {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .latest-body h4 {
        font-size: 13px;
        font-weight: 400;
        line-height: 1.4;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .latest-date {
        display: block;
        margin-top: 8px;
        font-size: 11px;
        color: #98a2b3;
      }
      .latest-empty {
        grid-column: 1 / -1;
        background: #fff;
        border-radius: 14px;
        padding: 28px;
        text-align: center;
        color: #888;
        font-size: 13px;
      }
      .form-row {
        display: flex;
        gap: 15px;
        padding: 20px 26px;
        align-items: flex-end;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .form-group label {
        font-size: 12px;
        font-weight: bold;
        color: #667085;
      }
      .form-group input {
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
      }
      .btn-primary {
        background: var(--nav-active);
        color: #fff;
        border: none;
        padding: 11px 18px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
      }
      .modal.show {
        display: flex;
      }
      .modal-box {
        width: 100%;
        max-width: 500px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
        overflow: hidden;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 26px;
        border-bottom: 1px solid #eee;
      }
      .modal-head button {
        border: none;
        background: var(--nav-active);
        color: white;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-size: 22px;
        cursor: pointer;
      }

      /* ── Collapsible sidebar ── */
      :root.sidebar-collapsed {
        --sidebar-w: 78px;
      }
      .sidebar,
      .main {
        transition: width 0.18s ease, margin-left 0.18s ease;
      }

      :root.sidebar-collapsed .sidebar {
        padding: 26px 4px 18px;
      }
      :root.sidebar-collapsed .logo {
        padding: 0;
      }
      :root.sidebar-collapsed .logo img {
        display: none;
      }

      :root.sidebar-collapsed .nav a {
        justify-content: center;
        padding: 12px 0;
      }
      :root.sidebar-collapsed .nav a span {
        display: none;
      }
      /* The account card is the only route to profile and logout — collapse it, never hide it. */
      :root.sidebar-collapsed .user-card {
        justify-content: center;
        padding: 8px;
      }
      :root.sidebar-collapsed .user-meta,
      :root.sidebar-collapsed .user-dots {
        display: none;
      }

      /* ── Responsive ── */
      @media (max-width: 950px) {

        .stats {
          grid-template-columns: 1fr;
          gap: 18px;
        }
        .content {
          padding: 24px 18px;
        }
      }

      /*
      | Phone: the tables keep the columns that identify a row - the name, the
      | status - and lose the date, so a long title wraps instead of handing the
      | panel a sideways scrollbar. The text link becomes an icon. The ids beat
      | shell.css's .wz-tablewrap nowrap rule without !important.
      */
      @media (max-width: 768px) {
        .content {
          padding: 18px 14px;
        }
        .welcome h1 {
          font-size: 24px;
        }
        .welcome p {
          margin-bottom: 18px;
        }

        /* Three small filter tiles side by side rather than three tall cards. */
        .stats {
          grid-template-columns: repeat(3, 1fr);
          gap: 10px;
          margin-bottom: 20px;
        }
        .stat {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
          padding: 14px 12px;
          border-radius: 14px;
        }
        .stat .icon {
          display: none;
        }
        .stat p {
          font-size: 12px;
          margin-bottom: 2px;
        }
        .stat h2 {
          font-size: 22px;
        }

        .panel {
          border-radius: 16px;
          margin-bottom: 20px;
        }
        .panel-head {
          padding: 16px;
        }

        #formsTable {
          min-width: 0;
          table-layout: fixed;
          width: 100%;
        }
        #formsTable th,
        #formsTable td {
          white-space: normal;
          overflow-wrap: anywhere;
          padding: 12px;
        }
        #formsTable th:nth-child(2),
        #formsTable td:nth-child(2):not(.empty) {
          display: none;
        }
        #formsTable th:nth-child(3) {
          width: 132px;
        }
        #formsTable .badge {
          display: inline-block;
          white-space: nowrap;
          padding: 5px 10px;
        }
        #formsTable th:nth-child(4) {
          width: 58px;
        }
        .row-action .view {
          display: none;
        }
        .row-action .eye-btn {
          display: inline-flex;
        }

        /* One card per row, thumbnail beside the text, so three posts take
           a screen rather than three. */
        .latest-grid {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .latest-card {
          display: flex;
          gap: 12px;
          align-items: center;
        }
        .latest-img {
          width: 84px;
          flex: none;
          aspect-ratio: 1 / 1;
        }
        .latest-body {
          padding: 2px 4px 2px 0;
        }
      }

      /* Tablet: two-up would orphan the third card, so stay at three but tighter. */
      @media (min-width: 769px) and (max-width: 1100px) {
        .latest-grid {
          gap: 12px;
        }
      }
    
/* ── Shell refresh: the collapse control lives in the sidebar head ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.logo{padding:0;margin:0;flex:1;min-width:0}
.logo img{width:132px;max-width:100%;height:auto;display:block}

.sidebar-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.sidebar-toggle:hover{background:#f2f4f8;color:var(--text)}
.sidebar-toggle svg{width:18px;height:18px}

/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .logo{display:none}

/* Tighter nav rows: the active/hover pill was heavier than the label needs. */
.nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}

/* The account card opens a dropup; it is the only route to profile and logout. */
.account{position:relative}
.account-menu{
  position:absolute;bottom:calc(100% + 8px);left:0;min-width:200px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 16px 40px rgba(16,24,40,.14);padding:6px;display:none;z-index:200;
}
.account.open .account-menu{display:block}
.account-menu a,.account-menu button{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 12px;border:none;background:transparent;border-radius:9px;
  font:inherit;font-size:13px;font-weight:700;color:var(--text);
  text-align:left;text-decoration:none;cursor:pointer;
}
.account-menu a:hover,.account-menu button:hover{background:#f6f7f9}
.account-menu svg{width:16px;height:16px;flex:none;color:var(--muted)}
.account-menu .danger,.account-menu .danger svg{color:var(--brand)}
.account-menu .danger:hover{background:#fff5f5}


@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
}
/* ── Unread badge on the Notifications nav item ──
   Collapsed, the sidebar hides labels, so the count degrades to a dot on
   the icon - the same affordance the old topbar bell had. */
.nav a{position:relative}
.nav-badge{
  margin-left:auto;font-style:normal;font-size:11px;font-weight:800;line-height:1;
  min-width:18px;padding:3px 6px;border-radius:9px;
  background:var(--brand);color:#fff;text-align:center;
}
.nav-badge[hidden]{display:none}
.nav a.active .nav-badge{background:#fff;color:var(--nav-active)}
:root.sidebar-collapsed .nav-badge{
  position:absolute;top:4px;right:8px;margin:0;
  width:8px;height:8px;min-width:0;padding:0;border-radius:50%;
  font-size:0;border:2px solid #fff;
}
</style>

    <script>
      // Runs before paint so the collapsed state never flashes open on load.
      (function () {
        var root = document.documentElement;
        var KEY = "wz_sidebar_collapsed";
        var MOBILE = 950;
        var DRAWER = 768;   // below this the sidebar is a drawer, never a rail
        function prefersCollapsed() {
          return localStorage.getItem(KEY) === "1";
        }
        function apply() {
          root.classList.toggle(
            "sidebar-collapsed",
            window.innerWidth > DRAWER && (window.innerWidth <= MOBILE || prefersCollapsed())
          );
        }
        window.toggleSidebar = function () {
          if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
          localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
          apply();
        };
        apply();
        window.addEventListener("resize", apply);
      })();
    
// Sidebar account card -> dropup with Profile / Logout.
(function () {
  function menu() { return document.getElementById("account"); }
  function close() {
    var el = menu();
    if (!el || !el.classList.contains("open")) return;
    el.classList.remove("open");
    el.querySelector(".user-card").setAttribute("aria-expanded", "false");
  }
  window.toggleAccountMenu = function () {
    var el = menu();
    var open = el.classList.toggle("open");
    el.querySelector(".user-card").setAttribute("aria-expanded", open ? "true" : "false");
  };
  document.addEventListener("click", function (e) {
    var el = menu();
    if (el && !el.contains(e.target)) close();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") close();
  });
})();
</script>

          </nav>
        </div>

        <div class="account" id="account">
          <button class="user-card" type="button" onclick="toggleAccountMenu()" aria-haspopup="true" aria-expanded="false" title="Account">
            <div class="avatar" id="sideAvatar">U</div>
            <div class="user-meta">
              <h4 id="sideName">User</h4>
              <p>Pro Member</p>
            </div>
            <svg class="user-dots" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
          </button>
          <div class="account-menu" role="menu">
            <a role="menuitem" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
            <button role="menuitem" type="button" class="danger" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Logout</span></button>
          </div>
        </div>
      </aside>

      <main class="main">

        <section class="content">
          <div class="welcome">
            <h1>Forms</h1>
            <p>Forms your account manager sends you. Open one to fill it in, or to read back what you submitted.</p>
          </div>

          <!-- The cards double as filters for the table below. -->
          <div class="stats">
            <button class="stat" type="button" data-filter="pending" onclick="setFilter('pending')">
              <div class="icon">⏳</div>
              <div>
                <p>Waiting on you</p>
                <h2 id="pendingResponses">0</h2>
              </div>
            </button>

            <button class="stat" type="button" data-filter="completed" onclick="setFilter('completed')">
              <div class="icon">✓</div>
              <div>
                <p>Completed</p>
                <h2 id="submittedSurveys">0</h2>
              </div>
            </button>

            <button class="stat" type="button" data-filter="all" onclick="setFilter('all')">
              <div class="icon">✉</div>
              <div>
                <p>All forms</p>
                <h2 id="responsesReceived">0</h2>
              </div>
            </button>
          </div>

          <!-- FORMS TABLE -->
          <div class="panel">
            <div class="panel-head">
              <h3 id="formsHeading">All forms</h3>
              <a href="#" id="showAll" hidden onclick="setFilter('all'); return false;">Show all ›</a>
            </div>
            <table id="formsTable">
              <thead>
                <tr>
                  <th>Form</th>
                  <th>Sent</th>
                  <th>Status</th>
                  <th><span class="sr-only">Action</span></th>
                </tr>
              </thead>
              <tbody id="surveyTable">
                <tr><td colspan="4" class="empty">Loading forms...</td></tr>
              </tbody>
            </table>
          </div>

          <!-- LATEST CONTENT: the three newest posts; content.html has the rest. -->
          <div class="latest">
            <div class="latest-head">
              <h3>Latest content</h3>
              <a href="content.html">View all content ›</a>
            </div>
            <div class="latest-grid" id="latestContent">
              <div class="latest-empty">Loading content...</div>
            </div>
          </div>

        </section>
      </main>
    </div>



    <script>
      let token = localStorage.getItem("portal_token");
      if (!token) {
        window.location.href = "index.html";
      }

      let allSurveys = [];
      let currentFilter = "all";

      /* What the client reads for each status. Only released forms reach
         this page: api/dashboard.php leaves out "pending_review" (still with
         a reviewer) and "rejected" (sent back to its creator). */
      const statusMeta = {
        pending:   { label: "Waiting on you", cls: "waiting" },
        completed: { label: "Completed",      cls: "responded" }
      };

      const filterTitles = {
        all: "All forms",
        pending: "Waiting on you",
        completed: "Completed"
      };

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* "2026-10-01 14:05:00" -> "1 Oct 2026". Falls back to the raw value. */
      function prettyDate(value) {
        const date = new Date(String(value || "").replace(" ", "T"));
        if (isNaN(date)) return value || "";
        return date.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
      }

      const EYE_ICON = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>`;

      function renderSurveys() {
        const surveyTable = document.getElementById("surveyTable");
        const rows = currentFilter === "all"
          ? allSurveys
          : allSurveys.filter(s => s.status === currentFilter);

        document.getElementById("formsHeading").innerText = filterTitles[currentFilter];
        document.getElementById("showAll").hidden = currentFilter === "all";
        document.querySelectorAll(".stat").forEach(card => {
          card.classList.toggle("active", card.dataset.filter === currentFilter);
        });

        if (!rows.length) {
          const empty = currentFilter === "all"
            ? "No forms yet. When your account manager sends one, it will appear here."
            : "Nothing here right now.";
          surveyTable.innerHTML = `<tr><td colspan="4" class="empty">${empty}</td></tr>`;
          return;
        }

        /* The phone swaps the text link for the eye icon; see the 768px block. */
        surveyTable.innerHTML = rows.map(s => {
          const meta = statusMeta[s.status] || { label: s.status, cls: "closed" };
          const href = `survey.html?id=${encodeURIComponent(s.id)}`;
          const action = s.status === "completed" ? "View" : "Fill in";
          return `
            <tr>
              <td><b dir="auto">${esc(s.title)}</b></td>
              <td>${esc(prettyDate(s.created_at))}</td>
              <td><span class="badge ${meta.cls}">${esc(meta.label)}</span></td>
              <td class="row-action">
                <a class="view" href="${href}">${action}</a>
                <a class="eye-btn" href="${href}" title="${action}" aria-label="${action}">${EYE_ICON}</a>
              </td>
            </tr>
          `;
        }).join("");
      }

      function setFilter(filter) {
        currentFilter = filter;
        renderSurveys();
      }

      /* The three newest published posts. api/user-content.php already sorts
         newest first; each card opens that post on content.html. */
      async function loadLatestContent() {
        const grid = document.getElementById("latestContent");
        try {
          const res = await fetch("api/user-content.php", {
            headers: { Authorization: "Bearer " + token }
          });
          const data = await res.json();
          renderLatestContent(((data.success && data.content) || []).slice(0, 3));
        } catch (e) {
          grid.innerHTML = `<div class="latest-empty">Couldn't load content.</div>`;
        }
      }

      function renderLatestContent(items) {
        const grid = document.getElementById("latestContent");
        if (!items.length) {
          grid.innerHTML = `<div class="latest-empty">No content published yet.</div>`;
          return;
        }
        grid.innerHTML = items.map(item => `
          <a class="latest-card" href="content.html?id=${encodeURIComponent(item.id)}">
            <div class="latest-img" style="${item.media_path ? `background-image:url('${esc(item.media_path)}')` : ""}"></div>
            <div class="latest-body">
              <div class="latest-eyebrow">${esc([item.platform, item.type_label].filter(Boolean).join(" · "))}</div>
              <h4 dir="auto">${esc(item.title)}</h4>
              <span class="latest-date">${esc(prettyDate(item.created_at))}</span>
            </div>
          </a>
        `).join("");
      }

      async function loadDashboard() {
        try {
          const res = await fetch("api/dashboard.php", {
            headers: { Authorization: "Bearer " + token }
          });
          const data = await res.json();
          if (!data.success) {
            localStorage.clear();
            window.location.href = "index.html";
            return;
          }

          allSurveys = data.surveys || [];
          const name = data.user.name || "User";
          localStorage.setItem("portal_user", JSON.stringify(data.user));
          setAvatarImage(data.user);
          document.getElementById("sideName").innerText = name;

          document.getElementById("submittedSurveys").innerText = data.stats.submittedSurveys;
          document.getElementById("pendingResponses").innerText = data.stats.pendingResponses;
          document.getElementById("responsesReceived").innerText = data.stats.responsesReceived;

          renderSurveys();
        } catch (e) {
          alert("Error loading forms");
        }
      }

      function logout() {
        localStorage.clear();
        window.location.href = "index.html";
      }

      function setAvatarImage(user) {
        const image = user.profile_image;
        const name = user.name || "User";
        const letter = name.charAt(0).toUpperCase();

        [document.getElementById("sideAvatar")].forEach(avatar => {
          if (!avatar) return;
          if (image) {
            avatar.innerText = "";
            avatar.style.backgroundImage = `url('${image}')`;
            avatar.style.backgroundSize = "cover";
          } else {
            avatar.innerText = letter;
          }
        });
      }





      loadDashboard();
      loadLatestContent();
    </script>
  <script src="../assets/notifications.js?v=1"></script>
  <script src="../assets/shell.js?v=2"></script>
</body>
</html>
