<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:#f6f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#101828;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:34px;
  box-shadow:0 14px 35px rgba(0,0,0,.08);
}

.logo{
  color:#c9000b;
  font-weight:800;
  font-size:24px;
  margin-bottom:10px;
}

h1{
  font-size:24px;
  margin:0 0 8px;
}

.lede{
  color:#667085;
  font-size:14px;
  line-height:1.5;
  margin:0 0 24px;
}

label{
  display:block;
  font-size:13px;
  font-weight:400;
  margin-bottom:8px;
}

.password-box{
  position:relative;
  margin-bottom:18px;
}

input{
  width:100%;
  height:54px;
  border:1px solid #dfe3ea;
  background:#f1f3f6;
  border-radius:12px;
  padding:0 50px 0 15px;
  font-size:14px;
  color:#101828;
  outline:none;
}

input:focus{
  border-color:#1b1e3a;
  background:#fff;
  box-shadow:0 0 0 3px rgba(27,30,58,.10);
}

.toggle-password{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  user-select:none;
  color:#666;
  display:flex;
}

.toggle-password:hover{
  color:#1b1e3a;
}

.hint{
  font-size:12px;
  color:#98a2b3;
  margin:-10px 0 18px;
}

button{
  width:100%;
  height:56px;
  border:none;
  background:#1b1e3a;
  color:#fff;
  border-radius:12px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#282c50;
}

button:disabled{
  opacity:.6;
  cursor:default;
}

.status{
  margin-top:14px;
  text-align:center;
  font-size:13px;
  line-height:1.5;
  color:#667085;
}

/* Claims no space until there is something to say. */
.status:empty{
  display:none;
}

.status.ok{
  color:#067647;
  font-weight:700;
}

.status.err{
  color:#c9000b;
  font-weight:700;
}

.foot{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid #eef1f5;
  font-size:13px;
  font-weight:700;
}

.foot a{
  color:#1b1e3a;
  text-decoration:none;
}

.foot a:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">W zone</div>
  <h1>Reset password</h1>
  <p class="lede" id="lede">Choose a new password for your account.</p>

  <form id="resetForm">
    <label for="password">New password</label>
    <div class="password-box">
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
      <span class="toggle-password" onclick="togglePassword('password')" role="button" aria-label="Show password">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z"/>
        </svg>
      </span>
    </div>

    <label for="confirm">Confirm password</label>
    <div class="password-box">
      <input type="password" id="confirm" placeholder="Re-enter your password" autocomplete="new-password">
      <span class="toggle-password" onclick="togglePassword('confirm')" role="button" aria-label="Show password">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z"/>
        </svg>
      </span>
    </div>

    <button type="submit" id="saveBtn">Reset password</button>
    <div class="status" id="status"></div>
  </form>

  <div class="foot">
    <a href="login.html">&larr; Back to login</a>
    <a href="forgot-password.html">Request a new link</a>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get("token");
const form = document.getElementById("resetForm");
const saveBtn = document.getElementById("saveBtn");
const status = document.getElementById("status");

function setStatus(message, kind){
  status.innerText = message;
  status.className = "status" + (kind ? " " + kind : "");
}

function togglePassword(id){
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

// Without a token the form can only ever fail, so say so up front.
if(!token){
  form.style.display = "none";
  document.getElementById("lede").innerText =
    "This reset link is missing its token. Request a new link to continue.";
}

form.addEventListener("submit", async function(event){
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if(password.length < 8){
    setStatus("Password must be at least 8 characters", "err");
    return;
  }

  if(password !== confirm){
    setStatus("Passwords do not match", "err");
    return;
  }

  saveBtn.disabled = true;
  setStatus("Saving...");

  try{
    const res = await fetch("api/reset-password.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ token, password })
    });

    const data = await res.json();

    if(!data.success){
      setStatus(data.message, "err");
      saveBtn.disabled = false;
      return;
    }

    // Leave the button disabled: the redirect follows.
    setStatus(data.message + " Redirecting to login...", "ok");
    setTimeout(function(){
      window.location.href = data.type === "admin" ? "admin-login.html" : "login.html";
    }, 1500);
  }catch(error){
    setStatus("Connection error", "err");
    saveBtn.disabled = false;
  }
});
</script>

</body>
</html>
