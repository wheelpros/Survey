<!DOCTYPE html>
<html>

<head>

<title>Reset Password</title>

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
background:#f6f6f6;
}

.card{

background:white;
padding:35px;
width:350px;
border-radius:20px;

}


label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

input{
  width:100%;
  height:54px;
  border:1px solid #dfe3ea;
  background:#f1f3f6;
  border-radius:12px;
  padding:0 15px;
  margin-bottom:18px;
  outline:none;
}

button{
width:100%;
height:50px;
margin-top:15px;
background:#1b1e3a;
color:white;
border:0;
border-radius:10px;

}

</style>

</head>


<body>


<div class="card">


<h2>Reset Password</h2>


<input 
type="password"
id="password"
placeholder="New Password">


<input 
type="password"
id="confirm"
placeholder="Confirm Password">


<button onclick="resetPassword()">
Reset Password
</button>


<p id="status"></p>


</div>



<script>

const token =
new URLSearchParams(location.search)
.get("token");


async function resetPassword(){

    let password =
    document.getElementById("password").value;


    let confirm =
    document.getElementById("confirm").value;


    let status =
    document.getElementById("status");


    if(password !== confirm){

        status.innerText="Passwords do not match";
        return;

    }


    let res = await fetch(
    "api/reset-password.php",
    {
        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            token,
            password

        })

    });


    let data = await res.json();


    status.innerText = data.message;


    if(data.success){

        setTimeout(()=>{

            if(data.type === "admin"){

                window.location.href = "admin-login.html";

            }
            else{

                window.location.href = "login.html";

            }

        },1500);

    }

}

</script>

</body>
</html>
