<!DOCTYPE html>
<html>

<head>

<title>Reset Password</title>

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
background:#f6f6f6;
}

.card{

background:white;
padding:35px;
width:350px;
border-radius:20px;

}


input,button{

width:100%;
height:50px;
margin-top:15px;

}


button{

background:#1b1e3a;
color:white;
border:0;
border-radius:10px;

}

</style>

</head>


<body>


<div class="card">


<h2>Reset Password</h2>


<input 
type="password"
id="password"
placeholder="New Password">


<input 
type="password"
id="confirm"
placeholder="Confirm Password">


<button onclick="resetPassword()">
Reset Password
</button>


<p id="status"></p>


</div>



<script>


const token =
new URLSearchParams(location.search)
.get("token");



async function resetPassword(){


let password =
document.getElementById("password").value;


let confirm =
document.getElementById("confirm").value;



if(password !== confirm){

status.innerText="Passwords do not match";
return;

}



let res = await fetch(
"api/reset-password.php",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

token,
password

})

});


let data=await res.json();


document.getElementById("status").innerText=data.message;


}



</script>


</body>
</html>
