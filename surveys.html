<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surveys</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #1f2937;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 30px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.page-header h1 {
    margin: 0;
    font-size: 28px;
}

.back-btn {
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    background: #e5e7eb;
    color: #111827;
    font-weight: 600;
}

.filters {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.filter-btn {
    border: 1px solid #d1d5db;
    background: white;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.filter-btn.active {
    background: #111827;
    color: white;
    border-color: #111827;
}

.table-wrapper {
    background: white;
    border-radius: 12px;
    overflow-x: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

th {
    background: #f9fafb;
    font-size: 13px;
    text-transform: uppercase;
}

.survey-title {
    font-weight: 700;
    cursor: pointer;
}

.survey-title:hover {
    text-decoration: underline;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
}

.badge-pending-approval {
    background: #fef3c7;
    color: #92400e;
}

.badge-pending {
    background: #dbeafe;
    color: #1d4ed8;
}

.badge-completed {
    background: #dcfce7;
    color: #166534;
}

.badge-denied {
    background: #fee2e2;
    color: #991b1b;
}

.badge-closed {
    background: #e5e7eb;
    color: #374151;
}

.actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.btn {
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: 600;
}

.view-btn {
    background: #e5e7eb;
    color: #111827;
}

.approve-btn {
    background: #16a34a;
    color: white;
}

.deny-btn {
    background: #dc2626;
    color: white;
}

.empty {
    text-align: center;
    padding: 35px;
    color: #6b7280;
}

/* Modal */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.modal.show {
    display: flex;
}

.modal-content {
    width: min(800px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 14px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;
    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;
}

.close-btn {
    border: none;
    background: #f3f4f6;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 20px;
}

.survey-meta {
    background: #f9fafb;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.question {
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
}

.question-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.question-number {
    font-weight: 700;
}

.question-type {
    font-size: 12px;
    background: #f3f4f6;
    padding: 5px 9px;
    border-radius: 6px;
}

.options {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.option {
    background: #f9fafb;
    padding: 9px;
    border-radius: 7px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.loading {
    text-align: center;
    padding: 30px;
}
</style>
</head>

<body>

<div class="container">

    <div class="page-header">
        <h1>Surveys</h1>

        <a href="admin.html" class="back-btn">
            ← Back to Admin
        </a>
    </div>

    <div class="filters">

        <button class="filter-btn active"
                onclick="setFilter('all', this)">
            All
        </button>

        <button class="filter-btn"
                onclick="setFilter('pending_approval', this)">
            Pending Approval
        </button>

        <button class="filter-btn"
                onclick="setFilter('pending', this)">
            Approved
        </button>

        <button class="filter-btn"
                onclick="setFilter('completed', this)">
            Completed
        </button>

        <button class="filter-btn"
                onclick="setFilter('denied', this)">
            Denied
        </button>

        <button class="filter-btn"
                onclick="setFilter('closed', this)">
            Closed
        </button>

    </div>

    <div class="table-wrapper">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Survey</th>
                    <th>User</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="surveysTable">

                <tr>
                    <td colspan="7" class="loading">
                        Loading surveys...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- Survey Modal -->

<div class="modal" id="surveyModal">

    <div class="modal-content">

        <div class="modal-header">

            <div>
                <h2 id="modalTitle">Survey</h2>
            </div>

            <button class="close-btn"
                    onclick="closeSurveyModal()">
                ×
            </button>

        </div>

        <div id="modalBody">

            <div class="loading">
                Loading...
            </div>

        </div>

        <div class="modal-actions"
             id="modalActions">
        </div>

    </div>

</div>


<script>

let adminToken =
    localStorage.getItem("admin_token");

let adminUser =
    JSON.parse(
        localStorage.getItem("admin_user") || "{}"
    );


/* Super Admin Only */

if (!adminToken || adminUser.role !== "super_admin") {

    window.location.href = "admin-login.html";

}


let allSurveys = [];

let currentFilter = "all";

let currentSurveyId = null;


/* Load Surveys */

async function loadSurveys() {

    const table =
        document.getElementById("surveysTable");

    try {

        const res = await fetch(
            "api/admin-surveys.php",
            {
                headers: {
                    Authorization:
                        "Bearer " + adminToken
                }
            }
        );

        const data = await res.json();

        if (!data.success) {

            table.innerHTML = `
                <tr>
                    <td colspan="7" class="empty">
                        ${data.message || "Unable to load surveys."}
                    </td>
                </tr>
            `;

            return;
        }

        allSurveys = data.surveys || [];

        renderSurveys();

    } catch (error) {

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    Connection error.
                </td>
            </tr>
        `;

    }

}


/* Render Surveys */

function renderSurveys() {

    const table =
        document.getElementById("surveysTable");

    let surveys = allSurveys;

    if (currentFilter !== "all") {

        surveys = allSurveys.filter(
            survey =>
                survey.status === currentFilter
        );

    }

    if (!surveys.length) {

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No surveys found.
                </td>
            </tr>
        `;

        return;
    }


    table.innerHTML = surveys.map(
        survey => {

            const statusClass =
                survey.status.replaceAll("_", "-");

            const statusText =
                survey.status === "pending_approval"
                    ? "Pending Approval"
                    : survey.status.charAt(0).toUpperCase()
                        + survey.status.slice(1);


            return `

                <tr>

                    <td>
                        #${survey.id}
                    </td>

                    <td>

                        <span
                            class="survey-title"
                            onclick="openSurvey(${survey.id})">

                            ${escapeHtml(survey.title)}

                        </span>

                    </td>

                    <td>
                        ${escapeHtml(survey.user_name || "")}
                    </td>

                    <td>
                        ${escapeHtml(survey.user_email || "")}
                    </td>

                    <td>

                        <span
                            class="badge badge-${statusClass}">

                            ${statusText}

                        </span>

                    </td>

                    <td>
                        ${survey.created_at || ""}
                    </td>

                    <td>

                        <div class="actions">

                            <button
                                class="btn view-btn"
                                onclick="openSurvey(${survey.id})">

                                View

                            </button>

                            ${
                                survey.status ===
                                "pending_approval"

                                ? `

                                    <button
                                        class="btn approve-btn"
                                        onclick="approveSurvey(
                                            ${survey.id}
                                        )">

                                        Approve

                                    </button>

                                    <button
                                        class="btn deny-btn"
                                        onclick="denySurvey(
                                            ${survey.id}
                                        )">

                                        Deny

                                    </button>

                                `
                                : ""
                            }

                        </div>

                    </td>

                </tr>

            `;

        }
    ).join("");

}


/* Filter */

function setFilter(filter, button) {

    currentFilter = filter;

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    renderSurveys();

}


/* Open Survey */

async function openSurvey(surveyId) {

    currentSurveyId = surveyId;

    const modal =
        document.getElementById("surveyModal");

    const body =
        document.getElementById("modalBody");

    const actions =
        document.getElementById("modalActions");

    const title =
        document.getElementById("modalTitle");


    modal.classList.add("show");

    body.innerHTML = `
        <div class="loading">
            Loading survey...
        </div>
    `;

    actions.innerHTML = "";


    try {

        const res = await fetch(
            "api/admin-surveys.php?survey_id=" +
            surveyId,
            {
                headers: {
                    Authorization:
                        "Bearer " + adminToken
                }
            }
        );

        const data = await res.json();

        if (!data.success) {

            body.innerHTML =
                `<p>${data.message}</p>`;

            return;
        }


        const survey = data.survey;

        title.textContent =
            survey.title;


        let statusText =
            survey.status === "pending_approval"
                ? "Pending Approval"
                : survey.status.charAt(0).toUpperCase()
                    + survey.status.slice(1);


        body.innerHTML = `

            <div class="survey-meta">

                <strong>Status:</strong>
                ${statusText}

                <br><br>

                <strong>Created:</strong>
                ${survey.created_at || ""}

            </div>

            <h3>Questions & Checklist Items</h3>

            ${
                data.questions && data.questions.length
                ? data.questions.map(
                    (question, index) =>
                        renderQuestion(
                            question,
                            index
                        )
                  ).join("")
                : "<p>No questions found.</p>"
            }

        `;


        if (survey.status === "pending_approval") {

            actions.innerHTML = `

                <button
                    class="btn approve-btn"
                    onclick="approveSurvey(${survey.id}, true)">

                    Approve

                </button>

                <button
                    class="btn deny-btn"
                    onclick="denySurvey(${survey.id}, true)">

                    Deny

                </button>

            `;

        }

    } catch (error) {

        body.innerHTML =
            "<p>Connection error.</p>";

    }

}


/* Render Question */

function renderQuestion(question, index) {

    let chips = [];

    try {

        chips = question.chips
            ? JSON.parse(question.chips)
            : [];

    } catch (error) {

        chips = [];

    }


    let optionsHtml = "";

    if (chips.length) {

        optionsHtml = `

            <div class="options">

                ${chips.map(
                    chip => `

                        <div class="option">
                            ${escapeHtml(chip)}
                        </div>

                    `
                ).join("")}

            </div>

        `;

    }


    const type =
        question.question_type === "checkbox"
            ? "Checklist"
            : question.question_type;


    return `

        <div class="question">

            <div class="question-header">

                <div>

                    <span class="question-number">
                        ${index + 1}.
                    </span>

                    ${escapeHtml(
                        question.question_text
                    )}

                </div>

                <span class="question-type">
                    ${type}
                </span>

            </div>

            ${optionsHtml}

        </div>

    `;

}


/* Approve */

async function approveSurvey(
    surveyId,
    closeModal = false
) {

    if (
        !confirm(
            "Are you sure you want to approve this survey?"
        )
    ) {
        return;
    }


    try {

        const res = await fetch(
            "api/admin-surveys.php",
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json",

                    Authorization:
                        "Bearer " + adminToken
                },

                body: JSON.stringify({
                    surveyId: surveyId,
                    action: "approve"
                })
            }
        );

        const data = await res.json();

        alert(data.message);


        if (data.success) {

            if (closeModal) {
                closeSurveyModal();
            }

            await loadSurveys();

        }

    } catch (error) {

        alert("Connection error.");

    }

}


/* Deny */

async function denySurvey(
    surveyId,
    closeModal = false
) {

    if (
        !confirm(
            "Are you sure you want to deny this survey?"
        )
    ) {
        return;
    }


    try {

        const res = await fetch(
            "api/admin-surveys.php",
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json",

                    Authorization:
                        "Bearer " + adminToken
                },

                body: JSON.stringify({
                    surveyId: surveyId,
                    action: "deny"
                })
            }
        );

        const data = await res.json();

        alert(data.message);


        if (data.success) {

            if (closeModal) {
                closeSurveyModal();
            }

            await loadSurveys();

        }

    } catch (error) {

        alert("Connection error.");

    }

}


/* Close Modal */

function closeSurveyModal() {

    document
        .getElementById("surveyModal")
        .classList.remove("show");

    currentSurveyId = null;

}


/* Escape HTML */

function escapeHtml(value) {

    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* Close when clicking outside */

document
    .getElementById("surveyModal")
    .addEventListener(
        "click",
        function(e) {

            if (e.target === this) {
                closeSurveyModal();
            }

        }
    );


/* Start */

loadSurveys();

</script>

</body>
</html>
