<html lang="en">
<head>

<title>Sources & Files</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6f7fb;color:#101828;padding:35px}

.primary{border:none;background:var(--nav-active);color:#fff;padding:12px 18px;border-radius:10px;font-weight:800;cursor:pointer}

.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);margin-bottom:28px;overflow:hidden;}
.panel-head{padding:24px 28px;border-bottom:1px solid #eef1f5;}
.panel-head h1{font-size:24px;margin-bottom:6px;}
.panel-head p{color:#667085;font-size:14px;}
.panel-body{padding:28px;}
input{width:100%;border:1px solid #dfe3ea;background:#f8fafc;border-radius:12px;padding:13px 14px;margin:10px 0 15px}
.folder{border:1px solid #eef1f5;border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer}
.folder.active{border-color:var(--nav-active);background:#f4f5f9}
.file{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef1f5;padding:14px 0;gap:12px}
.btn{border:none;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer}
.download{background:#101828;color:#fff}
.delete{background:#c9000b;color:#fff}
.small{color:#667085;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.assigned-badge{
    display:inline-block;
    margin-top:8px;
    padding:5px 12px;
    border-radius:20px;
    background:#e9f9ef;
    color:#17803d;
    font-size:12px;
    font-weight:700;
    border:1px solid #b8e7c8;
}

.local-badge{
    display:inline-block;
    margin-top:8px;
    padding:5px 12px;
    border-radius:20px;
    background:#f3f4f6;
    color:#6b7280;
    font-size:12px;
    font-weight:700;
    border:1px solid #d1d5db;
}
.assigned-email{
    display:block;
    margin-top:3px;
    font-size:11px;
    font-weight:400;
    color:#4b5563;
}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
body{padding:0}
.admin-sidebar{
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  padding:26px 12px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:100;
}
.side-logo{padding:0 6px;margin-bottom:30px}
.side-logo img{width:150px;max-width:100%;height:auto;display:block}

.side-nav a{
  display:flex;gap:12px;align-items:center;
  text-decoration:none;color:var(--muted);
  padding:11px 12px;border-radius:10px;margin-bottom:4px;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.side-nav a svg{width:18px;height:18px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{
  width:100%;font:inherit;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;gap:10px;align-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{
  width:36px;height:36px;border-radius:50%;
  background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-topbar{
  height:72px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px;
}
.admin-bell{
  width:40px;height:40px;border-radius:50%;border:none;background:transparent;
  color:#344054;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.admin-bell:hover{background:#f6f7f9}
.admin-bell{position:relative}
.admin-bell .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.admin-content{padding:35px}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{padding:0}
:root.sidebar-collapsed .side-logo img{display:none}

:root.sidebar-collapsed .side-nav a{justify-content:center;padding:12px 0}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}
@media(max-width:950px){

  .admin-content{padding:24px 18px}
}

/* ── Account popup (sidebar card) ── */
.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.acct-modal.show{display:flex}
.acct-box{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.acct-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef1f5}
.acct-head h2{font-size:17px}
.acct-head button{border:none;background:var(--nav-active);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.acct-body{padding:24px;text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px}
.acct-body strong{display:block;font-size:16px;margin-bottom:8px}
.acct-role{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-active);background:#eef0f6;border-radius:20px;padding:5px 12px;margin-bottom:22px}
.acct-logout{width:100%;height:46px;border:1px solid #f0d2d4;background:#fff;color:var(--brand);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.acct-logout:hover{background:#fff5f5}

/* ── Shell refresh: the collapse control lives in the sidebar head ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}

.side-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}

/* Tighter nav rows: the active/hover pill was heavier than the label needs. */
.side-nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .side-nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}

/* Header sits on the page background rather than its own white bar. */
.admin-topbar{
  height:64px;background:transparent;border-bottom:none;
  justify-content:flex-end;padding:0 35px;
}

@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
  .admin-topbar{padding:0 18px}
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth <= MOBILE || prefersCollapsed()); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> popup. Admins have no editable profile record, so this
// is identity + logout only; system config lives on settings.html.
function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = a.role === "super_admin" ? "Super Admin" : "Administrator";
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctName", name);   set("acctRole", label);   set("acctAvatar", initial);
});
</script>
</head>

</div>

    <h2 id="currentFolderTitle">Files</h2>

    <input type="file" id="fileInput" multiple>

    <label style="display:block;margin-top:15px;font-weight:bold">
    Send To User (Optional)
    </label>

    <select id="selectedUser" style="
    width:100%;
    padding:12px;
    border:1px solid #dfe3ea;
    border-radius:12px;
    margin:10px 0 15px;
    background:#f8fafc;
    ">
        <option value="">Only Upload (Don't Send)</option>
    </select>

    <button class="primary" onclick="uploadFiles()">Upload Files</button>

    <div id="uploadStatus" class="small"></div>
    <div id="filesBox" style="margin-top:20px;"></div>

<script>
let adminToken = localStorage.getItem("admin_token");
let adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

document.body.style.display="none";
checkPassword();

// Users Management and Articles Assignment are open to every admin, so the
// sidebar no longer hides them for non-super-admins.

let folders = [];
let currentFolderId = null;
let users = [];

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

async function loadFolders(){
  const box = document.getElementById("foldersBox");

  try{
    const res = await fetch("api/source-folders.php",{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      box.innerHTML = data.message || "Failed to load folders.";
      return;
    }

    folders = data.folders || [];

    if(!folders.length){
      box.innerHTML = `<div class="small">No folders yet.</div>`;
      return;
    }

    box.innerHTML = folders.map(folder => `
      <div class="folder" id="folder-${folder.id}" onclick="openFolder(${folder.id})">
        <strong>${folder.title}</strong>
        <div class="small">${folder.created_at}</div>
      </div>
    `).join("");

  }catch(error){
    box.innerHTML = "Connection error.";
  }
}

async function createFolder(){
  const titleInput = document.getElementById("folderTitle");
  const status = document.getElementById("folderStatus");
  const title = titleInput.value.trim();

  if(!title){
    status.innerText = "Please enter folder title.";
    return;
  }

  status.innerText = "Creating...";

  try{
    const res = await fetch("api/source-folders.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + adminToken
      },
      body:JSON.stringify({title})
    });

    const data = await res.json();
    status.innerText = data.message;

    if(data.success){
      titleInput.value = "";
      loadFolders();
    }

  }catch(error){
    status.innerText = "Connection error.";
  }
}

async function openFolder(folderId){
  currentFolderId = folderId;

  document.querySelectorAll(".folder").forEach(el => {
    el.classList.remove("active");
  });

  const folderEl = document.getElementById("folder-" + folderId);
  if(folderEl){
    folderEl.classList.add("active");
  }

  const folder = folders.find(f => Number(f.id) === Number(folderId));
  document.getElementById("currentFolderTitle").innerText = folder ? folder.title : "Files";
  document.getElementById("filesPanel").style.display = "block";

  await loadFiles();
}

async function loadFiles(){
  const box = document.getElementById("filesBox");

  if(!currentFolderId){
    box.innerHTML = "";
    return;
  }

  box.innerHTML = "Loading files...";

  try{
    const res = await fetch("api/source-files.php?folder_id=" + currentFolderId,{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      box.innerHTML = data.message || "Failed to load files.";
      return;
    }

    const files = data.files || [];

    if(!files.length){
      box.innerHTML = `<div class="small">No files uploaded yet.</div>`;
      return;
    }

    box.innerHTML = files.map(file => `
      <div class="file">
        <div>
    <strong>${file.original_name}</strong>

    <div class="small">
        ${(Number(file.file_size || 0) / 1024).toFixed(1)}
        KB · ${file.uploaded_at}
    </div>

    ${
        file.assigned_user_name
        ?
        `
        <div class="assigned-badge">
    🟢 Assigned to ${file.assigned_user_name}
    <br>
    <span class="assigned-email">
        ${file.assigned_user_email}
    </span>
</div>
        `
        :
        `
        <div class="local-badge">
            ⚪ Not Assigned
        </div>
        `
    }
</div>

        <div class="actions">
          <button class="btn download" onclick="downloadFile(${file.id})">Download</button>
          <button class="btn delete" onclick="deleteFile(${file.id})">Delete</button>
        </div>
      </div>
    `).join("");

  }catch(error){
    box.innerHTML = "Connection error.";
  }
}

async function uploadFiles(){
  const input = document.getElementById("fileInput");
  const status = document.getElementById("uploadStatus");

  if(!currentFolderId){
    status.innerText = "Please select folder first.";
    return;
  }

  if(!input.files.length){
    status.innerText = "Please choose files.";
    return;
  }

  const formData = new FormData();
  formData.append("folder_id", currentFolderId);
  const selectedUser = document.getElementById("selectedUser").value;

if(selectedUser){
    formData.append("user_id", selectedUser);
}

  Array.from(input.files).forEach(file => {
    formData.append("files[]", file);
  });

  status.innerText = "Uploading...";

  try{
    const res = await fetch("api/source-files.php",{
      method:"POST",
      headers:{
        Authorization:"Bearer " + adminToken
      },
      body:formData
    });

    const data = await res.json();
    status.innerText = data.message;

    if(data.success){
      input.value = "";
      loadFiles();
    }

  }catch(error){
    status.innerText = "Connection error.";
  }
}

function downloadFile(fileId){
  window.location.href =
    "api/download-source-file.php?id=" + fileId +
    "&token=" + encodeURIComponent(adminToken);
}

async function deleteFile(fileId){
  const ok = confirm("Delete this file?");
  if(!ok) return;

  try{
    const res = await fetch("api/source-files.php?id=" + fileId,{
      method:"DELETE",
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();
    alert(data.message);

    if(data.success){
      loadFiles();
    }

  }catch(error){
    alert("Connection error.");
  }
}
async function loadUsers(){

  const select = document.getElementById("selectedUser");

  try{

    const res = await fetch("api/admin-users.php",{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success) return;

    users = data.users || [];

    users.forEach(user=>{

      if(Number(user.approved)!==1) return;

      select.innerHTML += `
        <option value="${user.id}">
          ${user.name} (${user.email})
        </option>
      `;

    });

  }catch(err){
    console.log(err);
  }

}
async function checkPassword(){

    const res = await fetch("api/settings.php",{
        headers:{
            Authorization:"Bearer "+adminToken
        }
    });

    const data = await res.json();

    if(!data.hasPassword){
        document.body.style.display="block";
        return;
    }

    while(true){

        const pass = prompt("Enter Sources & Files Password");

        if(pass===null){
            location.href="admin.html";
            return;
        }

        const verify = await fetch("api/settings.php",{

            method:"POST",

            headers:{
                Authorization:"Bearer "+adminToken,
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                action:"verify",
                password:pass
            })

        });

        const result = await verify.json();

        if(result.success){
            document.body.style.display="block";
            break;
        }

        alert("Wrong Password");

    }

}
