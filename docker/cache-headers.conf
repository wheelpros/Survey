# How long browsers may keep each kind of file.
#
# Pages and our own scripts and styles change with every deploy, and the
# ?v= tags on them were bumped by hand - which got forgotten (permissions.js
# changed and every page kept loading ?v=1), so an old sidebar or an old
# permission check could outlive a deploy. "no-cache" does not mean
# "download every time": the browser asks once per load and an unchanged
# file comes back as an empty 304, so a deploy is picked up on the next load.
#
# Images and fonts rarely change, so they are kept for a week.
#
# Installed by the Dockerfile into conf-enabled/. The image ships with
# AllowOverride None, so these rules cannot live in an .htaccess.

<FilesMatch "\.(html|js|css)$">
    Header set Cache-Control "no-cache, must-revalidate"
</FilesMatch>

<FilesMatch "\.(png|jpe?g|webp|gif|svg|ico|woff2?)$">
    Header set Cache-Control "public, max-age=604800"
</FilesMatch>

