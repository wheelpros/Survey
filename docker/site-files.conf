# robots.txt, sitemap.xml and llms.txt name this install's own address, so PHP
# writes them (api/site-file.php). Installed by the Dockerfile into
# conf-enabled/. The image ships with AllowOverride None and without mod_rewrite,
# so this is an Alias rather than an .htaccess rule.

Alias /robots.txt /var/www/html/api/site-file.php
Alias /sitemap.xml /var/www/html/api/site-file.php
Alias /llms.txt /var/www/html/api/site-file.php

# The logo lives in the database so it survives a deploy (api/site-logo.php).
# Every page keeps loading logo.png.
Alias /logo.png /var/www/html/api/site-logo.php
