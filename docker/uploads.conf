# uploads/ holds files people sent us. Nothing in it may run or be served as a
# page on the portal's own origin (audit S1, S13, S7).
#
# The upload code already stores every file under an inert extension; this is
# the second wall, for any file that was saved before that fix or by code that
# forgets. Installed by the Dockerfile into conf-enabled/. The image ships with
# AllowOverride None, so this cannot live in an .htaccess.
#
# Other hosts: put the same <Directory> block in the virtual host, pointing at
# that install's uploads/ path.

<Directory /var/www/html/uploads>
    # No PHP, whatever the file is called.
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
    <FilesMatch "\.(php\d?|phtml|phar|pht|phps|cgi|pl|py|sh|asp|aspx|jsp|shtml?|htaccess|htpasswd)$">
        Require all denied
    </FilesMatch>
    Options -ExecCGI -Includes -Indexes
    RemoveHandler .php .phtml .phar .cgi .pl .py .shtml
    RemoveType .php .phtml .phar

    # A file that is served is served as what it is, and an HTML or SVG file
    # opened directly can't run script against the portal.
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox"
    </IfModule>
</Directory>
