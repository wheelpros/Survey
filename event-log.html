<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking — Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:#f6f7fb;
  color:#101828;
  padding:35px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

h2{
  margin-bottom:10px;
}

a{
  color:var(--nav-active);
  font-weight:bold;
}

.empty{
  background:#fff;
  padding:25px;
  border-radius:15px;
  color:#667085;
}
.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden;}
.panel-head{padding:24px 28px;border-bottom:1px solid #eef1f5;}
.panel-head h1{font-size:24px;margin-bottom:6px;}
.panel-head p{color:#667085;font-size:14px;}
.panel-body{padding:24px 28px;}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
body{padding:0}
.admin-sidebar{
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  padding:26px 12px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:100;
}
.side-logo{padding:0 6px;margin-bottom:30px}
.side-logo img{width:150px;max-width:100%;height:auto;display:block}

.side-nav a{
  display:flex;gap:12px;align-items:center;
  text-decoration:none;color:var(--muted);
  padding:11px 12px;border-radius:10px;margin-bottom:4px;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.side-nav a svg{width:18px;height:18px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{
  width:100%;font:inherit;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;gap:10px;align-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{
  width:36px;height:36px;border-radius:50%;
  background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-content{padding:35px}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{padding:0}
:root.sidebar-collapsed .side-logo img{display:none}

:root.sidebar-collapsed .side-nav a{justify-content:center;padding:12px 0}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}
@media(max-width:950px){

  .admin-content{padding:24px 18px}
}


/* ── Shell refresh: the collapse control lives in the sidebar head ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}

.side-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}

/* Tighter nav rows: the active/hover pill was heavier than the label needs. */
.side-nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .side-nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}


@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
}
/* ── Page header ── */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}
.page-title h1{font-size:30px;margin-bottom:8px}
.page-title p{font-size:14px;color:var(--muted);max-width:620px}
.create-btn{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--nav-active);color:#fff;border:none;text-decoration:none;padding:11px 18px;border-radius:10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.create-btn:hover{background:#282c52}
.ghost-btn{border:1px solid #dfe3ea;background:#fff;color:var(--text);padding:10px 16px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.ghost-btn:hover{background:#f6f7f9}
.ghost-btn[hidden]{display:none}

/* ── Filters: one row on a wide screen, wrapping as it narrows ── */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:18px}
.filter{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1 1 150px}
.filter span{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.filter select,.filter input{height:40px;border:1px solid #dfe3ea;border-radius:9px;background:#fff;padding:0 10px;font:inherit;font-size:13px;color:var(--text);width:100%}
.filter select:focus,.filter input:focus{outline:2px solid var(--nav-active);outline-offset:1px}
.filter-search{flex:2 1 220px}
.filter-actions{display:flex;gap:8px}

/* ── The log ── */
.log{width:100%;border-collapse:collapse;font-size:14px}
.log th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:14px 18px;border-bottom:1px solid #eef1f5;background:#fafbfc}
.log td{padding:14px 18px;border-bottom:1px solid #eef1f5;vertical-align:top;line-height:1.5}
.log tr:last-child td{border-bottom:none}
.col-when{width:140px}
.col-who{width:210px}
.col-area{width:130px}
.when{white-space:nowrap;color:var(--muted);font-size:13px}
.who strong{display:block;font-weight:700}
.who span{font-size:12px;color:var(--muted)}
.via-mcp{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:20px;background:#eef0ff;color:#3745a4;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;vertical-align:1px}
.summary{color:var(--text);word-break:break-word}
.area-tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#f2f4f7;color:#344054;font-size:12px;font-weight:700;white-space:nowrap}
.empty-cell{padding:28px 18px;color:var(--muted);text-align:center}

/* ── Changes / AI activity ── */
.view-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.view-tab{flex:none;min-height:44px;padding:0 16px;margin-bottom:-1px;border:none;border-bottom:2px solid transparent;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer}
.view-tab:hover{color:var(--text)}
.view-tab[aria-selected="true"]{color:var(--nav-active);border-bottom-color:var(--nav-active)}
.view-tab:focus-visible{outline:2px solid var(--nav-active);outline-offset:-2px;border-radius:8px}
.view[hidden]{display:none}

/* ── The AI activity list ── */
.col-app{width:170px}
.col-result{width:130px}
.ai-app{color:var(--muted);word-break:break-word}
.result-tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.result-ok{background:#ecfdf3;color:#067647}
.result-refused{background:#fef3f2;color:#b42318}

/* ── Pagination, the same control as the content and clients lists ── */
.pager{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px}
.pager[hidden]{display:none}
.pager-info{font-size:13px;font-weight:600;color:var(--muted)}
.pager-pages{display:flex;gap:6px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;padding:0 12px;border:1px solid #dfe3ea;background:#fff;border-radius:9px;font:inherit;font-size:13px;font-weight:700;color:var(--text);cursor:pointer}
.pager button:hover:not(:disabled){background:#f6f7f9}
.pager button.current{background:var(--nav-active);border-color:var(--nav-active);color:#fff}
.pager button:disabled{opacity:.45;cursor:not-allowed}

/* ── On a phone: each row becomes a small card - who and when on top, the
   summary under them, the area last. ── */
@media(max-width:768px){
  .page-head{flex-direction:column;gap:12px}
  .filter{flex:1 1 calc(50% - 6px);min-width:0}
  .filter-search{flex-basis:100%}
  .filter-actions{flex-basis:100%}
  .filter-actions .create-btn{flex:1;justify-content:center}
  .log thead{display:none}
  .log,.log tbody,.log tr,.log td{display:block;width:100%}
  .log tr{padding:14px 16px;border-bottom:1px solid #eef1f5}
  .log tr:last-child{border-bottom:none}
  .log td{padding:0;border:none}
  .log td.when{margin-bottom:6px}
  .log td.who{margin-bottom:6px}
  .log td.who strong{display:inline}
  .log td.who span{margin-left:6px}
  .log td.summary{margin-bottom:8px}
  .log td.ai-app{margin-bottom:6px}
  .empty-cell{padding:24px 0}
}

/* ── Unread badge on the Notifications nav item ──
   Collapsed, the sidebar hides labels, so the count degrades to a dot on
   the icon - the same affordance the old topbar bell had. */
.side-nav a{position:relative}
.nav-badge{
  margin-left:auto;font-style:normal;font-size:11px;font-weight:800;line-height:1;
  min-width:18px;padding:3px 6px;border-radius:9px;
  background:var(--brand);color:#fff;text-align:center;
}
.nav-badge[hidden]{display:none}
.side-nav a.active .nav-badge{background:#fff;color:var(--nav-active)}
:root.sidebar-collapsed .nav-badge{
  position:absolute;top:4px;right:8px;margin:0;
  width:8px;height:8px;min-width:0;padding:0;border-radius:50%;
  font-size:0;border:2px solid #fff;
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  var DRAWER = 768;   // below this the sidebar is a drawer, never a rail
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth > DRAWER && (window.innerWidth <= MOBILE || prefersCollapsed())); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> popup. Admins have no editable profile record, so this
// is identity + logout only; system config lives on settings.html.
function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = ({ owner: "Director", super_admin: "Super Admin", account_manager: "Account Manager", seo_admin: "Admin" })[a.role] || "";
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctRole", label);
});
</script>

<script>
const adminToken = localStorage.getItem("admin_token");
const adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

/* Needs events.view: the Director, and whoever they gave it to.
   api/admin-events.php refuses everyone else; this only saves them a page
   that would say so. */
if(adminUser.role && !adminCan("events.view")){
  window.location.href = "admin-dashboard.html";
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

/* ── The log ────────────────────────────────────────────────────────────────
   Rows come from api/admin-events.php newest first, one page at a time. The
   filters live in the URL, so a filtered view can be reloaded or shared. */

const PAGE_SIZE = 25;
let currentPage = 1;
let activeTab = "changes";

const ROLE_LABELS = { owner: "Director", super_admin: "Super Admin", account_manager: "Account Manager", seo_admin: "Admin" };

const FILTERS = { actor_id: "fActor", area: "fArea", client_id: "fClient", from: "fFrom", to: "fTo", q: "fQ" };

function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* created_ts is a Unix epoch from the server. The plain created_at string is
   UTC with no zone and would be read as browser-local, so it is never shown.
   When reads as the exact date and time where the viewer is: "3 Nov 2026, 16:30". */
function fullDate(seconds){
  return seconds
    ? new Date(seconds * 1000).toLocaleString(undefined, {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"})
    : "";
}

function isoDate(seconds){
  return seconds ? new Date(seconds * 1000).toISOString() : "";
}

/* The From / To days are the viewer's own: the server starts each at their midnight. */
function viewerZone(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; }catch(e){ return ""; }
}

async function api(params){
  const res = await fetch("api/admin-events.php?" + new URLSearchParams(params), {
    headers: { "Authorization": "Bearer " + adminToken }
  });

  if(res.status === 401){
    logoutAdmin();
    throw new Error("signed out");
  }

  return res.json();
}

function currentFilters(){
  const out = {};
  Object.entries(FILTERS).forEach(([key, id]) => {
    const value = document.getElementById(id).value.trim();
    if(value) out[key] = value;
  });
  return out;
}

function syncUrl(){
  // Each tab keeps its own view in the URL; only the open one writes it.
  if(activeTab !== "changes") return;

  const params = new URLSearchParams(currentFilters());
  if(currentPage > 1) params.set("page", currentPage);
  const query = params.toString();
  history.replaceState(null, "", query ? "?" + query : location.pathname);
  document.getElementById("clearBtn").hidden = Object.keys(currentFilters()).length === 0;
}

async function loadFilters(){
  try{
    const data = await api({ action: "filters" });
    if(!data.success) return;

    const fill = (id, rows, label) => {
      document.getElementById(id).insertAdjacentHTML("beforeend",
        rows.map(row => `<option value="${esc(row.value)}">${esc(label(row))}</option>`).join(""));
    };

    fill("fActor", data.admins.map(a => ({ ...a, value: a.id })),
      a => a.name + (a.removed ? " (removed)" : " - " + (ROLE_LABELS[a.role] || a.role)));
    fill("fArea", data.areas.map(a => ({ ...a, value: a.key })), a => a.label);
    fill("fClient", data.clients.map(c => ({ ...c, value: c.id })), c => c.name);
  }catch(err){
    // The list still works unfiltered.
  }
}

async function loadPage(page){
  currentPage = Math.max(1, page);
  syncUrl();

  const body = document.getElementById("logRows");

  try{
    const data = await api({ action: "list", page: currentPage, limit: PAGE_SIZE, ...currentFilters(), tz: viewerZone() });

    if(!data.success){
      body.innerHTML = `<tr><td colspan="4" class="empty-cell">${esc(data.message || "Could not load the log.")}</td></tr>`;
      renderPager(0, 0, 0, 0);
      return;
    }

    const rows = data.items || [];
    currentPage = Number(data.page) || currentPage;

    if(!rows.length){
      body.innerHTML = `<tr><td colspan="4" class="empty-cell">${
        Object.keys(currentFilters()).length ? "Nothing matches these filters." : "Nothing has been logged yet."
      }</td></tr>`;
    }else{
      body.innerHTML = rows.map(row => `
        <tr>
          <td class="when"><time datetime="${esc(isoDate(row.created_ts))}">${esc(fullDate(row.created_ts))}</time></td>
          <td class="who">
            <strong>${esc(row.actor_name)}</strong>
            <span>${esc(ROLE_LABELS[row.actor_role] || row.actor_role)}</span>${
              row.via === "mcp" ? `<em class="via-mcp" title="Done through an AI assistant">via AI</em>` : ""
            }
          </td>
          <td class="summary">${esc(row.summary)}</td>
          <td><span class="area-tag">${esc(row.area_label)}</span></td>
        </tr>
      `).join("");
    }

    renderPager(Number(data.total) || 0, Number(data.total_pages) || 1, (currentPage - 1) * PAGE_SIZE, rows.length);

  }catch(err){
    body.innerHTML = `<tr><td colspan="4" class="empty-cell">Connection error.</td></tr>`;
    renderPager(0, 0, 0, 0);
  }
}

function applyFilters(){
  loadPage(1);
}

function clearFilters(){
  Object.values(FILTERS).forEach(id => { document.getElementById(id).value = ""; });
  loadPage(1);
}

/* The pager, same control as the content and clients lists. A long log has
   many pages, so only the ones near the current page get a button. */
function goToPage(page){
  loadPage(page);
  document.getElementById("filters").scrollIntoView({ behavior:"smooth", block:"start" });
}

function renderPager(total, totalPages, start, shown){
  paintPager("log", "goToPage", currentPage, total, totalPages, start, shown);
}

/* prefix names the pager's elements, goTo the function its buttons call. */
function paintPager(prefix, goTo, page, total, totalPages, start, shown){
  const pager = document.getElementById(prefix + "Pager");

  if(total <= PAGE_SIZE){
    pager.hidden = true;
    return;
  }

  pager.hidden = false;

  document.getElementById(prefix + "PagerInfo").innerText =
    `Showing ${start + 1}-${start + shown} of ${total}`;

  const pages = [];
  for(let number = 1; number <= totalPages; number++){
    if(number === 1 || number === totalPages || Math.abs(number - page) <= 2) pages.push(number);
  }

  let last = 0;
  const buttons = pages.map(number => {
    const gap = number - last > 1 ? `<button type="button" disabled>…</button>` : "";
    last = number;
    return gap + `<button type="button" class="${number === page ? "current" : ""}" onclick="${goTo}(${number})">${number}</button>`;
  }).join("");

  document.getElementById(prefix + "PagerPages").innerHTML = `
    <button type="button" onclick="${goTo}(${page - 1})" ${page === 1 ? "disabled" : ""}>Prev</button>
    ${buttons}
    <button type="button" onclick="${goTo}(${page + 1})" ${page === totalPages ? "disabled" : ""}>Next</button>
  `;
}

/* ── AI activity ────────────────────────────────────────────────────────────
   Every call an assistant made into the portal, reads and refusals included.
   Its own filters and pager, so nothing here touches the Changes list. */

const AI_FILTERS = { who: "aiWho", app: "aiApp", result: "aiResult", from: "aiFrom", to: "aiTo" };
let aiPage = 1;

function currentAiFilters(){
  const out = {};
  Object.entries(AI_FILTERS).forEach(([key, id]) => {
    const value = document.getElementById(id).value.trim();
    if(value) out[key] = value;
  });
  return out;
}

function syncAiUrl(){
  if(activeTab !== "ai") return;

  const params = new URLSearchParams({ tab: "ai", ...currentAiFilters() });
  if(aiPage > 1) params.set("page", aiPage);
  history.replaceState(null, "", "?" + params);
  document.getElementById("aiClearBtn").hidden = Object.keys(currentAiFilters()).length === 0;
}

async function loadAiFilters(){
  try{
    const data = await api({ action: "ai_filters" });
    if(!data.success) return;

    document.getElementById("aiWho").insertAdjacentHTML("beforeend", data.people.map(person =>
      `<option value="${esc(person.value)}">${esc(person.name)}${person.kind === "client" ? " (client)" : ""}</option>`
    ).join(""));
    document.getElementById("aiApp").insertAdjacentHTML("beforeend", data.apps.map(app =>
      `<option value="${esc(app.value)}">${esc(app.name)}</option>`
    ).join(""));
  }catch(err){
    // The list still works unfiltered.
  }
}

/* get_tracking reads as "Get tracking"; the exact tool name stays in the title. */
function toolLabel(row){
  if(!row.tool) return row.endpoint;
  const words = row.tool.replace(/_/g, " ");
  return words.charAt(0).toUpperCase() + words.slice(1);
}

async function loadAiPage(page){
  aiPage = Math.max(1, page);
  syncAiUrl();

  const body = document.getElementById("aiRows");
  const none = message => `<tr><td colspan="5" class="empty-cell">${esc(message)}</td></tr>`;

  try{
    const data = await api({ action: "ai_activity", page: aiPage, limit: PAGE_SIZE, ...currentAiFilters(), tz: viewerZone() });

    if(!data.success){
      body.innerHTML = none(data.message || "Could not load AI activity.");
      paintPager("ai", "goToAiPage", 1, 0, 0, 0, 0);
      return;
    }

    const rows = data.items || [];
    aiPage = Number(data.page) || aiPage;

    body.innerHTML = rows.length ? rows.map(row => {
      const ok = row.status < 400;
      return `
        <tr>
          <td class="when"><time datetime="${esc(isoDate(row.created_ts))}">${esc(fullDate(row.created_ts))}</time></td>
          <td class="who">
            <strong>${esc(row.person)}</strong>
            <span>${row.person_kind === "client" ? "Client" : "Staff"}</span>
          </td>
          <td class="ai-app">${esc(row.app)}</td>
          <td class="summary" title="${esc(row.tool || row.endpoint)}">${esc(toolLabel(row))}</td>
          <td><span class="result-tag ${ok ? "result-ok" : "result-refused"}">${ok ? "OK" : "Refused (" + Number(row.status) + ")"}</span></td>
        </tr>
      `;
    }).join("") : none(Object.keys(currentAiFilters()).length ? "Nothing matches these filters." : "No AI activity yet.");

    paintPager("ai", "goToAiPage", aiPage, Number(data.total) || 0, Number(data.total_pages) || 1, (aiPage - 1) * PAGE_SIZE, rows.length);
    syncAiUrl();

  }catch(err){
    body.innerHTML = none("Connection error.");
    paintPager("ai", "goToAiPage", 1, 0, 0, 0, 0);
  }
}

function goToAiPage(page){
  loadAiPage(page);
  document.getElementById("aiFilters").scrollIntoView({ behavior:"smooth", block:"start" });
}

function clearAiFilters(){
  Object.values(AI_FILTERS).forEach(id => { document.getElementById(id).value = ""; });
  loadAiPage(1);
}

/* ── The tabs ───────────────────────────────────────────────────────────────
   Each loads the first time it is opened. A reload keeps the tab it was on,
   with that tab's filters and page; the other starts clean. */

const VIEW_NOTES = {
  changes: "Every admin change, kept 12 months.",
  ai: "Every call an AI assistant made into the portal, by staff and clients, newest first. Shows what was called and how it went, never what was sent or returned."
};

const tabStarted = { changes: false, ai: false };

async function startChanges(params){
  await loadFilters();
  Object.entries(FILTERS).forEach(([key, id]) => {
    if(params.has(key)) document.getElementById(id).value = params.get(key);
  });
  loadPage(Number(params.get("page")) || 1);
}

async function startAi(params){
  await loadAiFilters();
  Object.entries(AI_FILTERS).forEach(([key, id]) => {
    if(params.has(key)) document.getElementById(id).value = params.get(key);
  });
  loadAiPage(Number(params.get("page")) || 1);
}

function showTab(tab, params){
  activeTab = tab;

  const ai = tab === "ai";
  document.getElementById("viewChanges").hidden = ai;
  document.getElementById("viewAi").hidden = !ai;
  document.getElementById("viewNote").textContent = VIEW_NOTES[tab];

  [["tabChanges", !ai], ["tabAi", ai]].forEach(([id, selected]) => {
    const button = document.getElementById(id);
    button.setAttribute("aria-selected", selected ? "true" : "false");
    button.tabIndex = selected ? 0 : -1;
  });

  if(!tabStarted[tab]){
    tabStarted[tab] = true;
    (ai ? startAi : startChanges)(params || new URLSearchParams());
  }else if(ai){
    syncAiUrl();
  }else{
    syncUrl();
  }
}

function tabKeys(event){
  if(!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
  event.preventDefault();

  const next = event.key === "Home" ? "changes"
    : event.key === "End" ? "ai"
    : activeTab === "ai" ? "changes" : "ai";

  showTab(next);
  document.getElementById(next === "ai" ? "tabAi" : "tabChanges").focus();
}

{
  const params = new URLSearchParams(location.search);
  showTab(params.get("tab") === "ai" ? "ai" : "changes", params);
}
