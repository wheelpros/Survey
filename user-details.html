<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Profile — Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
:root{--brand:#c9000b;--nav-active:#1b1e3a;--text:#101828;--muted:#667085;--line:#eaecf0;--sidebar-w:260px}
body{background:#f6f7fb;color:var(--text);padding:0}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
.admin-sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);position:fixed;top:0;left:0;bottom:0;padding:26px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;z-index:100}
.side-nav a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--muted);padding:8px 10px;border-radius:9px;margin-bottom:2px;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.side-nav a svg{width:17px;height:17px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{width:100%;font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{width:36px;height:36px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-content{padding:35px 35px 45px}

.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;margin-bottom:26px;padding:0 2px}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}
.side-toggle{width:34px;height:34px;flex:none;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}
:root.sidebar-collapsed .side-nav a{width:38px;height:38px;padding:0;margin:0 auto 4px;border-radius:10px;justify-content:center}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}

/* ── Account popup (sidebar card) ── */
.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.acct-modal.show{display:flex}
.acct-box{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.acct-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef1f5}
.acct-head h2{font-size:17px}
.acct-head button{border:none;background:var(--nav-active);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.acct-body{padding:24px;text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px}
.acct-body strong{display:block;font-size:16px;margin-bottom:8px}
.acct-role{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-active);background:#eef0f6;border-radius:20px;padding:5px 12px;margin-bottom:22px}
.acct-logout{width:100%;height:46px;border:1px solid #f0d2d4;background:#fff;color:var(--brand);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.acct-logout:hover{background:#fff5f5}

/* ── Page header ── */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:28px}
.page-title h1{font-size:30px;margin-bottom:8px}
.page-title p{font-size:14px;color:var(--muted);max-width:620px}
.back-link{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid #dfe3ea;background:#fff;color:var(--text);text-decoration:none;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:800}
.back-link:hover{background:#f6f7f9}
.back-link svg{width:15px;height:15px}

/* ── Panels & tables (same vocabulary as clients-management.html) ── */
.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden;margin-bottom:24px}
.panel-head{padding:22px 28px;border-bottom:1px solid #eef1f5}
.panel-head h2{font-size:18px;margin-bottom:4px}
.panel-head p{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
th{text-align:left;background:#f8fafc;padding:14px 24px;color:var(--muted);font-size:12px;font-weight:700}
td{padding:15px 24px;border-top:1px solid #eef1f5;font-size:13px;vertical-align:top}
td a{color:var(--nav-active);font-weight:700}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}

.badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800}
.approved{background:#e8faef;color:#20a95a}
.pending{background:#fff3e5;color:#d97706}
.neutral{background:#f2f4f7;color:#475467}
.published{background:#e7f6ec;color:#067647}
.draft{background:#f2f4f7;color:#475467}
.scheduled{background:#fff4e5;color:#b54708}

/* ── Profile header ── */
.profile-head{display:flex;align-items:center;gap:20px;padding:26px 28px}
.profile-photo{
  width:76px;height:76px;border-radius:50%;flex:none;
  background:#dce3ff center/cover no-repeat;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:28px;
}
.profile-id{flex:1;min-width:0}
.profile-id h2{font-size:22px;margin-bottom:4px}
.profile-id p{color:var(--muted);font-size:14px;word-break:break-all}

/* ── Detail grid ── */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 32px;padding:26px 28px}
.field h5{font-size:10px;font-weight:800;letter-spacing:.7px;color:#98a2b3;text-transform:uppercase;margin-bottom:8px}
.field p{font-size:14px;line-height:1.55;word-break:break-word}
.field a{color:var(--nav-active);font-weight:700}
.field.wide{grid-column:1/-1}
.field .muted{color:#98a2b3}

/* ── Appointments calendar (same vocabulary as admin-calendar.html) ── */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 28px;border-bottom:1px solid #eef1f5}
.cal-controls{display:flex;align-items:center;gap:12px}
.cal-month{font-size:18px;font-weight:800;color:var(--text);min-width:170px}
.nav-arrow{border:1px solid var(--line);background:#fff;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:16px;user-select:none}
.nav-arrow:hover{background:#f1f5f9}
.btn-today{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:8px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn-today:hover{background:#f1f5f9}

.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);margin:22px 28px 28px;border-radius:12px;overflow:hidden}
.day-header{background:#f8fafc;padding:12px;font-size:12px;font-weight:700;color:#64748b;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.day-cell{min-height:104px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:#64748b;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.day-cell.other-month{background:#fdfdfd;color:#cbd5e1;cursor:default}
.day-cell.today-cell{background:#f0f9ff}
/* The day the schedule panel below is describing. */
.day-cell.selected-cell{box-shadow:inset 0 0 0 2px var(--nav-active)}
.day-cell.today-cell > span{background:#0284c7;color:#fff;padding:2px 6px;border-radius:12px;width:max-content}
.event-card{padding:6px;border-radius:6px;font-size:10.5px;font-weight:500;line-height:1.3}
.event-card.approved{background:#e8faef;border:1px solid #b8e7c8;color:#17803d}
.event-card.pending{background:#fef3c7;border:1px solid #fde68a;color:#b45309}
.event-card.rejected{background:#fef2f2;border:1px solid #fecaca;color:#dc2626}
.badge.rejected{background:#ffe8e8;color:#c9000b}

.schedule-list{padding:8px 28px 26px}
.schedule-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid #f1f3f7}
.schedule-row:first-child{border-top:none}
.schedule-date{flex:none;width:46px;text-align:center;border-radius:10px;background:#f6f7fb;padding:6px 0}
.schedule-date .m{display:block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.schedule-date .d{display:block;font-size:16px;font-weight:800;color:var(--text)}
.schedule-info{flex:1;min-width:0}
.schedule-info h4{font-size:14px;font-weight:800;color:var(--text);margin-bottom:3px}
.schedule-info p{font-size:12px;color:var(--muted)}
.schedule-time{flex:none;font-size:12px;font-weight:700;color:var(--muted)}

@media(max-width:1100px){.fields{grid-template-columns:repeat(2,1fr)}}
@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
  .admin-content{padding:24px 18px 40px}
  .page-head{flex-direction:column;gap:16px}
  .fields{grid-template-columns:1fr}
  .panel{overflow-x:auto}
  table{min-width:640px}
  .cal-head,.schedule-list{padding-left:18px;padding-right:18px}
  .calendar-grid{margin:18px;min-width:620px}
  .day-cell{min-height:88px}
}
/* ── Unread badge on the Notifications nav item ──
   Collapsed, the sidebar hides labels, so the count degrades to a dot on
   the icon - the same affordance the old topbar bell had. */
.side-nav a{position:relative}
.nav-badge{
  margin-left:auto;font-style:normal;font-size:11px;font-weight:800;line-height:1;
  min-width:18px;padding:3px 6px;border-radius:9px;
  background:var(--brand);color:#fff;text-align:center;
}
.nav-badge[hidden]{display:none}
.side-nav a.active .nav-badge{background:#fff;color:var(--nav-active)}
:root.sidebar-collapsed .nav-badge{
  position:absolute;top:4px;right:8px;margin:0;
  width:8px;height:8px;min-width:0;padding:0;border-radius:50%;
  font-size:0;border:2px solid #fff;
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth <= MOBILE || prefersCollapsed()); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
</script>
</head>

<script>
const adminToken = localStorage.getItem("admin_token");
const adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

// Clients Management is open to every admin, so this page does not narrow on role.
(function(){
  const name = adminUser.name || "Admin";
  const label = adminUser.role === "super_admin" ? "Super Admin" : "Administrator";
  const initial = name.charAt(0).toUpperCase();
  const set = (id,value) => { const el = document.getElementById(id); if(el) el.textContent = value; };
  set("adminName",name);  set("adminRole",label);  set("adminAvatar",initial);
  set("acctName",name);   set("acctRole",label);   set("acctAvatar",initial);
})();

const userId = new URLSearchParams(location.search).get("id");

// Every value below is user-authored and goes through innerHTML.
function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function orDash(value){
  const text = String(value == null ? "" : value).trim();
  return text ? esc(text) : `<span class="muted">—</span>`;
}

function formatDate(value){
  if(!value) return "—";
  const date = new Date(String(value).replace(" ", "T"));
  if(isNaN(date)) return esc(value);
  return date.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
}

function formatSize(bytes){
  const size = Number(bytes);
  if(!size) return "—";
  if(size < 1024) return size + " B";
  if(size < 1024 * 1024) return (size / 1024).toFixed(1) + " KB";
  return (size / 1024 / 1024).toFixed(1) + " MB";
}

/* ── Appointments calendar ─────────────────────────────────────────────
   Same behaviour as admin-calendar.html, narrowed to this one client:
   a month grid, and the schedule for whichever day is selected. */

const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun",
                      "Jul","Aug","Sep","Oct","Nov","Dec"];

let appointments = [];
let currentDate = new Date();
let selectedDate = toDateStr(new Date());

function toDateStr(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
}

function parseDateStr(value){
  const [y,m,d] = String(value || "").split("-").map(Number);
  return new Date(y || 1970, (m || 1) - 1, d || 1);
}

/** "3:00 PM" from either "15:00" or "15:00:00". */
function prettyTime(value){
  const [h,m] = String(value || "").split(":").map(Number);
  if(Number.isNaN(h)) return "";
  const suffix = h >= 12 ? "PM" : "AM";
  const hour = h % 12 === 0 ? 12 : h % 12;
  return `${hour}:${String(m || 0).padStart(2,"0")} ${suffix}`;
}

/** "Aug 12, 2026". */
function prettyDate(value){
  const date = parseDateStr(value);
  return `${MONTHS_SHORT[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
}

function statusLabel(status){
  if(status === "approved") return "Confirmed";
  if(status === "rejected") return "Declined";
  return "Pending";
}

/** A greyed-out cell from the neighbouring month, used only to pad the weeks. */
function padCell(dayNumber){
  const cell = document.createElement("div");
  cell.className = "day-cell other-month";
  cell.innerHTML = `<span>${dayNumber}</span>`;
  return cell;
}

function renderCalendar(){
  const grid = document.getElementById("calendarGrid");
  const monthTitle = document.getElementById("calendarMonthTitle");
  if(!grid || !monthTitle) return;

  monthTitle.textContent = `${MONTHS[currentDate.getMonth()]} ${currentDate.getFullYear()}`;

  const headers = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  grid.innerHTML = headers.map(day => `<div class="day-header">${day}</div>`).join("");

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  const total = new Date(year, month + 1, 0).getDate();
  const days = Array.from({length: total}, (unused,i) => new Date(year, month, i + 1));
  const todayStr = toDateStr(new Date());

  // Cells go in as nodes, never through innerHTML: reassigning innerHTML on the
  // grid re-parses it and would drop the click handlers set further down.
  const lead = (days[0].getDay() + 6) % 7;
  const prevLast = new Date(year, month, 0).getDate();
  for(let i = lead; i > 0; i--){
    grid.appendChild(padCell(prevLast - i + 1));
  }

  days.forEach(day => {
    const dateStr = toDateStr(day);

    const cell = document.createElement("div");
    cell.className = "day-cell"
      + (dateStr === todayStr ? " today-cell" : "")
      + (dateStr === selectedDate ? " selected-cell" : "");

    cell.innerHTML = `<span>${day.getDate()}</span>`;

    appointments
      .filter(a => a.date === dateStr)
      .forEach(a => {
        cell.innerHTML += `
          <div class="event-card ${esc(a.status || "pending")}">
            ● <b>${esc(a.topic || a.title || "Meeting")}</b><br>
            <small>${esc(prettyTime(a.time))}</small>
          </div>`;
      });

    cell.onclick = () => {
      selectedDate = dateStr;
      renderCalendar();
      renderDailySchedule();
    };

    grid.appendChild(cell);
  });

  const cells = grid.children.length - 7;
  const trail = (7 - (cells % 7)) % 7;
  for(let i = 1; i <= trail; i++){
    grid.appendChild(padCell(i));
  }
}

function renderDailySchedule(){
  const list = document.getElementById("dailySchedule");
  const title = document.getElementById("dailyScheduleTitle");
  if(!list) return;

  title.textContent = `Daily meeting Schedule – ${prettyDate(selectedDate)}`;

  const rows = appointments
    .filter(a => a.date === selectedDate)
    .sort((a,b) => String(a.time).localeCompare(String(b.time)));

  if(!rows.length){
    list.innerHTML = `<div class="empty">Nothing scheduled for this day.</div>`;
    return;
  }

  list.innerHTML = rows.map(row => {
    const date = parseDateStr(row.date);
    const raisedBy = row.requested_by === "user"
      ? "Requested by the client"
      : `Requested by ${row.admin_name || "the team"}`;

    return `
      <div class="schedule-row">
        <div class="schedule-date">
          <span class="m">${MONTHS_SHORT[date.getMonth()]}</span>
          <span class="d">${String(date.getDate()).padStart(2,"0")}</span>
        </div>

        <div class="schedule-info">
          <h4>${esc(row.topic || row.title || "Meeting")}</h4>
          <p>${esc(raisedBy)}${row.notes ? " · " + esc(row.notes) : ""}</p>
        </div>

        <span class="schedule-time">${esc(prettyTime(row.time))}</span>
        <span class="badge ${esc(row.status || "pending")}">${statusLabel(row.status)}</span>
      </div>`;
  }).join("");
}

/** Wires the month controls and paints the calendar, once its markup is in the DOM. */
function initCalendar(rows){
  appointments = rows || [];

  // Land on the month of the newest appointment, so the grid is not empty.
  const latest = appointments
    .map(a => a.date)
    .filter(Boolean)
    .sort()
    .pop();

  if(latest){
    currentDate = parseDateStr(latest);
    selectedDate = latest;
  }

  const shift = step => {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + step, 1);
    renderCalendar();
  };

  document.getElementById("prevMonthBtn").onclick = () => shift(-1);
  document.getElementById("nextMonthBtn").onclick = () => shift(1);
  document.getElementById("todayBtn").onclick = () => {
    currentDate = new Date();
    selectedDate = toDateStr(new Date());
    renderCalendar();
    renderDailySchedule();
  };

  renderCalendar();
  renderDailySchedule();
}

/** A panel wrapping a table, or its empty state when there are no rows. */
function tablePanel(title, description, headers, rows, emptyText){
  const body = rows.length
    ? `<table>
         <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
         <tbody>${rows.join("")}</tbody>
       </table>`
    : `<div class="empty">${esc(emptyText)}</div>`;

  return `
    <div class="panel">
      <div class="panel-head">
        <h2>${esc(title)} ${rows.length ? `<span class="badge neutral">${rows.length}</span>` : ""}</h2>
        <p>${esc(description)}</p>
      </div>
      ${body}
    </div>`;
}

function render(data){
  const u = data.user;
  const approved = Number(u.approved) === 1;

  const photo = u.profile_image
    ? `<div class="profile-photo" style="background-image:url('${esc(u.profile_image)}')"></div>`
    : `<div class="profile-photo">${esc((u.name || "U").charAt(0).toUpperCase())}</div>`;

  const website = String(u.website || "").trim();

  const header = `
    <div class="panel">
      <div class="profile-head">
        ${photo}
        <div class="profile-id">
          <h2>${esc(u.name || "Unnamed client")}</h2>
          <p>${esc(u.email || "")}</p>
        </div>
        <span class="badge ${approved ? "approved" : "pending"}">${approved ? "Approved" : "Pending"}</span>
      </div>
    </div>`;

  const details = `
    <div class="panel">
      <div class="panel-head">
        <h2>Details</h2>
        <p>Filled in by the user on their profile page.</p>
      </div>
      <div class="fields">
        <div class="field"><h5>Phone</h5><p>${orDash(u.phone)}</p></div>
        <div class="field"><h5>Company</h5><p>${orDash(u.company_name)}</p></div>
        <div class="field">
          <h5>Website</h5>
          <p>${website
                ? `<a href="${esc(website)}" target="_blank" rel="noopener noreferrer">${esc(website)}</a>`
                : `<span class="muted">—</span>`}</p>
        </div>
        <div class="field"><h5>Joined</h5><p>${formatDate(u.created_at)}</p></div>
        <div class="field">
          <h5>Managed by</h5>
          <p>${data.seoAdmin ? esc(data.seoAdmin.name) : `<span class="muted">Unassigned</span>`}</p>
        </div>
        <div class="field"><h5>User ID</h5><p>${esc(u.id)}</p></div>
        <div class="field wide"><h5>About</h5><p>${orDash(u.description)}</p></div>
      </div>
    </div>`;

  const surveys = tablePanel(
    "Surveys assigned", "Surveys and checklists allocated to this user.",
    ["Title", "Status", "Created"],
    (data.surveys || []).map(s => `
      <tr>
        <td>${esc(s.title || "Untitled")}</td>
        <td>${orDash(s.status)}</td>
        <td>${formatDate(s.created_at)}</td>
      </tr>`),
    "No surveys assigned to this user."
  );

  const responses = tablePanel(
    "Responses", "Surveys this user has submitted.",
    ["Survey", "Submitted", ""],
    (data.responses || []).map(r => `
      <tr>
        <td>${esc(r.survey_title || "Untitled")}</td>
        <td>${formatDate(r.submitted_at)}</td>
        <td><a href="response-details.html?id=${encodeURIComponent(r.id)}">View answers</a></td>
      </tr>`),
    "This user has not submitted any responses."
  );

  // The calendar renders itself after this markup is in the DOM, see renderCalendar().
  const appointments = `
    <div class="panel">
      <div class="panel-head">
        <h2>Appointments ${(data.appointments || []).length ? `<span class="badge neutral">${(data.appointments || []).length}</span>` : ""}</h2>
        <p>Bookings on the content calendar. Pick a day to see what is on it.</p>
      </div>
      <div class="cal-head">
        <div class="cal-controls">
          <span class="cal-month" id="calendarMonthTitle">—</span>
          <button class="nav-arrow" type="button" id="prevMonthBtn" aria-label="Previous month">&lt;</button>
          <button class="nav-arrow" type="button" id="nextMonthBtn" aria-label="Next month">&gt;</button>
        </div>
        <button class="btn-today" type="button" id="todayBtn">Today</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2 id="dailyScheduleTitle">Daily meeting Schedule</h2>
        <p>Appointments booked with this client on the selected day.</p>
      </div>
      <div class="schedule-list" id="dailySchedule"></div>
    </div>`;

  const files = tablePanel(
    "Files shared", "Source files this user can download.",
    ["File", "Size", "Uploaded"],
    (data.files || []).map(f => `
      <tr>
        <td>${esc(f.original_name || "Untitled")}</td>
        <td>${formatSize(f.file_size)}</td>
        <td>${formatDate(f.uploaded_at)}</td>
      </tr>`),
    "No files shared with this user."
  );

  const content = tablePanel(
    "Content visible", "Published posts this user can see — public ones plus anything targeted at their client.",
    ["Title", "Type", "Client"],
    (data.content || []).map(c => `
      <tr>
        <td>${esc(c.title || "Untitled")}</td>
        <td>${esc(c.platform || "")}${c.type_label ? " · " + esc(c.type_label) : ""}</td>
        <td>${c.client ? esc(c.client) : `<span class="muted">All clients</span>`}</td>
      </tr>`),
    "No published content reaches this user yet."
  );

  document.getElementById("pageBody").innerHTML =
    header + details + surveys + responses + appointments + files + content;

  initCalendar(data.appointments || []);
}

function fail(message){
  document.getElementById("pageBody").innerHTML =
    `<div class="panel"><div class="empty">${esc(message)}</div></div>`;
}

async function loadUser(){
  if(!userId){
    fail("No user selected. Go back and pick a user from the list.");
    return;
  }

  try{
    const res = await fetch("api/admin-user-details.php?id=" + encodeURIComponent(userId),{
      headers:{ Authorization: "Bearer " + adminToken }
    });

    if(res.status === 401){
      localStorage.removeItem("admin_token");
      localStorage.removeItem("admin_user");
      window.location.href = "admin-login.html";
      return;
    }

    const data = await res.json();

    if(!res.ok || !data.success){
      fail(data.message || "Could not load this user.");
      return;
    }

    document.title = (data.user.name || "User") + " — Admin";
    render(data);

  }catch(error){
    console.error(error);
    fail("Connection error.");
  }
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

loadUser();
