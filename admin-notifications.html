<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Notifications — Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:#f6f7fb;
  color:#101828;
  padding:35px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

h2{
  margin-bottom:10px;
}

a{
  color:var(--nav-active);
  font-weight:bold;
}

.empty{
  background:#fff;
  padding:25px;
  border-radius:15px;
  color:#667085;
}
.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden;}
.panel-head{padding:24px 28px;border-bottom:1px solid #eef1f5;}
.panel-head h1{font-size:24px;margin-bottom:6px;}
.panel-head p{color:#667085;font-size:14px;}
.panel-body{padding:24px 28px;}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
body{padding:0}
.admin-sidebar{
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  padding:26px 12px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:100;
}
.side-logo{padding:0 6px;margin-bottom:30px}
.side-logo img{width:150px;max-width:100%;height:auto;display:block}

.side-nav a{
  display:flex;gap:12px;align-items:center;
  text-decoration:none;color:var(--muted);
  padding:11px 12px;border-radius:10px;margin-bottom:4px;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.side-nav a svg{width:18px;height:18px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{
  width:100%;font:inherit;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;gap:10px;align-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{
  width:36px;height:36px;border-radius:50%;
  background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-content{padding:35px}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{padding:0}
:root.sidebar-collapsed .side-logo img{display:none}

:root.sidebar-collapsed .side-nav a{justify-content:center;padding:12px 0}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}
@media(max-width:950px){

  .admin-content{padding:24px 18px}
}

/* ── Account popup (sidebar card) ── */
.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.acct-modal.show{display:flex}
.acct-box{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.acct-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef1f5}
.acct-head h2{font-size:17px}
.acct-head button{border:none;background:var(--nav-active);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.acct-body{padding:24px;text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px}
.acct-body strong{display:block;font-size:16px;margin-bottom:8px}
.acct-role{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-active);background:#eef0f6;border-radius:20px;padding:5px 12px;margin-bottom:22px}
.acct-logout{width:100%;height:46px;border:1px solid #f0d2d4;background:#fff;color:var(--brand);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.acct-logout:hover{background:#fff5f5}

/* ── Shell refresh: the collapse control lives in the sidebar head ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}

.side-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}

/* Tighter nav rows: the active/hover pill was heavier than the label needs. */
.side-nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .side-nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}


@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
}
/* ── Page header: the Mark-all action sits on the title line ── */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:28px}
.page-title h1{font-size:30px;margin-bottom:8px}
.page-title p{font-size:14px;color:var(--muted);max-width:620px}
.create-btn{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--nav-active);color:#fff;border:none;text-decoration:none;padding:12px 20px;border-radius:10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.create-btn:hover{background:#282c52}
.create-btn[hidden]{display:none}
.create-btn svg{width:16px;height:16px}
/* Two actions share the slot now, so they get their own row. */
.page-actions{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ── One notification ──
   Read rows keep the dot's slot at transparent rather than dropping it, so
   every title stays on the same left edge down the list. */
.notif{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid #eef1f5;text-decoration:none;color:inherit}
.notif:last-child{border-bottom:none}
a.notif:hover{background:#fbfcfd}
.notif-dot{flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:transparent}
.notif.unread .notif-dot{background:var(--brand)}
.notif-text{flex:1;min-width:0}
.notif-text strong{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.notif.unread .notif-text strong{color:var(--text);font-weight:800}
.notif-text p{font-size:13px;color:var(--muted);line-height:1.5}
.notif time{flex:none;font-size:12px;color:#98a2b3;white-space:nowrap}

/* ── Pagination, the same control as the content and clients lists ── */
.pager{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px}
.pager[hidden]{display:none}
.pager-info{font-size:13px;font-weight:600;color:var(--muted)}
.pager-pages{display:flex;gap:6px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;padding:0 12px;border:1px solid #dfe3ea;background:#fff;border-radius:9px;font:inherit;font-size:13px;font-weight:700;color:var(--text);cursor:pointer}
.pager button:hover:not(:disabled){background:#f6f7f9}
.pager button.current{background:var(--nav-active);border-color:var(--nav-active);color:#fff}
.pager button:disabled{opacity:.45;cursor:not-allowed}

/* ── Announcement detail: the image on the left, the words on the right ──
   An announcement has nowhere to link to, so the row opens the message in
   place rather than navigating. Same panel as the content page. */
.notif.is-announcement{cursor:pointer}
.notif-clip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;font-weight:800;color:#98a2b3}
.notif-clip svg{width:12px;height:12px}
.detail-wrap{margin-top:32px}
.detail-wrap[hidden]{display:none}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.detail-head .eyebrow{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.detail-head h2{font-size:24px}
.detail-close{flex:none;border:1px solid #dfe3ea;background:#fff;color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer}
.detail-close:hover{background:#f6f7f9;color:var(--text)}
.detail{display:grid;grid-template-columns:300px 1fr;gap:28px;background:#fff;border-radius:18px;padding:26px;box-shadow:0 14px 30px rgba(0,0,0,.04)}
.detail-media{background:#f1f3f7 center/cover no-repeat;border-radius:12px;aspect-ratio:9/16;overflow:hidden}
/* No attachment: the copy takes the whole panel rather than sitting beside a grey box. */
.detail.no-media{grid-template-columns:1fr}
.detail.no-media .detail-media{display:none}
.detail-meta{display:grid;gap:22px;align-content:start}
.field h5{font-size:10px;font-weight:800;letter-spacing:.7px;color:#98a2b3;text-transform:uppercase;margin-bottom:8px}
.field p{font-size:15px;line-height:1.6;color:var(--text);white-space:pre-wrap}
.detail-footer{display:flex;flex-wrap:wrap;gap:22px 40px}
@media(max-width:800px){.detail{grid-template-columns:1fr}}

@media(max-width:600px){
  .page-head{flex-direction:column;gap:16px}
  .notif{flex-wrap:wrap}
}
/* ── Unread badge on the Notifications nav item ──
   Collapsed, the sidebar hides labels, so the count degrades to a dot on
   the icon - the same affordance the old topbar bell had. */
.side-nav a{position:relative}
.nav-badge{
  margin-left:auto;font-style:normal;font-size:11px;font-weight:800;line-height:1;
  min-width:18px;padding:3px 6px;border-radius:9px;
  background:var(--brand);color:#fff;text-align:center;
}
.nav-badge[hidden]{display:none}
.side-nav a.active .nav-badge{background:#fff;color:var(--nav-active)}
:root.sidebar-collapsed .nav-badge{
  position:absolute;top:4px;right:8px;margin:0;
  width:8px;height:8px;min-width:0;padding:0;border-radius:50%;
  font-size:0;border:2px solid #fff;
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth <= MOBILE || prefersCollapsed()); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> popup. Admins have no editable profile record, so this
// is identity + logout only; system config lives on settings.html.
function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = a.role === "super_admin" ? "Super Admin" : "Administrator";
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctName", name);   set("acctRole", label);   set("acctAvatar", initial);
});
</script>
</head>

      </a>

        <span>Notifications</span>
        <em class="nav-badge" id="notifBadge" hidden></em>
      </a>
      <a href="settings.html" title="Settings">

        <span>Settings</span>
      </a>
    </nav>
  </div>

  <button class="side-user" type="button" onclick="openAccount()" title="Account">
    <div class="side-avatar" id="adminAvatar">A</div>
    <div class="side-meta">
      <strong id="adminName">Admin</strong>
      <span id="adminRole">Administrator</span>
    </div>
    <svg class="side-dots" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
  </button>
</aside>

<div class="admin-main">
  <div class="admin-content">

    <div class="page-head">
      <div class="page-title">
        <h1>Notifications</h1>
        <p>Everything that happened across your clients, newest first.</p>
      </div>
      <div class="page-actions">
        <button class="create-btn" type="button" id="markAllBtn" hidden onclick="markAllRead()">
          Mark all read
        </button>
        <!-- Sending is the owner's alone; api/announcements.php refuses the rest. -->
        <a class="create-btn" id="createAnnouncementBtn" href="admin-announcement-form.html" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

        </a>
      </div>

    <div class="panel">
      <div class="panel-body" id="notifList">
        <div class="empty">Loading notifications...</div>
      </div>
    </div>

    <div class="pager" id="notifPager" hidden>
      <span class="pager-info" id="notifPagerInfo"></span>
      <div class="pager-pages" id="notifPagerPages"></div>
    </div>

    <!-- Opened by an announcement row above, closed by the X. -->
    <div class="detail-wrap" id="announcementWrap" hidden>
      <div class="detail-head">
        <div>
          <div class="eyebrow" id="announcementEyebrow">Announcement</div>
          <h2 id="announcementTitle"></h2>
        </div>
        <button class="detail-close" type="button" onclick="closeAnnouncement()" aria-label="Close">&times;</button>
      </div>

      <article class="detail" id="announcementPanel">
        <div class="detail-media" id="announcementMedia"></div>
        <div class="detail-meta">
          <div class="field">
            <h5>Details</h5>
            <p id="announcementBody">—</p>
          </div>
          <div class="detail-footer">
            <div class="field">
              <h5>Date</h5>
              <p id="announcementDate">—</p>
            </div>
            <div class="field">
              <h5>Sent by</h5>
              <p id="announcementSender">—</p>
            </div>
            <div class="field">
              <h5>Sent</h5>
              <p id="announcementSent">—</p>
            </div>
          </div>

<!-- ACCOUNT POPUP (opened from the sidebar card) -->
<div class="acct-modal" id="acctModal">
  <div class="acct-box">
    <div class="acct-head">
      <h2>Account</h2>
      <button type="button" onclick="closeAccount()" aria-label="Close">&times;</button>
    </div>
    <div class="acct-body">
      <div class="acct-avatar" id="acctAvatar">A</div>
      <strong id="acctName">Admin</strong>
      <div class="acct-role" id="acctRole">Administrator</div>
      <button class="acct-logout" onclick="logoutAdmin()">&#8617; Logout</button>
    </div>
  </div>
</div>

<script>
const adminToken = localStorage.getItem("admin_token");
const adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

/* Writing an announcement is the owner's alone - the endpoint refuses
   everybody else, so the button is only shown to whoever it would work for. */
if(adminUser.role === "owner"){
  document.getElementById("createAnnouncementBtn").hidden = false;
}

/* ── The inbox ──────────────────────────────────────────────────────────────
   Rows come from api/notifications.php newest first, paged on id rather than
   an offset so a fan-out written inside one second cannot shuffle between
   pages. `link` arrives ready-made, so nothing here knows about event types. */

const PAGE_SIZE = 25;
let currentPage = 1;

function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* created_ts is a Unix epoch from the server. The plain created_at string is
   server-local and would be read as browser-local, so it is display-only. */
function timeAgo(seconds){
  if(!seconds) return "";

  const diff = Math.round(Date.now() / 1000) - seconds;

  if(diff < 60) return "just now";
  if(diff < 3600) return Math.floor(diff / 60) + "m ago";
  if(diff < 86400) return Math.floor(diff / 3600) + "h ago";
  if(diff < 604800) return Math.floor(diff / 86400) + "d ago";

  return new Date(seconds * 1000)
    .toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"});
}

function rowHtml(item){
  const isAnnouncement = Boolean(item.announcement_id);
  const classes = "notif" + (item.read ? "" : " unread") + (isAnnouncement ? " is-announcement" : "");

  const inner = `
    <span class="notif-dot"></span>
    <div class="notif-text">
      <strong>${esc(item.title)}</strong>
      ${item.body ? `<p>${esc(item.body)}</p>` : ""}
      ${isAnnouncement ? `<span class="notif-clip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        Open announcement</span>` : ""}
    </div>
    <time>${esc(timeAgo(item.created_ts))}</time>
  `;

  // An announcement has nowhere to link to: the row opens the panel below
  // instead. A row with neither still marks itself read.
  if(isAnnouncement){
    return `<div class="${classes}" data-id="${item.id}" data-announcement="${item.announcement_id}">${inner}</div>`;
  }

  return item.link
    ? `<a class="${classes}" href="${esc(item.link)}" data-id="${item.id}">${inner}</a>`
    : `<div class="${classes}" data-id="${item.id}">${inner}</div>`;
}

function paintUnread(count){
  const button = document.getElementById("markAllBtn");
  if(button) button.hidden = Number(count) <= 0;

  // Keep the sidebar badge in step without a reload.
  const badge = document.getElementById("notifBadge");
  if(!badge) return;

  const n = Number(count) || 0;
  badge.textContent = n > 9 ? "9+" : String(n);
  badge.hidden = n <= 0;
}

async function loadPage(page){
  const list = document.getElementById("notifList");

  const url = "api/notifications.php?action=list&limit=" + PAGE_SIZE +
    "&page=" + encodeURIComponent(page || 1);

  try{
    const res = await fetch(url, {
      headers:{ Authorization:"Bearer " + adminToken }
    });

    const data = await res.json();

    if(!data.success){
      list.innerHTML = `<div class="empty">${esc(data.message || "Unable to load notifications.")}</div>`;
      renderPager(0, 0, 0, 0);
      return;
    }

    const rows = data.notifications || [];

    // The server clamps the page to what exists, so this is the page actually
    // being shown, not the one that was asked for.
    currentPage = Number(data.page) || 1;

    if(!rows.length){
      list.innerHTML = `<div class="empty">Nothing yet. New forms, appointments and responses will show up here.</div>`;
      renderPager(0, 0, 0, 0);
      paintUnread(data.unread);
      return;
    }

    list.innerHTML = rows.map(rowHtml).join("");

    renderPager(
      Number(data.total) || rows.length,
      Number(data.total_pages) || 1,
      (currentPage - 1) * PAGE_SIZE,
      rows.length
    );

    paintUnread(data.unread);

  }catch(err){
    list.innerHTML = `<div class="empty">Connection error.</div>`;
    renderPager(0, 0, 0, 0);
  }
}

/* The pager, same control as the content and clients lists. Paging is
   server-side here, so a page change is a fetch rather than a slice of
   something already in memory. */
function goToPage(page){
  // The open announcement belongs to a row that is about to be replaced.
  closeAnnouncement();
  loadPage(page);
  document.getElementById("notifList").scrollIntoView({ behavior:"smooth", block:"start" });
}

function renderPager(total, totalPages, start, shown){
  const pager = document.getElementById("notifPager");

  if(total <= PAGE_SIZE){
    pager.hidden = true;
    return;
  }

  pager.hidden = false;

  document.getElementById("notifPagerInfo").innerText =
    `Showing ${start + 1}-${start + shown} of ${total}`;

  const pages = Array.from({ length: totalPages }, (unused, index) => index + 1);

  document.getElementById("notifPagerPages").innerHTML = `
    <button type="button" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? "disabled" : ""}>Prev</button>
    ${pages.map(page => `
      <button type="button" class="${page === currentPage ? "current" : ""}"
              onclick="goToPage(${page})">${page}</button>
    `).join("")}
    <button type="button" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? "disabled" : ""}>Next</button>
  `;
}

/* The announcement panel. The row carries only an id; the message itself -
   description, date, image - comes from api/announcements.php, which checks
   the caller was actually sent it. */
let openAnnouncementId = null;

async function openAnnouncement(id){
  const wrap = document.getElementById("announcementWrap");

  openAnnouncementId = id;

  try{
    const res = await fetch("api/announcements.php?action=get&id=" + encodeURIComponent(id), {
      headers:{ Authorization:"Bearer " + adminToken }
    });

    const data = await res.json();

    // A second click landed first, and this reply is for the older one.
    if(openAnnouncementId !== id) return;

    if(!data.success || !data.announcement){
      wrap.hidden = true;
      return;
    }

    const item = data.announcement;

    document.getElementById("announcementTitle").innerText = item.title || "";
    document.getElementById("announcementBody").innerText = item.body || "—";
    document.getElementById("announcementDate").innerText = formatDate(item.event_date);
    document.getElementById("announcementSender").innerText = item.created_by_name || "—";
    document.getElementById("announcementSent").innerText = timeAgo(item.created_ts);

    const panel = document.getElementById("announcementPanel");
    panel.className = "detail" + (item.image_path ? "" : " no-media");

    document.getElementById("announcementMedia").style.backgroundImage =
      item.image_path ? `url('${encodeURI(item.image_path)}')` : "";

    wrap.hidden = false;
    wrap.scrollIntoView({ behavior:"smooth", block:"nearest" });

  }catch(err){
    wrap.hidden = true;
  }
}

function closeAnnouncement(){
  openAnnouncementId = null;
  document.getElementById("announcementWrap").hidden = true;
}

/* event_date is a bare Y-m-d with no time, so it is split by hand rather than
   passed to Date(), which would read it as UTC midnight and slip a day. */
function formatDate(value){
  if(!value) return "—";

  const parts = String(value).split("-");
  if(parts.length !== 3) return value;

  return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]))
    .toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"});
}

async function markRead(id){
  try{
    const res = await fetch("api/notifications.php?action=mark_read", {
      method: "POST",
      headers:{
        "Content-Type": "application/json",
        Authorization: "Bearer " + adminToken
      },
      body: JSON.stringify({ id })
    });

    const data = await res.json();
    if(data.success) paintUnread(data.unread);

  }catch(err){
    // The row still opens. Worst case it stays bold until the next load.
  }
}

async function markAllRead(){
  try{
    const res = await fetch("api/notifications.php?action=mark_all_read", {
      method: "POST",
      headers:{
        "Content-Type": "application/json",
        Authorization: "Bearer " + adminToken
      },
      body: "{}"
    });

    const data = await res.json();

    if(data.success){
      document.querySelectorAll("#notifList .notif.unread")
        .forEach(row => row.classList.remove("unread"));
      paintUnread(0);
    }

  }catch(err){
    // Nothing changes on screen; the button is still there to retry.
  }
}

/* One delegated handler, so the rows a page change redraws are covered too. */
document.getElementById("notifList").addEventListener("click", async event => {
  const row = event.target.closest(".notif");
  if(!row) return;

  const id = Number(row.dataset.id);
  const wasUnread = row.classList.contains("unread");
  row.classList.remove("unread");

  const announcementId = Number(row.dataset.announcement);

  if(announcementId){
    if(wasUnread && id) markRead(id);
    openAnnouncement(announcementId);
    return;
  }

  const href = row.tagName === "A" ? row.getAttribute("href") : "";

  if(!href){
    if(wasUnread && id) markRead(id);
    return;
  }

  // Mark first so the count is right on the page being opened, but never let
  // a failed request strand the click.
  event.preventDefault();
  if(wasUnread && id) await markRead(id);
  window.location.href = href;
});

loadPage(1);
</script>

<script src="assets/notifications.js?v=1"></script>
<script src="assets/role-nav.js?v=1"></script>
<script>
/* The calendar belongs to the roles that deal with clients. A plain seo_admin
   works on content, so the link comes out of their sidebar. api/calendar.php
   and the page itself refuse the role too - this only hides a dead link. */
(function () {
  var CALENDAR_ROLES = ["owner", "super_admin", "account_manager"];

  var role = "";
  try {
    role = (JSON.parse(localStorage.getItem("admin_user") || "{}") || {}).role || "";
  } catch (e) {}

  if (!role || CALENDAR_ROLES.indexOf(role) !== -1) return;

  document.querySelectorAll('a[href*="admin-calendar.html"]')
    .forEach(function (link) { link.remove(); });
})();
</script>
