<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Content — Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
:root{--brand:#c9000b;--nav-active:#1b1e3a;--text:#101828;--muted:#667085;--line:#eaecf0;--sidebar-w:260px}
body{background:#f6f7fb;color:var(--text);padding:0}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
.admin-sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);position:fixed;top:0;left:0;bottom:0;padding:26px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;z-index:100}
.side-nav a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--muted);padding:8px 10px;border-radius:9px;margin-bottom:2px;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.side-nav a svg{width:17px;height:17px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{width:100%;font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{width:36px;height:36px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-content{padding:10px 35px 45px}

.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;margin-bottom:26px;padding:0 2px}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}
.side-toggle{width:34px;height:34px;flex:none;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}
:root.sidebar-collapsed .side-nav a{width:38px;height:38px;padding:0;margin:0 auto 4px;border-radius:10px;justify-content:center}
:root.sidebar-collapsed .side-nav a span{display:none}
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}

/* ── Account popup (sidebar card) ── */
.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.acct-modal.show{display:flex}
.acct-box{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.acct-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef1f5}
.acct-head h2{font-size:17px}
.acct-head button{border:none;background:var(--nav-active);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.acct-body{padding:24px;text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px}
.acct-body strong{display:block;font-size:16px;margin-bottom:8px}
.acct-role{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-active);background:#eef0f6;border-radius:20px;padding:5px 12px;margin-bottom:22px}
.acct-logout{width:100%;height:46px;border:1px solid #f0d2d4;background:#fff;color:var(--brand);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.acct-logout:hover{background:#fff5f5}

/* ── Page head: back link on the left, status on the right ── */
.back-link{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:18px}
.back-link:hover{color:var(--text)}
.back-link svg{width:15px;height:15px}

.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:26px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.page-head h1{font-size:28px}

.badge{flex:none;padding:6px 13px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.badge.draft{background:#f2f4f7;color:#475467}
.badge.scheduled{background:#fff4e5;color:#b54708}
.badge.published{background:#e7f6ec;color:#067647}

/* This page never edits, so say so once instead of showing greyed-out buttons. */
.read-only{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:22px;font-size:13px;color:var(--muted)}
.read-only svg{width:16px;height:16px;flex:none;color:#98a2b3}
.read-only strong{color:var(--text);font-weight:700}

/* ── Detail panel: same markup as the grid page, orientation picks the layout ── */
.detail{display:grid;gap:28px;background:#fff;border-radius:18px;padding:26px;box-shadow:0 14px 30px rgba(0,0,0,.04)}
.detail-media{background:#f1f3f7 center/cover no-repeat;border-radius:12px;overflow:hidden}
.detail-meta{display:grid;gap:22px 40px;align-content:start}
.field h5{font-size:10px;font-weight:800;letter-spacing:.7px;color:#98a2b3;text-transform:uppercase;margin-bottom:8px}
.field p,.field .caption{font-size:15px;line-height:1.55;color:var(--text)}
.field .caption ul,.field .caption ol{padding-left:20px;margin:6px 0}
.field .caption a{color:var(--nav-active)}
.field.wide{grid-column:1/-1}

.detail.is-vertical{grid-template-columns:300px 1fr}
.detail.is-vertical .detail-media{aspect-ratio:9/16}
.detail.is-vertical .detail-meta{grid-template-columns:repeat(3,1fr)}

.detail.is-horizontal{grid-template-columns:1fr}
.detail.is-horizontal .detail-media{aspect-ratio:2.4/1;width:100%;max-width:672px;max-height:280px;margin:0 auto}
.detail.is-horizontal .detail-meta{grid-template-columns:repeat(3,1fr)}

.detail-footer{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:flex-start;gap:22px 40px}
.detail-footer .field{min-width:0}
.link-slot:empty{display:none}
.view-link{display:inline-block;font-size:13px;font-weight:800;color:#1d6fe0;text-decoration:none;white-space:nowrap}
.view-link:hover{text-decoration:underline}

.empty{background:#fff;border-radius:18px;padding:30px;color:var(--muted)}

@media(max-width:950px){
  .side-head{display:none}
  .admin-content{padding:10px 18px 40px}
  .page-head{flex-direction:column}
  .detail.is-vertical,.detail.is-horizontal{grid-template-columns:1fr}
  .detail-meta{grid-template-columns:1fr !important}
}

.side-nav a{position:relative}
.nav-badge{
  margin-left:auto;font-style:normal;font-size:11px;font-weight:800;line-height:1;
  min-width:18px;padding:3px 6px;border-radius:9px;
  background:var(--brand);color:#fff;text-align:center;
}
.nav-badge[hidden]{display:none}
.side-nav a.active .nav-badge{background:#fff;color:var(--nav-active)}
:root.sidebar-collapsed .nav-badge{
  position:absolute;top:4px;right:8px;margin:0;
  width:8px;height:8px;min-width:0;padding:0;border-radius:50%;
  font-size:0;border:2px solid #fff;
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth <= MOBILE || prefersCollapsed()); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
</script>

<script>
const adminToken = localStorage.getItem("admin_token");
const adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

(function(){
  const name = adminUser.name || "Admin";
  const label = adminUser.role === "super_admin" ? "Super Admin" : "Administrator";
  const initial = name.charAt(0).toUpperCase();
  const set = (id,value) => { const el = document.getElementById(id); if(el) el.textContent = value; };
  set("adminName",name);  set("adminRole",label);  set("adminAvatar",initial);
  set("acctName",name);   set("acctRole",label);   set("acctAvatar",initial);
})();

// The post to show comes from the query string: admin-content-view.html?id=12
const contentId = new URLSearchParams(window.location.search).get("id");

/* Captions are stored as HTML from the admin editor. The API sanitises them,
   but this page is the one calling innerHTML — strip anything unexpected here
   too. Alignment is the one piece of styling the toolbar can set, so it is
   read off the node and put back after every other attribute is dropped. */
const ALIGNMENTS = ["left","center","right","justify"];

function sanitizeCaption(html){
  const box = document.createElement("div");
  box.innerHTML = html || "";

  const allowed = ["B","STRONG","I","EM","U","UL","OL","LI","A","BR","P","DIV"];

  box.querySelectorAll("*").forEach(node => {
    // Unwrapping a script or style would leave its source behind as text.
    if(node.tagName === "SCRIPT" || node.tagName === "STYLE"){
      node.remove();
      return;
    }

    if(!allowed.includes(node.tagName)){
      node.replaceWith(...node.childNodes);
      return;
    }

    const align = ((node.style && node.style.textAlign) || node.getAttribute("align") || "")
      .toLowerCase();

    [...node.attributes].forEach(attr => {
      const keep = node.tagName === "A" && attr.name === "href"
        && !/^\s*(javascript|data|vbscript):/i.test(attr.value);
      if(!keep) node.removeAttribute(attr.name);
    });

    if(ALIGNMENTS.includes(align)) node.style.textAlign = align;

    if(node.tagName === "A"){
      node.setAttribute("target","_blank");
      node.setAttribute("rel","noopener noreferrer");
    }
  });

  return box.innerHTML;
}

/** The link shows as a "View link" action on the footer line, never a URL. */
function renderLink(item){
  const slot = document.getElementById("linkSlot");

  slot.textContent = "";

  if(!item.link || !/^https?:\/\//i.test(item.link)) return;

  const heading = document.createElement("h5");
  heading.textContent = "Link";
  slot.appendChild(heading);

  const anchor = document.createElement("a");
  anchor.className = "view-link";
  anchor.href = item.link;
  anchor.target = "_blank";
  anchor.rel = "noopener noreferrer";
  anchor.title = item.link;
  anchor.textContent = "View link";

  slot.appendChild(anchor);
}

function formatTiming(item){
  if(Number(item.publish_now) === 1) return "Published immediately";
  if(!item.post_date) return "Not scheduled";

  const time = (item.post_time || "00:00:00").slice(0,5);
  const date = new Date(item.post_date + "T" + time);
  if(isNaN(date)) return "Not scheduled";

  return date.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) + " · " + time;
}

/* When the post was created. MySQL hands back "YYYY-MM-DD HH:MM:SS", which
   only some browsers parse - the T is what makes it a valid date string
   everywhere. */
function formatCreated(item){
  if(!item.created_at) return "—";

  const date = new Date(String(item.created_at).replace(" ", "T"));

  if(isNaN(date)) return String(item.created_at);

  return date.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})
    + " · " + date.toTimeString().slice(0,5);
}

function fail(message){
  document.getElementById("viewBody").style.display = "none";

  const state = document.getElementById("viewState");
  state.style.display = "block";
  state.innerText = message;
}

async function loadContent(){

  if(!contentId){
    fail("No content selected.");
    return;
  }

  try {

    const response = await fetch(
      `api/admin-content.php?id=${encodeURIComponent(contentId)}`,
      {
        headers: {
          Authorization: "Bearer " + adminToken
        }
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {

      if (response.status === 401) {
        localStorage.removeItem("admin_token");
        localStorage.removeItem("admin_user");
        window.location.href = "admin-login.html";
        return;
      }

      fail(data.message || "Failed to load content.");
      return;
    }

    render(data.content || {});

  } catch (error) {

    console.error(error);

    fail("Connection error.");
  }
}

function render(item){

  document.getElementById("viewState").style.display = "none";
  document.getElementById("viewBody").style.display = "block";

  document.getElementById("detailEyebrow").innerText =
    `${item.platform || "—"} · ${item.type_label || "—"}`;

  document.getElementById("detailTitle").innerText = item.title || "";

  const status = document.getElementById("detailStatus");
  status.className = "badge " + (item.status || "draft");
  status.innerText = item.status || "draft";

  document.getElementById("ownerName").innerText = item.created_by || "another admin";

  // One markup block — the orientation class is what swaps the layout.
  const panel = document.getElementById("detailPanel");
  panel.className = "detail " + (item.orientation === "vertical" ? "is-vertical" : "is-horizontal");

  document.getElementById("detailMedia").style.backgroundImage =
    item.media_path ? `url('${item.media_path}')` : "";

  document.getElementById("detailCaption").innerHTML = sanitizeCaption(item.caption) || "—";

  renderLink(item);

  document.getElementById("detailClient").innerText = item.client || "—";
  document.getElementById("detailCreatedBy").innerText = item.created_by || "—";
  document.getElementById("detailScheduled").innerText = formatTiming(item);
  document.getElementById("detailTiming").innerText = formatCreated(item);
}

function logout(){
  localStorage.clear();
  window.location.href = "admin-login.html";
}

loadContent();
</script>

<script src="assets/notifications.js?v=1"></script>
</body>
