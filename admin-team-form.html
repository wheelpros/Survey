<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Form — Admin</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6f7fb;color:#101828}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
.admin-sidebar{
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  padding:26px 12px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:100;
}
.side-nav a{
  display:flex;gap:10px;align-items:center;position:relative;
  text-decoration:none;color:var(--muted);
  padding:8px 10px;border-radius:9px;margin-bottom:2px;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.side-nav a svg{width:17px;height:17px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{
  width:100%;font:inherit;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;gap:10px;align-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{
  width:36px;height:36px;border-radius:50%;
  background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-content{padding:35px}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{display:none}
:root.sidebar-collapsed .side-nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}


/* ── Sidebar head: the collapse control ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}
.side-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}

/* ── Unread badge on the Notifications nav item ── */
.nav-badge{
  margin-left:auto;font-style:normal;font-size:11px;font-weight:800;line-height:1;
  min-width:18px;padding:3px 6px;border-radius:9px;
  background:var(--brand);color:#fff;text-align:center;
}
.nav-badge[hidden]{display:none}
.side-nav a.active .nav-badge{background:#fff;color:var(--nav-active)}
:root.sidebar-collapsed .nav-badge{
  position:absolute;top:4px;right:8px;margin:0;
  width:8px;height:8px;min-width:0;padding:0;border-radius:50%;
  font-size:0;border:2px solid #fff;
}

/* ── Page header: the back arrow sits on the title line, left of it ── */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}
.back-arrow{
  flex:none;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #dfe3ea;background:#fff;color:var(--text);text-decoration:none;
}
.back-arrow:hover{background:#f6f7f9}
.back-arrow svg{width:17px;height:17px}
.page-title h1{font-size:30px;margin-bottom:8px}
.page-title p{font-size:14px;color:var(--muted);max-width:620px}
@media(max-width:950px){
  .side-head{display:none}
  .admin-content{padding:24px 18px 40px}
}
</style>
<link rel="stylesheet" href="assets/team-forms.css?v=3" />
<style>
.desc{font-size:14px;line-height:1.7;color:#344054;white-space:pre-wrap;overflow-wrap:anywhere}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:#f3f4fa;font-size:14px;color:var(--text);margin-bottom:22px}
.notice.warn{background:#fff4e5;color:#8a4b00}
.notice.done{background:#e7f6ee;color:#05603a}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}

/* Filling it in */
.q{padding:18px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:none;padding-top:4px}
.q-label{display:block;font-size:14px;font-weight:800;color:var(--text);margin-bottom:10px;line-height:1.5;overflow-wrap:anywhere}
.q-label .req{color:var(--brand);margin-left:2px}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);cursor:pointer;padding:10px 12px;border:1px solid #dfe3ea;border-radius:10px;background:#fff}
.q-opt input{width:18px;height:18px;accent-color:var(--nav-active);flex:none}
.q-opt:has(input:checked){border-color:var(--nav-active);background:#f3f4fa}
.q-file{font-size:14px}
.q-err{display:none;color:var(--brand);font-size:12px;font-weight:700;margin-top:8px}
.q.invalid .q-err{display:block}
.q.invalid .tf-input,.q.invalid .tf-textarea{border-color:var(--brand)}

/* Answers, read back */
.ans{padding:12px 0;border-top:1px solid var(--line)}
.ans:first-child{border-top:none;padding-top:0}
.ans dt{font-size:12px;font-weight:800;color:#475467;margin-bottom:4px;overflow-wrap:anywhere}
.ans dd{font-size:14px;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.ans dd.empty{color:#667085;font-style:italic}
.file-link{border:none;background:none;padding:0;font:inherit;font-size:14px;color:var(--nav-active);font-weight:700;text-decoration:underline;cursor:pointer}

/* Tracker */
.track-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.track-head h2{font-size:16px}
.track-actions{display:flex;gap:8px;flex-wrap:wrap}
.big-progress{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.big-progress .tf-bar{flex:1;width:auto;height:10px}
.big-progress strong{font-size:14px;white-space:nowrap}
.person{border-top:1px solid var(--line)}
.person:first-child{border-top:none}
.person summary{list-style:none;display:grid;grid-template-columns:36px minmax(0,1fr) auto 20px;gap:12px;align-items:center;padding:14px 0;cursor:pointer}
.person summary::-webkit-details-marker{display:none}
.person summary:focus-visible{outline:2px solid var(--nav-active);outline-offset:2px;border-radius:8px}
.person.waiting summary{cursor:default;grid-template-columns:36px minmax(0,1fr) auto}
.initial{width:36px;height:36px;border-radius:50%;background:#eef0f6;color:var(--nav-active);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center}
.who strong{display:block;font-size:14px;overflow-wrap:anywhere}
.who span{display:block;font-size:12px;color:#667085;margin-top:2px}
.chev{width:18px;height:18px;color:#667085;transition:transform .15s}
.person[open] .chev{transform:rotate(180deg)}
.person .answers{padding:0 0 16px 48px}
@media(max-width:600px){
  .person .answers{padding-left:0}
  .track-actions{width:100%}
  .track-actions .tf-btn{flex:1}
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  var DRAWER = 768;   // below this the sidebar is a drawer, never a rail
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth > DRAWER && (window.innerWidth <= MOBILE || prefersCollapsed())); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> popup. Admins have no editable profile record, so this
// is identity + logout only; system config lives on settings.html.
function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = ({ owner: "Director", super_admin: "Super Admin", account_manager: "Account Manager", seo_admin: "Admin" })[a.role] || "";
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctRole", label);
});
</script>

<body>

<aside class="admin-sidebar">
  <div>
    <div class="side-head">
      <div class="side-logo">
        <img src="logo.png" alt="Logo" onerror="this.remove()">
      </div>
      <button class="side-toggle" type="button" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
      </button>
    </div>
    <nav class="side-nav"></nav>
    <script src="assets/admin-nav.js?v=3"></script>
  </div>

  <button class="side-user" type="button" onclick="openAccount()" title="Account">
    <div class="side-avatar" id="adminAvatar">A</div>
    <div class="side-meta">
      <strong id="adminName">Admin</strong>
      <span id="adminRole"></span>
    </div>
    <svg class="side-dots" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
  </button>
</aside>

<div class="admin-main">
  <div class="admin-content">

    <div class="page-head">
      <a class="back-arrow" href="admin.html#teamForms" title="Back to Forms" aria-label="Back to Forms">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
      <div class="page-title">
        <h1 id="pageTitle">Team form</h1>
        <p id="pageSub">Loading...</p>
      </div>
    </div>

    <div id="root"><div class="tf-panel"><p class="tf-empty">Loading...</p></div></div>
    <div class="tf-status" id="status" role="status"></div>

  </div>
</div>

<!-- ACCOUNT POPUP (opened from the sidebar card) -->
<div class="acct-modal" id="acctModal">
  <div class="acct-box" role="dialog" aria-modal="true" aria-labelledby="acctTitle">
    <div class="acct-head">
      <h2 id="acctTitle">Account</h2>
      <button type="button" onclick="closeAccount()" aria-label="Close">&times;</button>
    </div>
    <div class="acct-body">
      <div class="acct-avatar" id="acctAvatar">A</div>
      <strong id="acctName">Admin</strong>
      <div class="acct-role" id="acctRole"></div>
      <button class="acct-logout" type="button" onclick="logoutAdmin()">&#8617; Log out</button>
    </div>
  </div>
</div>

<script src="assets/team-forms.js?v=3"></script>
<script src="assets/confirm.js?v=1"></script>
<script>
const adminToken = localStorage.getItem("admin_token");
const adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");
if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}
function logoutAdmin(){ tfLogout(); }

const formId = Number(new URLSearchParams(location.search).get("id")) || 0;
let form = null;
let trackTab = "answered";

const ICON_INFO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`;

function answersHtml(answers){
  if(!answers.length) return `<p class="tf-meta">No answers.</p>`;
  return `<dl>${answers.map(a => `
    <div class="ans">
      <dt>${tfEsc(a.question)}</dt>
      ${a.file_id
        ? `<dd><button class="file-link" type="button" data-file="${Number(a.file_id)}" data-name="${tfEsc(a.answer)}">${tfEsc(a.answer)}</button></dd>`
        : (a.answer ? `<dd>${tfEsc(a.answer)}</dd>` : `<dd class="empty">Nothing ticked</dd>`)}
    </div>`).join("")}</dl>`;
}

function trackerHtml(){
  const answered = form.recipients.filter(r => r.status === "submitted");
  const waiting = form.recipients.filter(r => r.status !== "submitted");
  const pct = form.progress.total ? Math.round(form.progress.answered / form.progress.total * 100) : 0;
  const shown = trackTab === "answered" ? answered : waiting;

  return `
    <div class="tf-panel">
      <div class="track-head">
        <h2>Answers</h2>
        <div class="track-actions">
          <button class="tf-btn ghost" type="button" id="exportBtn" ${answered.length ? "" : "disabled"}>Export CSV</button>
          ${form.can_close ? `<button class="tf-btn ghost" type="button" id="closeBtn">${form.status === "open" ? "Close form" : "Reopen form"}</button>` : ""}
        </div>
      </div>
      <div class="big-progress">
        <span class="tf-bar" aria-hidden="true"><i style="width:${pct}%"></i></span>
        <strong>${form.progress.answered} of ${form.progress.total} answered</strong>
      </div>
      <div class="tf-tabs" role="tablist" aria-label="Who has answered">
        <button class="tf-tab" type="button" role="tab" aria-selected="${trackTab === "answered"}" data-track="answered">Answered <span class="tf-count neutral">${answered.length}</span></button>
        <button class="tf-tab" type="button" role="tab" aria-selected="${trackTab === "waiting"}" data-track="waiting">Waiting <span class="tf-count neutral">${waiting.length}</span></button>
      </div>
      ${shown.length ? shown.map(r => `
        <details class="person ${r.status === "submitted" ? "" : "waiting"}">
          <summary ${r.status === "submitted" ? "" : `tabindex="-1" onclick="return false"`}>
            <span class="initial" aria-hidden="true">${tfEsc(String(r.name).charAt(0).toUpperCase())}</span>
            <span class="who"><strong>${tfEsc(r.name)}</strong><span>${tfEsc(r.role_name)}${r.submitted_at ? " · answered " + tfEsc(tfDate(r.submitted_at)) : ""}</span></span>
            ${tfBadge(r.status, r.overdue, form.status)}
            ${r.status === "submitted" ? `<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>` : ""}
          </summary>
          ${r.status === "submitted" ? `<div class="answers">${answersHtml(r.answers)}</div>` : ""}
        </details>`).join("")
      : `<p class="tf-empty">${trackTab === "answered" ? "Nobody has answered yet." : "Everyone has answered."}</p>`}
    </div>`;
}

function render(){
  document.title = form.title + " — Team Forms";
  document.getElementById("pageTitle").textContent = form.title;
  const bits = [form.is_sender ? "Sent by you" : "From " + (form.sender.name || "a teammate"), "sent " + tfDate(form.sent_at)];
  if(form.due_date) bits.push("due " + tfDate(form.due_date));
  if(form.target_roles.length) bits.push("to " + form.target_roles.map(r => r.name).join(", "));
  document.getElementById("pageSub").textContent = bits.join(" · ");

  const mine = form.mine;
  let html = "";
  if(form.status === "closed"){
    html += `<div class="notice">${ICON_INFO}<span>This form is closed, so it no longer takes answers.</span></div>`;
  }else if(mine && mine.overdue){
    html += `<div class="notice warn">${ICON_INFO}<span>This was due ${tfEsc(tfDate(form.due_date))}. You can still send your answers.</span></div>`;
  }
  if(form.description){
    html += `<div class="tf-panel"><p class="desc">${tfEsc(form.description)}</p></div>`;
  }

  // Sent to them: fill it in here, or read back what they sent.
  if(mine){
    if(mine.status === "submitted"){
      html += `<div class="tf-panel"><h2>Your answers</h2><p class="tf-sub">Sent ${tfEsc(tfDate(mine.submitted_at))}. Only whoever sent the form and the Director can see them.</p>${tfAnswersHtml(mine.answers)}</div>`;
    }else if(form.status === "open"){
      html += `<div class="tf-panel"><h2>Your answers</h2><p class="tf-sub">Questions marked <span style="color:var(--brand)">*</span> must be answered. You can send your answers once.</p>${tfFillHtml(form)}</div>`;
    }
  }

  // The sender, the Director, or team_forms.responses: everyone's answers.
  if(form.sees_answers) html += trackerHtml();

  document.getElementById("root").innerHTML = html;

  const fill = document.querySelector("#root .tf-fill");
  if(fill){
    fill.addEventListener("submit", async event => {
      event.preventDefault();
      const updated = await tfSubmit(fill);
      if(updated){
        form = updated;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });
  }
}

document.getElementById("root").addEventListener("click", async event => {
  const tabBtn = event.target.closest("[data-track]");
  if(tabBtn){ trackTab = tabBtn.dataset.track; render(); return; }

  const fileBtn = event.target.closest("[data-file]");
  if(fileBtn){
    tfDownload("action=file&id=" + fileBtn.dataset.file, fileBtn.dataset.name).catch(() =>
      tfStatus(document.getElementById("status"), "That file couldn't be downloaded.", "error"));
    return;
  }

  if(event.target.closest("#exportBtn")){
    tfDownload("action=export&id=" + formId, "team-form-answers.csv").catch(() =>
      tfStatus(document.getElementById("status"), "The export didn't download. Try again.", "error"));
    return;
  }

  if(event.target.closest("#closeBtn")){
    const closing = form.status === "open";
    if(closing){
      const ok = await askConfirm({
        title: "Close this form?",
        text: "People who haven't answered yet won't be able to. You can reopen it later.",
        action: "Close form",
        icon: "warn"
      });
      if(!ok) return;
    }
    const res = await tfApi("", { action: closing ? "close" : "reopen", id: formId }).catch(() => null);
    if(res && res.success){ form = res.form; render(); }
    tfStatus(document.getElementById("status"), res ? res.message : "Connection error.", res && res.success ? "ok" : "error");
  }
});

async function load(){
  const res = await tfApi("action=get&id=" + formId).catch(() => null);
  if(!res || !res.success){
    document.getElementById("pageTitle").textContent = "Form not found";
    document.getElementById("pageSub").textContent = "It may have been sent to someone else.";
    document.getElementById("root").innerHTML = `<div class="tf-panel"><div class="tf-empty"><strong>There's nothing here for you</strong><a href="admin.html">Back to Forms</a></div></div>`;
    return;
  }
  form = res.form;
  render();
}

load();
</script>
