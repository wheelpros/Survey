/* ── Pagination: the table never shows more than PAGE_SIZE rows ── */
.pager{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 24px;border-top:1px solid #eef1f5}
.pager[hidden]{display:none}
.pager-info{font-size:13px;font-weight:600;color:#667085}
.pager-pages{display:flex;gap:6px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;padding:0 12px;border:1px solid #dfe3ea;background:#fff;border-radius:9px;font:inherit;font-size:13px;font-weight:700;color:#101828;cursor:pointer}
.pager button:hover:not(:disabled){background:#f6f7f9}
.pager button.current{background:var(--nav-active);border-color:var(--nav-active);color:#fff}
.pager button:disabled{opacity:.45;cursor:not-allowed}

  padding:24px;
}

.assignment-box label{
  display:block;

.assignment-box select{
  width:100%;

.assignment-box select:focus{

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
body{padding:0}
.admin-sidebar{
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  padding:26px 12px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:100;
}
.side-logo{padding:0 6px;margin-bottom:30px}
.side-logo img{width:150px;max-width:100%;height:auto;display:block}

.side-nav a{
  display:flex;gap:12px;align-items:center;
  text-decoration:none;color:var(--muted);
  padding:11px 12px;border-radius:10px;margin-bottom:4px;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.side-nav a svg{width:18px;height:18px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{
  width:100%;font:inherit;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;gap:10px;align-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{
  width:36px;height:36px;border-radius:50%;
  background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-topbar{
  height:72px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px;
}
.admin-bell{
  width:40px;height:40px;border-radius:50%;border:none;background:transparent;
  color:#344054;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.admin-bell:hover{background:#f6f7f9}
.admin-bell{position:relative}
.admin-bell .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.admin-content{padding:35px}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{padding:0}
:root.sidebar-collapsed .side-logo img{display:none}

:root.sidebar-collapsed .side-nav a{justify-content:center;padding:12px 0}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}
@media(max-width:950px){

  .admin-content{padding:24px 18px}
}

/* ── Account popup (sidebar card) ── */
.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.acct-modal.show{display:flex}
.acct-box{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.acct-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef1f5}
.acct-head h2{font-size:17px}
.acct-head button{border:none;background:var(--nav-active);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.acct-body{padding:24px;text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px}
.acct-body strong{display:block;font-size:16px;margin-bottom:8px}
.acct-role{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-active);background:#eef0f6;border-radius:20px;padding:5px 12px;margin-bottom:22px}
.acct-logout{width:100%;height:46px;border:1px solid #f0d2d4;background:#fff;color:var(--brand);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.acct-logout:hover{background:#fff5f5}

/* ── Shell refresh: the collapse control lives in the sidebar head ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}

.side-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;

}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}

/* Tighter nav rows: the active/hover pill was heavier than the label needs. */
.side-nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .side-nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}

/* Header sits on the page background rather than its own white bar. */
.admin-topbar{
  height:64px;background:transparent;border-bottom:none;
  justify-content:flex-end;padding:0 35px;
}

@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
  .admin-topbar{padding:0 18px}
}

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth <= MOBILE || prefersCollapsed()); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> popup. Admins have no editable profile record, so this
// is identity + logout only; system config lives on settings.html.
function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = a.role === "super_admin" ? "Super Admin" : "Administrator";
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctName", name);   set("acctRole", label);   set("acctAvatar", initial);
});

<div class="panel"><div class="panel-head"><h1>Users Management</h1><p>Approve or reject new registered users.</p></div><table><thead><tr><th>ID</th><th>User</th><th>Email</th><th>Status</th><th>Created At</th><th>Actions</th></tr></thead><tbody id="usersTable"><tr><td colspan="6" class="empty">Loading users...</td></tr></tbody></table>

<script>
let adminToken = localStorage.getItem("admin_token");
let adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

// Users Management is open to every admin, so the sidebar no longer hides it.

let allUsers = [];

// Ten rows to a page; the rest live behind the pager under the table.
const USERS_PAGE_SIZE = 10;
let usersPage = 1;

function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

async function loadUsers(){
  const table = document.getElementById("usersTable");

  try{
    const res = await fetch("api/admin-users.php",{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      allUsers = [];
      document.getElementById("usersPager").hidden = true;

      table.innerHTML = `
        <tr>
          <td colspan="6" class="empty">${esc(data.message || "Unable to load users.")}</td>
        </tr>
      `;
      return;
    }

    allUsers = data.users || [];

    // Keep the page the admin was on - approving someone should not send them
    // back to page 1. renderUsers() clamps it if the page no longer exists.
    renderUsers();

  }catch(error){
    allUsers = [];
    document.getElementById("usersPager").hidden = true;

    table.innerHTML = `
      <tr>
        <td colspan="6" class="empty">Connection error.</td>
      </tr>
    `;
  }
}

function renderUsers(){
  const table = document.getElementById("usersTable");

  if(!allUsers.length){
    document.getElementById("usersPager").hidden = true;

    table.innerHTML = `
      <tr>
        <td colspan="6" class="empty">No users found.</td>
      </tr>
    `;
    return;
  }

  const totalPages = Math.max(1, Math.ceil(allUsers.length / USERS_PAGE_SIZE));

  // Rejecting the last user on the last page would otherwise leave it blank.
  if(usersPage > totalPages) usersPage = totalPages;

  const start = (usersPage - 1) * USERS_PAGE_SIZE;
  const pageUsers = allUsers.slice(start, start + USERS_PAGE_SIZE);

  table.innerHTML = pageUsers.map(user => {
    const approved = Number(user.approved) === 1;

    return `
      <tr>
        <td>#${esc(user.id)}</td>
        <td>${esc(user.name)}</td>
        <td>${esc(user.email)}</td>
        <td>
          <span class="badge ${approved ? "approved" : "pending"}">
            ${approved ? "Approved" : "Pending"}
          </span>
        </td>
        <td>${esc(user.created_at)}</td>
        <td>
          <div class="actions">
            <a class="btn action-btn" href="user-details.html?id=${esc(user.id)}">View</a>
            ${
              // Approve and Reject are the decision on a pending account, so
              // they go away once it has been made. Rejecting deletes the
              // account outright, which is why a rejected user has no row left.
              approved
              ? ""
              : `<button class="btn approve-btn" onclick="updateUser(${esc(user.id)}, 'approve')">Approve</button>
                 <button class="btn reject-btn" onclick="updateUser(${esc(user.id)}, 'reject')">Reject</button>`
            }
          </div>
        </td>
      </tr>
    `;
  }).join("");

  renderUsersPager(allUsers.length, totalPages, start, pageUsers.length);
}

function renderUsersPager(total, totalPages, start, shown){
  const pager = document.getElementById("usersPager");

  if(total <= USERS_PAGE_SIZE){
    pager.hidden = true;
    return;
  }

  pager.hidden = false;

  document.getElementById("usersPagerInfo").innerText =
    `Showing ${start + 1}–${start + shown} of ${total}`;

  const pages = Array.from({length: totalPages}, (unused, index) => index + 1);

  document.getElementById("usersPagerPages").innerHTML = `
    <button type="button" onclick="goToUsersPage(${usersPage - 1})" ${usersPage === 1 ? "disabled" : ""}>Prev</button>
    ${pages.map(page => `
      <button type="button" class="${page === usersPage ? "current" : ""}"
              onclick="goToUsersPage(${page})">${page}</button>
    `).join("")}
    <button type="button" onclick="goToUsersPage(${usersPage + 1})" ${usersPage === totalPages ? "disabled" : ""}>Next</button>
  `;
}

function goToUsersPage(page){
  usersPage = page;
  renderUsers();

  document.getElementById("usersTable").scrollIntoView({behavior:"smooth", block:"center"});
}

async function updateUser(userId, action){
  if(action === "reject"){
    const ok = confirm("Are you sure you want to reject and delete this user?");
    if(!ok) return;
  }

  try{
    const res = await fetch("api/admin-users.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + adminToken
      },
      body:JSON.stringify({
        userId,
        action
      })
    });

    const data = await res.json();

    alert(data.message);
    loadUsers();

  }catch(error){
    alert("Connection error");
  }
}
let seoAdmins = [];
let approvedUsers = [];
let seoAssignments = {};

async function loadSeoAssignments(){
  const select = document.getElementById("seoAdminSelect");

  try{
    const res = await fetch("api/admin-user-assignments.php",{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      select.innerHTML = `<option value="">Unable to load SEO admins</option>`;
      return;
    }

    seoAdmins = data.seoAdmins || [];
    approvedUsers = data.users || [];
    seoAssignments = data.assignments || {};

    if(!seoAdmins.length){
      select.innerHTML = `<option value="">No SEO admins found</option>`;
      return;
    }

    select.innerHTML = `
      <option value="">Select SEO Admin</option>
      ${seoAdmins.map(admin => `
        <option value="${admin.id}">${admin.name} - ${admin.email}</option>
      `).join("")}
    `;

  }catch(error){
    select.innerHTML = `<option value="">Connection error</option>`;
  }
}

function renderSeoUserAssignments(){
  const adminId = document.getElementById("seoAdminSelect").value;
  const box = document.getElementById("seoUsersList");

  if(!adminId){
    box.innerHTML = "";
    return;
  }

  const assigned = seoAssignments[adminId] || [];

  box.innerHTML = approvedUsers.map(user => `
    <label style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid #eef1f5;
      border-radius:12px;
      padding:12px 16px;
      margin-bottom:10px;
      background:#fff;
    ">
      <div>
        <strong>${user.name}</strong><br>
        <span style="color:#667085;font-size:12px;">${user.email}</span>
      </div>

      <input 
        type="checkbox" 
        value="${user.id}"
        ${assigned.includes(Number(user.id)) ? "checked" : ""}
        style="width:18px;height:18px;"
      >
    </label>
  `).join("");
}

async function saveSeoAssignments(){
  const adminId = document.getElementById("seoAdminSelect").value;
  const status = document.getElementById("assignmentStatus");

  if(!adminId){
    status.innerText = "Please select SEO admin.";
    return;
  }

  const userIds = Array.from(
    document.querySelectorAll("#seoUsersList input[type='checkbox']:checked")
  ).map(input => input.value);

  status.innerText = "Saving...";

  try{
    const res = await fetch("api/admin-user-assignments.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        Authorization:"Bearer " + adminToken
      },
      body:JSON.stringify({
        adminId,
        userIds
      })
    });

    const data = await res.json();
    status.innerText = data.message;

    if(data.success){
      seoAssignments[adminId] = userIds.map(id => Number(id));
    }

  }catch(error){
    status.innerText = "Connection error.";
  }
}
loadUsers();
loadSeoAssignments();
