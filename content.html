<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
:root{--brand:#c9000b;--nav-active:#1b1e3a;--text:#101828;--muted:#667085;--line:#eaecf0;--sidebar-w:260px}
body{background:#f7f8fc;color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);position:fixed;top:0;left:0;bottom:0;padding:26px 12px 18px;display:flex;flex-direction:column;justify-content:space-between}
.nav a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--muted);padding:8px 10px;border-radius:9px;margin-bottom:2px;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.nav a svg{width:17px;height:17px;flex:none}
.nav a:hover{background:#f6f7f9;color:var(--text)}
.nav a.active{background:var(--nav-active);color:#fff}
.user-card{width:100%;font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.user-card:hover{background:#fafbfc;border-color:#d7dae0}
.avatar{width:36px;height:36px;border-radius:50%;background:#dce3ff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#3745a4;background-size:cover;background-position:center;flex:none}
.user-meta{flex:1;min-width:0}
.user-meta h4{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-meta p{font-size:11px;color:#98a2b3}
.user-dots{color:#98a2b3;flex:none}
.main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.topbar{height:64px;background:transparent;border-bottom:none;display:flex;justify-content:flex-end;align-items:center;padding:0 44px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:#344054;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell:hover{background:#f6f7f9}
.bell .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}

.content{padding:34px 44px}
.page-title h1{font-size:30px;margin-bottom:8px}
.page-title p{font-size:14px;color:#667085;max-width:520px}

.filters{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:28px 0 24px}
.tabs{display:flex;background:#fff;border-radius:22px;padding:5px;gap:6px;flex-wrap:wrap}
.tabs button{border:none;background:transparent;padding:9px 18px;border-radius:20px;cursor:pointer;color:#667085;font-weight:700;font-size:13px}
.tabs button.active{background:var(--nav-active);color:#fff}
.content-search{width:260px;height:36px;border:1px solid #e1e5ed;border-radius:22px;background:#fff;padding:0 16px;outline:none;font-size:13px}

/* ── Card grid ── */
/* Every thumbnail is the same square crop regardless of orientation — only the
   detail panel below reflects the layout the admin picked. */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border-radius:14px;padding:8px;box-shadow:0 6px 18px rgba(16,24,40,.06);cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s}
.card:hover{transform:translateY(-2px)}
.card.selected{border-color:var(--nav-active)}
.card-img{background:#f1f3f7 center/cover no-repeat;aspect-ratio:1/1;border-radius:10px}
.card-body{padding:14px 8px 10px}
.card-eyebrow{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--text);text-transform:uppercase;margin-bottom:7px}
.card-body h3{font-size:13px;font-weight:400;line-height:1.4;color:var(--muted)}

/* ── Detail panel: one markup block, the orientation class picks the layout ── */
.detail-wrap{margin-top:40px}
.detail-head{margin-bottom:18px}
.detail-head .eyebrow{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.detail-head h2{font-size:26px}

.detail{display:grid;gap:28px;background:#fff;border-radius:18px;padding:26px;box-shadow:0 14px 30px rgba(0,0,0,.04)}
.detail-media{background:#f1f3f7 center/cover no-repeat;border-radius:12px;overflow:hidden}
.detail-meta{display:grid;gap:22px 40px;align-content:start}
.field h5{font-size:10px;font-weight:800;letter-spacing:.7px;color:#98a2b3;text-transform:uppercase;margin-bottom:8px}
.field p,.field .caption{font-size:15px;line-height:1.55;color:var(--text)}
.field .caption ul,.field .caption ol{padding-left:20px;margin:6px 0}
.field .caption a{color:var(--nav-active)}
.field.wide{grid-column:1/-1}

/* Portrait media sits beside the copy. */
.detail.is-vertical{grid-template-columns:300px 1fr}
.detail.is-vertical .detail-media{aspect-ratio:9/16}
.detail.is-vertical .detail-meta{grid-template-columns:1fr 1fr}

/* Landscape media banners across the top. */
.detail.is-horizontal{grid-template-columns:1fr}
/* A full-width 16/9 banner runs enormous on a wide screen, so the horizontal
   media is a shorter strip, capped and centred rather than stretched edge to edge. */
.detail.is-horizontal .detail-media{aspect-ratio:2.4/1;width:100%;max-width:672px;max-height:280px;margin:0 auto}
.detail.is-horizontal .detail-meta{grid-template-columns:repeat(3,1fr)}

.empty{background:#fff;border-radius:18px;padding:30px;color:#667085;grid-column:1/-1}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.sidebar,.main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .nav a{width:38px;height:38px;padding:0;margin:0 auto 4px;border-radius:10px;justify-content:center}
:root.sidebar-collapsed .nav a span{display:none}
/* The account card is the only route to profile and logout — collapse it, never hide it. */
:root.sidebar-collapsed .user-card{justify-content:center;padding:8px}
:root.sidebar-collapsed .user-meta,:root.sidebar-collapsed .user-dots{display:none}

/* ── The collapse control lives in the sidebar head ── */
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;margin-bottom:26px;padding:0 2px}
.logo{padding:0;margin:0;flex:1;min-width:0}
.logo img{width:132px;max-width:100%;height:auto;display:block}
.sidebar-toggle{width:34px;height:34px;flex:none;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.sidebar-toggle:hover{background:#f2f4f8;color:var(--text)}
.sidebar-toggle svg{width:18px;height:18px}
/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .logo{display:none}

/* The account card opens a dropup; it is the only route to profile and logout. */
.account{position:relative}
.account-menu{position:absolute;bottom:calc(100% + 8px);left:0;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,40,.14);padding:6px;display:none;z-index:200}
.account.open .account-menu{display:block}
.account-menu a,.account-menu button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;border-radius:9px;font:inherit;font-size:13px;font-weight:700;color:var(--text);text-align:left;text-decoration:none;cursor:pointer}
.account-menu a:hover,.account-menu button:hover{background:#f6f7f9}
.account-menu svg{width:16px;height:16px;flex:none;color:var(--muted)}
.account-menu .danger,.account-menu .danger svg{color:var(--brand)}
.account-menu .danger:hover{background:#fff5f5}

@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
  .topbar{padding:0 20px}
  .content{padding:24px 18px}
  .grid{grid-template-columns:1fr}
  .filters{flex-direction:column;align-items:flex-start}
  .content-search{width:100%}
  .detail.is-vertical,.detail.is-horizontal{grid-template-columns:1fr}
  .detail-meta{grid-template-columns:1fr !important}
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){
    root.classList.toggle("sidebar-collapsed", window.innerWidth <= MOBILE || prefersCollapsed());
  }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> dropup with Profile / Logout.
(function () {
  function menu() { return document.getElementById("account"); }
  function close() {
    var el = menu();
    if (!el || !el.classList.contains("open")) return;
    el.classList.remove("open");
    el.querySelector(".user-card").setAttribute("aria-expanded", "false");
  }
  window.toggleAccountMenu = function () {
    var el = menu();
    var open = el.classList.toggle("open");
    el.querySelector(".user-card").setAttribute("aria-expanded", open ? "true" : "false");
  };
  document.addEventListener("click", function (e) {
    var el = menu();
    if (el && !el.contains(e.target)) close();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") close();
  });
})();
</script>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div>
    <div class="side-head">
      <div class="logo">
        <img src="logo.png" alt="W|ZONE London" onerror="this.onerror=null;this.src='assets/WZONE%20source.png'">
      </div>
      <button class="sidebar-toggle" type="button" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
      </button>
    </div>
    <nav class="nav">
      <a href="dashboard.html" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="user-appointments.html" title="Appointments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        <span>Appointments</span>
      </a>
      <a href="articles.html" title="Reports &amp; Articles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5M9 13h6M9 17h4"/></svg>
        <span>Reports &amp; Articles</span>
      </a>
      <a href="content.html" class="active" title="Content">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <span>Content</span>
      </a>
      <a href="help.html" title="Help Center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.4v.4"/><path d="M12 17h.01"/></svg>
        <span>Help Center</span>

    </nav>
  </div>

  <div class="account" id="account">
    <button class="user-card" type="button" onclick="toggleAccountMenu()" aria-haspopup="true" aria-expanded="false" title="Account">
      <div class="avatar" id="sideAvatar">U</div>
      <div class="user-meta">
        <h4 id="sideName">User</h4>
        <p>Pro Member</p>
      </div>
      <svg class="user-dots" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
    </button>
    <div class="account-menu" role="menu">
      <a role="menuitem" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a>
      <button role="menuitem" type="button" class="danger" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Logout</span></button>
    </div>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="bell" type="button" title="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-3 7-3 7h18s-3-1-3-7"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot"></span>
    </button>
  </header>

  <section class="content">
    <div class="page-title">
      <h1>Content</h1>
      <p>Everything ready to publish — social posts, newsletters, infographics and more.</p>
    </div>

    <div class="filters">
      <div class="tabs" id="contentTabs">
        <button class="active">All</button>
      </div>
      <input class="content-search" id="contentSearch" placeholder="Search content...">
    </div>

    <div class="grid" id="contentGrid">
      <div class="empty">Loading content...</div>
    </div>

    <div class="detail-wrap" id="detailWrap" style="display:none">
      <div class="detail-head">
        <div class="eyebrow" id="detailEyebrow"></div>
        <h2 id="detailTitle"></h2>
      </div>

      <article class="detail is-horizontal" id="detailPanel">
        <div class="detail-media" id="detailMedia"></div>
        <div class="detail-meta">
          <div class="field wide">
            <h5>Caption</h5>
            <div class="caption" id="detailCaption"></div>
          </div>
          <div class="field">
            <h5>Client</h5>
            <p id="detailClient">—</p>
          </div>
          <div class="field">
            <h5>Created by</h5>
            <p id="detailCreatedBy">—</p>
          </div>
          <div class="field">
            <h5>Timing</h5>
            <p id="detailTiming">Not scheduled</p>
          </div>
        </div>
      </article>
    </div>
  </section>
</main>

</div>

<script>
const token = localStorage.getItem("portal_token");

if(!token){
  window.location.href = "login.html";
}

const user = JSON.parse(localStorage.getItem("portal_user") || "{}");
document.getElementById("sideName").innerText = user.name || "User";
setAvatarImage(user);

let allContent = [];
let currentCategory = "All";
let selectedId = null;

function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// Captions are stored as HTML from the admin editor. The API sanitises them, but
// this page is the one calling innerHTML — strip anything unexpected here too.
function sanitizeCaption(html){
  const box = document.createElement("div");
  box.innerHTML = html || "";

  const allowed = ["B","STRONG","I","EM","U","UL","OL","LI","A","BR","P"];

  box.querySelectorAll("*").forEach(node => {
    if(!allowed.includes(node.tagName)){
      node.replaceWith(...node.childNodes);
      return;
    }

    [...node.attributes].forEach(attr => {
      const keep = node.tagName === "A" && attr.name === "href"
        && !/^\s*(javascript|data|vbscript):/i.test(attr.value);
      if(!keep) node.removeAttribute(attr.name);
    });

    if(node.tagName === "A"){
      node.setAttribute("target","_blank");
      node.setAttribute("rel","noopener noreferrer");
    }
  });

  return box.innerHTML;
}

function formatTiming(item){
  if(Number(item.publish_now) === 1) return "Published immediately";
  if(!item.post_date) return "Not scheduled";

  const time = (item.post_time || "00:00:00").slice(0,5);
  const date = new Date(item.post_date + "T" + time);

  if(isNaN(date)) return "Not scheduled";

  return date.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) + " · " + time;
}

// Front end only for now. Fill `allContent` from an API here and everything
// below - tabs, search, cards, the orientation-aware detail panel - renders as is.
async function loadContent(){
  const grid = document.getElementById("contentGrid");
  grid.innerHTML = `<div class="empty">Loading content...</div>`;

  try {
    const res = await fetch("https://survey.websitezone.co.uk/api/user-content.php", {
  headers: {
    "Authorization": "Bearer " + token
  }
});

    const data = await res.json();

    if(data.success && data.content && data.content.length > 0){
      allContent = data.content;
      renderFilters();
      applyFilters();
    } else {
      grid.innerHTML = `<div class="empty">No content available for you yet.</div>`;
    }
  } catch (err) {
    console.error(err);
    grid.innerHTML = `<div class="empty">Failed to load content.</div>`;
  }
}

function renderFilters(){
  const tabs = document.getElementById("contentTabs");

  const categories = ["All", ...new Set(allContent.map(item => item.category).filter(Boolean))];

  tabs.innerHTML = categories.map(category => `
    <button class="${category === currentCategory ? "active" : ""}"
            onclick="filterByCategory('${esc(category)}', this)">${esc(category)}</button>
  `).join("");
}

function filterByCategory(category, button){
  currentCategory = category;

  document.querySelectorAll("#contentTabs button").forEach(btn => btn.classList.remove("active"));
  button.classList.add("active");

  applyFilters();
}

document.getElementById("contentSearch").addEventListener("input", applyFilters);

function applyFilters(){
  const search = document.getElementById("contentSearch").value.toLowerCase().trim();

  let filtered = allContent;

  if(currentCategory !== "All"){
    filtered = filtered.filter(item => item.category === currentCategory);
  }

  if(search){
    filtered = filtered.filter(item =>
      (item.title || "").toLowerCase().includes(search) ||
      (item.type_label || "").toLowerCase().includes(search) ||
      (item.platform || "").toLowerCase().includes(search)
    );
  }

  renderGrid(filtered);

  // Keep the current selection when it survives the filter, otherwise take the first.
  const stillVisible = filtered.some(item => String(item.id) === String(selectedId));
  selectContent(stillVisible ? selectedId : (filtered[0] ? filtered[0].id : null));
}

function renderGrid(items){
  const grid = document.getElementById("contentGrid");

  if(!items.length){
    grid.innerHTML = `<div class="empty">No content found.</div>`;
    return;
  }

  grid.innerHTML = items.map(item => `
    <div class="card ${String(item.id) === String(selectedId) ? "selected" : ""}"
         data-id="${esc(item.id)}" onclick="selectContent('${esc(item.id)}')">
      <div class="card-img" style="${item.media_path ? `background-image:url('${esc(item.media_path)}')` : ""}"></div>
      <div class="card-body">
        <div class="card-eyebrow">${esc(item.platform)} · ${esc(item.type_label)}</div>
        <h3>${esc(item.title)}</h3>
      </div>
    </div>
  `).join("");
}

function selectContent(id){
  const wrap = document.getElementById("detailWrap");

  if(id == null){
    selectedId = null;
    wrap.style.display = "none";
    return;
  }

  const item = allContent.find(entry => String(entry.id) === String(id));
  if(!item) return;

  selectedId = item.id;

  document.querySelectorAll("#contentGrid .card").forEach(card => {
    card.classList.toggle("selected", card.dataset.id === String(selectedId));
  });

  wrap.style.display = "block";

  document.getElementById("detailEyebrow").innerText = `${item.platform} · ${item.type_label}`;
  document.getElementById("detailTitle").innerText = item.title || "";

  // One markup block — the orientation class is what swaps the layout.
  const panel = document.getElementById("detailPanel");
  panel.className = "detail " + (item.orientation === "vertical" ? "is-vertical" : "is-horizontal");

  const media = document.getElementById("detailMedia");
  media.style.backgroundImage = item.media_path ? `url('${item.media_path}')` : "";

  document.getElementById("detailCaption").innerHTML = sanitizeCaption(item.caption) || "—";
  document.getElementById("detailClient").innerText = item.client || "—";
  document.getElementById("detailCreatedBy").innerText = item.created_by || "—";
  document.getElementById("detailTiming").innerText = formatTiming(item);
}

function setAvatarImage(user){
  const avatar = document.getElementById("sideAvatar");
  if(!avatar) return;

  if(user.profile_image){
    avatar.innerText = "";
    avatar.style.backgroundImage = `url('${user.profile_image}')`;
  }else{
    avatar.innerText = (user.name || "User").charAt(0).toUpperCase();
    avatar.style.backgroundImage = "";
  }
}

function logout(){
  localStorage.clear();
  window.location.href = "login.html";
}

loadContent();
</script>

</body>
</html>
