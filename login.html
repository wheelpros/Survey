<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f6f6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        color: #171717;
      }

      .auth-wrapper {
        width: 100%;
        max-width: 560px;
      }

      .card {
        background: #fff;
        border-radius: 24px;
        padding: 34px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      .login-card {
        margin-top: 20px;
      }

      .tabs {
        display: flex;
        background: #eef0f3;
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 32px;
      }

      .tabs button {
        flex: 1;
        border: none;
        background: transparent;
        padding: 13px 10px;
        border-radius: 10px;
        font-weight: 700;
        color: #7b8491;
        cursor: pointer;
      }

      .tabs button.active {
        background: #fff;
        color: #1b1e3a;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      .form-group {
        margin-bottom: 22px;
      }

      .form-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 8px;
      }

      .login-card label {
        text-transform: none;
        letter-spacing: 0;
      }

      .login-card .form-row label {
        margin-bottom: 0;
      }

      .login-card .form-row {
        margin-bottom: 6px;
      }

      .forgot {
        font-size: 12px;
        color: #1b1e3a;
        text-decoration: none;
        font-weight: 700;
      }

      .input-box {
        position: relative;
      }

      .input-box span {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #98a1ad;
        font-size: 18px;
      }

      .input-box input {
        width: 100%;
        height: 54px;
        border: 1px solid #e0e3e8;
        background: #f1f3f6;
        border-radius: 8px;
        padding: 0 45px;
        outline: none;
        font-size: 14px;
        color: #111827;
      }

      .input-box input:focus {
        border-color: #1b1e3a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(27, 30, 58, 0.10);
      }

      .eye {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        cursor: pointer;
        color: #98a1ad;
        font-size: 17px;
      }

      .submit {
        width: 100%;
        height: 56px;
        border: none;
        background: #1b1e3a;
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 12px 20px rgba(27, 30, 58, 0.18);
      }

      .submit:hover {
        background: #282c50;
      }

      .divider {
        height: 1px;
        background: #e5e7eb;
        margin: 34px 0 26px;
      }

      .helper {
        text-align: center;
        color: #8b95a1;
        font-size: 13px;
        margin-bottom: 12px;
      }

      .admin-link {
        text-align: center;
        font-size: 14px;
        font-weight: 800;
      }

      .admin-link a {
        color: #171717;
        text-decoration: none;
      }

      .note {
        font-size: 11px;
        color: #98a1ad;
        margin-top: 8px;
      }

      .terms {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: #333;
        margin: 20px 0 24px;
        text-transform: none;
        letter-spacing: 0;
      }

      .terms input {
        width: 16px;
        height: 16px;
        accent-color: #1b1e3a;
      }

      .terms a {
        color: #1b1e3a;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .status {
        min-height: 22px;
        margin-top: 14px;
        text-align: center;
        font-size: 13px;
        color: #64748b;
      }

      .status.error {
        color: #c9000b;
        font-weight: 700;
      }

      @media (max-width: 900px) {
        .auth-wrapper {
          grid-template-columns: 1fr;
          gap: 24px;
          max-width: 520px;
        }

        .login-card {
          margin-top: 0;
        }
      }
      .login-card {
        display: none;
      }

      .register-card {
        display: block;
      }

      .switch-text {
        text-align: center;
        margin-top: 26px;
        color: #8b95a1;
        font-size: 14px;
      }

      .switch-text a {
        color: #1b1e3a;
        font-weight: 800;
        text-decoration: none;
      }

      .switch-text button {
        border: none;
        background: transparent;
        color: #1b1e3a;
        font: inherit;
        font-weight: 800;
        padding: 0;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="auth-wrapper">
      <!-- Login Card -->
      <div class="card login-card">
        <div class="tabs">
          <button class="active" onclick="showLogin()">Log In</button>
          <button onclick="showRegister()">Register</button>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-box">
            <span>✉</span>
            <input
              type="email"
              id="loginEmail"
              placeholder="name@company.com"
            />
          </div>
        </div>

        <div class="form-group">
          <div class="form-row">
            <label>Password</label>
            <a href="forgot-password.html" class="forgot">
  Forgot password?
</a>
          </div>
          <div class="input-box">
            <span>🔒</span>
            <input type="password" id="loginPassword" placeholder="••••••••" />
            <button
              class="eye"
              type="button"
              onclick="togglePassword('loginPassword')"
            >
              ◉
            </button>
          </div>
        </div>

        <button class="submit" onclick="loginUser()">Log In →</button>
        <button
          class="submit"
          type="button"
          onclick="devBypass()"
          style="
            margin-top: 12px;
            background: #101828;
            box-shadow: none;
          "
        >
          🛠 Dev Mode — Skip Login
        </button>
        <div class="switch-text">
          New to the platform?
          <button
            type="button"
            onclick="window.location.href = 'admin-login.html'"
            style="text-decoration: underline; color: #000000"
          >
            Sign Up
          </button>
        </div>

        <div class="status" id="loginStatus"></div>
      </div>

      <!-- Register Card -->
      <div class="card register-card">
        <div class="tabs">
          <button onclick="showLogin()">Log In</button>
          <button class="active" onclick="showRegister()">Register</button>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <div class="input-box">
            <span>♙</span>
            <input type="text" id="registerName" placeholder="John Doe" />
          </div>
        </div>

        <div class="form-group">
          <label>Work Email</label>
          <div class="input-box">
            <span>✉</span>
            <input
              type="email"
              id="registerEmail"
              placeholder="name@company.com"
            />
          </div>
        </div>

        <div class="form-group">
          <label>Company Name</label>
          <div class="input-box">
            <span>▦</span>
            <input
              type="text"
              id="companyName"
              placeholder="Acme Corporation"
            />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-box">
            <span>🔒</span>
            <input
              type="password"
              id="registerPassword"
              placeholder="••••••••"
            />
            <button
              class="eye"
              type="button"
              onclick="togglePassword('registerPassword')"
            >
              ◉
            </button>
          </div>
          <div class="note">
            Requires 8+ characters with uppercase and symbols.
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" id="termsCheck" />
          <span
            >I agree to the <a href="#">Terms</a> and
            <a href="#">Privacy Policy</a>.</span
          >
        </label>

        <button class="submit" onclick="registerUser()">Register →</button>
        <div class="switch-text">
          Already have an account?
          <button
            type="button"
            onclick="showLogin()"
            style="text-decoration: underline; color: #000000""
          >
            Log In
          </button>
        </div>

        <div class="status" id="registerStatus"></div>
      </div>
    </div>

    <script>
      const API_BASE = "api";

      function showLogin() {
        document.querySelector(".login-card").style.display = "block";
        document.querySelector(".register-card").style.display = "none";

        document.getElementById("loginStatus").innerText = "";
        document.getElementById("registerStatus").innerText = "";
      }

      function showRegister() {
        document.querySelector(".register-card").style.display = "block";
        document.querySelector(".login-card").style.display = "none";

        document.getElementById("loginStatus").innerText = "";
        document.getElementById("registerStatus").innerText = "";
      }

      function togglePassword(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
      }

      // Dev-only: skip real auth so the frontend can be edited without a backend.
      function devBypass() {
        localStorage.setItem("portal_token", "bypass_token");
        localStorage.setItem(
          "portal_user",
          JSON.stringify({ id: 1, name: "Dev User", email: "dev@local", role: "user" })
        );
        window.location.href = "dashboard.html";
      }

      async function loginUser() {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();
        const status = document.getElementById("loginStatus");

        status.classList.remove("error");

        if (!email || !password) {
          status.classList.add("error");
          status.innerText = "Please enter email and password.";
          return;
        }

        status.innerText = "Please wait...";

        try {
          const res = await fetch(`${API_BASE}/login.php`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email,
              password,
            }),
          });

          const data = await res.json();

          status.innerText = data.message;

          if (!data.success) {
            status.classList.add("error");
            return;
          }

          localStorage.setItem("portal_token", data.token);
          localStorage.setItem("portal_user", JSON.stringify(data.user));

          window.location.href = "dashboard.html";
        } catch (error) {
          status.classList.add("error");
          status.innerText = "Connection error.";
        }
      }

      async function registerUser() {
        const name = document.getElementById("registerName").value.trim();
        const email = document.getElementById("registerEmail").value.trim();
        const company = document.getElementById("companyName").value.trim();
        const password = document
          .getElementById("registerPassword")
          .value.trim();
        const terms = document.getElementById("termsCheck").checked;
        const status = document.getElementById("registerStatus");

        status.classList.remove("error");

        if (!name || !email || !company || !password) {
          status.classList.add("error");
          status.innerText = "Please fill all required fields.";
          return;
        }

        if (!terms) {
          status.classList.add("error");
          status.innerText = "Please accept terms and privacy policy.";
          return;
        }

        status.innerText = "Please wait...";

        try {
          const res = await fetch(`${API_BASE}/register.php`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name,
              email,
              company,
              password,
            }),
          });

          const data = await res.json();

          status.innerText = data.message;

          if (!data.success) {
            status.classList.add("error");
            return;
          }

          alert("Account created. Please wait for admin approval.");
          showLogin();
          document.getElementById("registerName").value = "";
          document.getElementById("registerEmail").value = "";
          document.getElementById("companyName").value = "";
          document.getElementById("registerPassword").value = "";
          document.getElementById("termsCheck").checked = false;
        } catch (error) {
          status.classList.add("error");
          status.innerText = "Connection error.";
        }
      }
      showRegister();
      const token = localStorage.getItem("portal_token");

      if (token) {
        window.location.href = "dashboard.html";
      }
    </script>
  </body>
</html>
