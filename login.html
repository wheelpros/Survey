<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Register</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f6f6f6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        color: #171717;
      }

      .auth-wrapper {
        width: 100%;
        max-width: 560px;
      }

      /* The form sits straight on the page - no panel, no shadow. The padding
         stays so the fields keep their breathing room on narrow screens. */
      .card {
        background: transparent;
        border-radius: 0;
        padding: 34px 0;
        box-shadow: none;
      }

      .login-card {
        margin-top: 20px;
      }

      /* Same logo treatment as the sidebar: logo.png when the admin has
         uploaded one, the bundled wordmark otherwise. */
      .brand {
        text-align: center;
        margin-bottom: 26px;
      }

      .brand img {
        width: 132px;
        max-width: 100%;
        height: auto;
        display: inline-block;
      }

      .auth-foot {
        margin: 26px 0 0;
        text-align: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: #98a1ad;
      }

      .tabs {
        display: flex;
        background: #eef0f3;
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 32px;
      }

      .tabs button {
        flex: 1;
        border: none;
        background: transparent;
        padding: 13px 10px;
        border-radius: 10px;
        font-weight: 700;
        color: #7b8491;
        cursor: pointer;
      }

      .tabs button.active {
        background: #fff;
        color: #1b1e3a;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      .form-group {
        margin-bottom: 22px;
      }

      .form-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 400;
        text-transform: capitalize;
        letter-spacing: 0.4px;
        margin-bottom: 8px;
      }

      .login-card label {
        letter-spacing: 0;
      }

      .login-card .form-row label {
        margin-bottom: 0;
      }

      .login-card .form-row {
        margin-bottom: 6px;
      }

      .forgot {
        font-size: 12px;
        color: #1b1e3a;
        text-decoration: none;
        font-weight: 700;
      }

      .input-box {
        position: relative;
      }

      .input-box span {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #98a1ad;
        font-size: 18px;
      }

      .input-box input {
        width: 100%;
        height: 54px;
        border: 1px solid #e0e3e8;
        background: #f1f3f6;
        border-radius: 8px;
        padding: 0 45px;
        outline: none;
        font-size: 14px;
        color: #111827;
      }

      .input-box input:focus {
        border-color: #1b1e3a;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(27, 30, 58, 0.10);
      }

      .eye {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        cursor: pointer;
        color: #98a1ad;
        font-size: 17px;
      }

      .submit {
        width: 100%;
        height: 56px;
        border: none;
        background: #1b1e3a;
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 12px 20px rgba(27, 30, 58, 0.18);
      }

      .submit:hover {
        background: #282c50;
      }

      .divider {
        height: 1px;
        background: #e5e7eb;
        margin: 34px 0 26px;
      }

      .helper {
        text-align: center;
        color: #8b95a1;
        font-size: 13px;
        margin-bottom: 12px;
      }

      .admin-link {
        text-align: center;
        font-size: 14px;
        font-weight: 800;
      }

      .admin-link a {
        color: #171717;
        text-decoration: none;
      }

      .note {
        font-size: 11px;
        color: #98a1ad;
        margin-top: 8px;
      }

      .terms {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: #333;
        margin: 20px 0 24px;
        text-transform: none;
        letter-spacing: 0;
      }

      .terms input {
        width: 16px;
        height: 16px;
        accent-color: #1b1e3a;
      }

      .terms a {
        color: #1b1e3a;
        text-decoration: none;
        font-weight: 800;
        letter-spacing: 0.3px;
      }

      .status {
        min-height: 22px;
        margin-top: 14px;
        text-align: center;
        font-size: 13px;
        color: #64748b;
      }

      .status.error {
        color: #c9000b;
        font-weight: 700;
      }

      .login-card {
        display: none;
      }

      .register-card {
        display: block;
      }

      .switch-text {
        text-align: center;
        margin-top: 26px;
        color: #8b95a1;
        font-size: 14px;
      }

      .switch-text a {
        color: #1b1e3a;
        font-weight: 800;
        text-decoration: none;
      }

      .switch-text button {
        border: none;
        background: transparent;
        color: #1b1e3a;
        font: inherit;
        font-weight: 800;
        padding: 0;
        cursor: pointer;
      }

      /* ── Slideshow beside the form ──────────────────────────────────────
         Everything here is inert until JS adds body.has-slides, which it
         only does once a real slide image has decoded. With no slides - no
         rows, a failed fetch, a dead DB - the page above is untouched. */

      .auth-layout {
        width: 100%;
      }

      body.has-slides {
        padding: 0;
        align-items: stretch;
      }

      body.has-slides .auth-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        min-height: 100vh;
      }

      /* Centres .auth-wrapper in both layouts. Without slides the wrapper is
         no longer body's own flex child, so it cannot inherit body's
         justify-content the way it did before the column was added - without
         this it sits against the left edge at its 560px max-width. */
      .auth-pane {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }

      body.has-slides .auth-pane {
        padding: 40px 20px;
      }

      .auth-slideshow {
        position: sticky;
        top: 0;
        height: 100vh;
        /* Kept after the vh line so browsers without dvh still get a height. */
        height: 100dvh;
        overflow: hidden;
        background: #1b1e3a;
      }

      .auth-slideshow[hidden] {
        display: none;
      }

      /* Keeps captions and dots readable over a pale photo. */
      .auth-slideshow::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(12, 14, 30, 0.78) 0%,
          rgba(12, 14, 30, 0.35) 32%,
          rgba(12, 14, 30, 0) 62%
        );
      }

      .slide-stack {
        position: absolute;
        inset: 0;
      }

      .slide {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        transition: opacity 0.9s ease;
      }

      .slide.active {
        opacity: 1;
      }

      /* The column is a tall half-screen rectangle, so the image is scaled to
         cover it and centre-cropped - its aspect ratio is never distorted. */
      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Sits low over the image, just clear of the dot rail below it. */
      .slide figcaption {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 60px;
        z-index: 2;
        color: #fff;
      }

      .slide figcaption h2 {
        margin: 0;
        font-size: 28px;
        line-height: 1.25;
        font-weight: 400;
        max-width: 32ch;
      }

      .slide figcaption p {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.55;
        opacity: 0.85;
        max-width: 32ch;
      }

      .slide-dots {
        position: absolute;
        left: 48px;
        bottom: 30px;
        z-index: 3;
        display: flex;
        gap: 8px;
      }

      /* A single slide needs no rail. */
      .slide-dots:empty {
        display: none;
      }

      .slide-dots button {
        width: 9px;
        height: 9px;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.45);
        cursor: pointer;
        transition: width 0.3s ease, background 0.3s ease;
      }

      .slide-dots button.active {
        width: 26px;
        background: #fff;
      }

      .slide-dots button:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        .slide {
          transition: none;
        }

        .slide-dots button {
          transition: none;
        }
      }

      /* Kept last on purpose: the rules it overrides are all above it. */
      @media (max-width: 900px) {
        .auth-wrapper {
          grid-template-columns: 1fr;
          gap: 24px;
          max-width: 520px;
        }

        .login-card {
          margin-top: 0;
        }

        .auth-slideshow {
          display: none;
        }

        body.has-slides {
          padding: 40px 20px;
          align-items: center;
        }

        body.has-slides .auth-layout {
          display: block;
          min-height: 0;
        }

        body.has-slides .auth-pane {
          padding: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="auth-layout">
      <!-- Stays hidden unless an admin has uploaded slides in Settings and
           the first image actually decodes - see loadLoginSlides(). -->
      <aside class="auth-slideshow" id="authSlideshow" hidden aria-hidden="true">
        <div class="slide-stack" id="slideStack"></div>
        <div class="slide-dots" id="slideDots"></div>
      </aside>

      <div class="auth-pane">
    <div class="auth-wrapper">
      <!-- Login Card -->
      <div class="card login-card">
        <div class="brand">
          <img src="logo.png" alt="W|ZONE London"
               onerror="this.onerror=null;this.src='assets/WZONE%20source.png'" />
        </div>

        <div class="tabs">
          <button class="active" onclick="showLogin()">Log In</button>
          <button onclick="showRegister()">Register</button>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-box">
            <span>✉</span>
            <input type="email" id="loginEmail" />
          </div>
        </div>

        <div class="form-group">
          <div class="form-row">
            <label>Password</label>
            <a href="forgot-password.html" class="forgot">Forgot password?</a>
          </div>
          <div class="input-box">
            <span>🔒</span>
            <input type="password" id="loginPassword" />
            <button
              class="eye"
              type="button"
              onclick="togglePassword('loginPassword')"
            >
              ◉
            </button>
          </div>
        </div>

        <button class="submit" onclick="loginUser()">Log In →</button>

        <!-- Local preview only: skips the API so the pages behind the login can
             be looked at without a database. Hidden unless the page is being
             served from localhost, so it never renders in production. -->
        <button class="submit" type="button" id="devBypass" hidden
                onclick="devBypass()"
                style="margin-top:10px;background:#eef0f6;color:#1b1e3a;">
          Bypass login (local preview)
        </button>
        <div class="switch-text">
          New to the platform?
          <button
            type="button"
            onclick="window.location.href = 'admin-login.html'"
            style="text-decoration: underline; color: #000000"
          >
            Sign Up
          </button>
        </div>

        <div class="status" id="loginStatus"></div>

        <p class="auth-foot">
          &copy; <span class="yr"></span> WZONE London. All rights reserved.
        </p>
      </div>

      <!-- Register Card -->
      <div class="card register-card">
        <div class="brand">
          <img src="logo.png" alt="W|ZONE London"
               onerror="this.onerror=null;this.src='assets/WZONE%20source.png'" />
        </div>

        <div class="tabs">
          <button onclick="showLogin()">Log In</button>
          <button class="active" onclick="showRegister()">Register</button>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <div class="input-box">
            <span>♙</span>
            <input type="text" id="registerName" />
          </div>
        </div>

        <div class="form-group">
          <label>Work Email</label>
          <div class="input-box">
            <span>✉</span>
            <input type="email" id="registerEmail" />
          </div>
        </div>

        <div class="form-group">
          <label>Company Name</label>
          <div class="input-box">
            <span>▦</span>
            <input type="text" id="companyName" />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-box">
            <span>🔒</span>
            <input type="password" id="registerPassword" />
            <button
              class="eye"
              type="button"
              onclick="togglePassword('registerPassword')"
            >
              ◉
            </button>
          </div>
          <div class="note">
            Requires 8+ characters with uppercase and symbols.
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" id="termsCheck" />
          <span
            >I agree to the <a href="#">Terms</a> and
            <a href="#">Privacy Policy</a>.</span
          >
        </label>

        <button class="submit" onclick="registerUser()">Register →</button>
        <div class="switch-text">
          Already have an account?
          <button
            type="button"
            onclick="showLogin()"
            style="text-decoration: underline; color: #000000"
          >
            Log In
          </button>
        </div>

        <div class="status" id="registerStatus"></div>

        <p class="auth-foot">
          &copy; <span class="yr"></span> WZONE London. All rights reserved.
        </p>
      </div>
    </div>
      </div>
    </div>

    <script>
      const API_BASE = "api";

      document.querySelectorAll(".yr").forEach(
        (el) => (el.textContent = new Date().getFullYear())
      );

      function showLogin() {
        document.querySelector(".login-card").style.display = "block";
        document.querySelector(".register-card").style.display = "none";

        document.getElementById("loginStatus").innerText = "";
        document.getElementById("registerStatus").innerText = "";
      }

      function showRegister() {
        document.querySelector(".register-card").style.display = "block";
        document.querySelector(".login-card").style.display = "none";

        document.getElementById("loginStatus").innerText = "";
        document.getElementById("registerStatus").innerText = "";
      }

      function togglePassword(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
      }

      /* ── Slideshow ────────────────────────────────────────────────────────
         Admins upload these in Settings. Nothing here ever blocks the form:
         no slides, a failed fetch or a dead DB all leave the page exactly as
         it is served, and the two-column layout only appears once a real
         image has decoded. */

      const SLIDE_INTERVAL_MS = 6000;

      let slideIndex = 0;
      let slideTimer = null;

      const reducedMotion =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      async function loadLoginSlides() {
        // Below 900px the column is hidden by CSS anyway, so a phone should
        // not spend a single byte downloading the images.
        if (window.matchMedia && !window.matchMedia("(min-width: 901px)").matches) {
          return;
        }

        try {
          const res = await fetch(`${API_BASE}/login-slides.php`, {
            cache: "no-store",
          });

          const data = await res.json();
          const slides = (data && data.slides) || [];

          if (!slides.length) return;

          await renderLoginSlides(slides);
        } catch (error) {
          // Decoration. Never worth a console error on a sign-in page.
          return;
        }
      }

      async function renderLoginSlides(slides) {
        const panel = document.getElementById("authSlideshow");
        const stack = document.getElementById("slideStack");
        const dots = document.getElementById("slideDots");

        if (!panel || !stack || !dots) return;

        stack.innerHTML = "";
        dots.innerHTML = "";
        slideIndex = 0;

        slides.forEach((slide, index) => {
          const figure = document.createElement("figure");
          figure.className = "slide" + (index === 0 ? " active" : "");

          const img = document.createElement("img");
          img.alt = "";
          img.decoding = "async";
          img.draggable = false;
          // Wired before src: a cached 404 can fire before the next line runs.
          img.onerror = () => dropSlide(figure);
          img.src = slide.image_path;

          figure.appendChild(img);

          const title = (slide.title || "").trim();
          const subtitle = (slide.subtitle || "").trim();

          if (title || subtitle) {
            const caption = document.createElement("figcaption");

            if (title) {
              const heading = document.createElement("h2");
              heading.textContent = title;
              caption.appendChild(heading);
            }

            if (subtitle) {
              const line = document.createElement("p");
              line.textContent = subtitle;
              caption.appendChild(line);
            }

            figure.appendChild(caption);
          }

          stack.appendChild(figure);

          if (slides.length > 1) {
            const dot = document.createElement("button");
            dot.type = "button";
            dot.className = index === 0 ? "active" : "";
            dot.setAttribute("aria-label", `Show slide ${index + 1}`);
            dot.onclick = () => {
              goToSlide(index);
              // A manual jump earns a full interval before the timer moves on.
              if (slideTimer) startSlideshow();
            };
            dots.appendChild(dot);
          }
        });

        const firstImg = stack.querySelector("img");

        if (!firstImg) return;

        // Reveal only once there is something to look at, so the form never
        // slides sideways over an empty navy rectangle.
        if (firstImg.decode) {
          await firstImg.decode().catch(() => {});
        }

        if (!stack.querySelector(".slide")) return;

        panel.hidden = false;
        panel.setAttribute("aria-hidden", "true");
        document.body.classList.add("has-slides");

        startSlideshow();
      }

      function goToSlide(index) {
        const figures = document.querySelectorAll("#slideStack .slide");
        const dots = document.querySelectorAll("#slideDots button");

        if (!figures.length) return;

        slideIndex = (index + figures.length) % figures.length;

        figures.forEach((figure, i) =>
          figure.classList.toggle("active", i === slideIndex)
        );

        dots.forEach((dot, i) =>
          dot.classList.toggle("active", i === slideIndex)
        );
      }

      function startSlideshow() {
        stopSlideshow();

        const count = document.querySelectorAll("#slideStack .slide").length;

        if (reducedMotion || count < 2) return;

        slideTimer = setInterval(() => goToSlide(slideIndex + 1), SLIDE_INTERVAL_MS);
      }

      function stopSlideshow() {
        if (slideTimer) {
          clearInterval(slideTimer);
          slideTimer = null;
        }
      }

      function dropSlide(figure) {
        const stack = document.getElementById("slideStack");
        const dots = document.getElementById("slideDots");

        if (!stack || !figure.parentNode) return;

        const index = Array.prototype.indexOf.call(stack.children, figure);
        const dot = dots ? dots.children[index] : null;

        figure.remove();
        if (dot) dot.remove();

        const remaining = stack.children.length;

        if (!remaining) {
          // Every image is gone. Re-centre the form rather than leave a
          // navy column with nothing in it.
          stopSlideshow();

          const panel = document.getElementById("authSlideshow");
          if (panel) panel.hidden = true;

          document.body.classList.remove("has-slides");
          if (dots) dots.innerHTML = "";
          return;
        }

        if (remaining === 1 && dots) dots.innerHTML = "";

        goToSlide(slideIndex >= remaining ? 0 : slideIndex);
        startSlideshow();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopSlideshow();
        } else if (document.body.classList.contains("has-slides")) {
          startSlideshow();
        }
      });

      async function loginUser() {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();
        const status = document.getElementById("loginStatus");

        status.classList.remove("error");

        if (!email || !password) {
          status.classList.add("error");
          status.innerText = "Please enter email and password.";
          return;
        }

        status.innerText = "Please wait...";

        try {
          const res = await fetch(`${API_BASE}/login.php`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email,
              password,
            }),
          });

          const data = await res.json();

          status.innerText = data.message;

          if (!data.success) {
            status.classList.add("error");
            return;
          }

          localStorage.setItem("portal_token", data.token);
          localStorage.setItem("portal_user", JSON.stringify(data.user));

          window.location.href = "dashboard.html";
        } catch (error) {
          status.classList.add("error");
          status.innerText = "Connection error.";
        }
      }

      async function registerUser() {
        const name = document.getElementById("registerName").value.trim();
        const email = document.getElementById("registerEmail").value.trim();
        const company = document.getElementById("companyName").value.trim();
        const password = document
          .getElementById("registerPassword")
          .value.trim();
        const terms = document.getElementById("termsCheck").checked;
        const status = document.getElementById("registerStatus");

        status.classList.remove("error");

        if (!name || !email || !company || !password) {
          status.classList.add("error");
          status.innerText = "Please fill all required fields.";
          return;
        }

        if (!terms) {
          status.classList.add("error");
          status.innerText = "Please accept terms and privacy policy.";
          return;
        }

        status.innerText = "Please wait...";

        try {
          const res = await fetch(`${API_BASE}/register.php`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name,
              email,
              company,
              password,
            }),
          });

          const data = await res.json();

          status.innerText = data.message;

          if (!data.success) {
            status.classList.add("error");
            return;
          }

          alert("Account created. Please wait for admin approval.");
          showLogin();
          document.getElementById("registerName").value = "";
          document.getElementById("registerEmail").value = "";
          document.getElementById("companyName").value = "";
          document.getElementById("registerPassword").value = "";
          document.getElementById("termsCheck").checked = false;
        } catch (error) {
          status.classList.add("error");
          status.innerText = "Connection error.";
        }
      }

      /* ── Local preview bypass ────────────────────────────────────────────
         Writes the session the portal pages look for and walks straight in.
         The button is only revealed on localhost, so a deployed copy never
         shows it; delete this block and the button above to drop it. */

      function onLocalhost() {
        return ["localhost", "127.0.0.1", "::1", ""].includes(location.hostname);
      }

      function devBypass() {
        localStorage.setItem("portal_token", "preview");
        localStorage.setItem(
          "portal_user",
          JSON.stringify({ name: "Jane Cooper", company_name: "Acme Media" })
        );

        // Straight to the calendar: dashboard.html clears the session and
        // bounces back here the moment its API call is refused.
        window.location.href = "user-appointments.html";
      }

      showRegister();

      if (onLocalhost()) {
        document.getElementById("devBypass").hidden = false;

        // showRegister() above opens on the Register card, which would leave
        // the bypass button off screen. Only shifts the default on localhost.
        showLogin();
      }

      const token = localStorage.getItem("portal_token");

      if (token) {
        window.location.href = "dashboard.html";
      } else {
        // No point fetching images for a session that is already leaving.
        loadLoginSlides();
      }
    </script>
  </body>
</html>
