<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Review — Admin</title>

<!--
  The review queue moved onto the Forms page as the "Form Review" section at
  the top, so there is nothing left here to render. This file stays only so an
  old bookmark, or a link in an already-sent email, lands somewhere useful
  rather than on a 404.

  Keeping the second copy of the review UI alive would leave two versions to
  drift apart - which is exactly what happened to the sidebar markup.
-->
<meta http-equiv="refresh" content="0; url=admin.html">
<script>window.location.replace("admin.html");</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:#f6f7fb;
  color:#101828;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
}
.note{
  background:#fff;
  border-radius:20px;
  box-shadow:0 14px 35px rgba(0,0,0,.06);
  padding:34px 38px;
  max-width:460px;
  text-align:center;
}
.note h1{font-size:20px;margin-bottom:10px}
.note p{font-size:14px;line-height:1.6;color:#667085;margin-bottom:20px}
.note a{
  display:inline-block;background:#1b1e3a;color:#fff;text-decoration:none;
  padding:12px 20px;border-radius:10px;font-size:13px;font-weight:800;
}
.note a:hover{background:#282c52}
</style>
</head>

<body>

<div class="note">
  <h1>Form Review has moved</h1>
  <p>It is now a section at the top of the Forms page. Taking you there&hellip;</p>
  <a href="admin.html">Go to Forms</a>
</div>

</body>
</html>
