<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background:#f6f7fb;
  color:#101828;
  min-height:100vh;
  padding:40px 20px;
}

.container{
  width:100%;
  max-width:760px;
  margin:auto;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#1b1e3a;
  font-weight:800;
  text-decoration:none;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:34px;
  box-shadow:0 14px 35px rgba(0,0,0,.06);
}

h1{
  font-size:28px;
  margin-bottom:8px;
}

.subtitle{
  color:#667085;
  margin-bottom:28px;
}

.field{
  margin-bottom:22px;
}

.collapsible-question-card{
  background:#ffffff;
  border:1px solid #dfe3ea;
  border-radius:16px;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.03);
  transition:all 0.2s ease;
}

.collapsible-question-header{
  padding:16px 20px;
  background:#f8fafc;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  user-select:none;
  font-weight:700;
  font-size:15px;
}

.collapsible-question-header:hover{
  background:#f1f5f9;
}

.collapsible-question-body{
  padding:20px;
  border-top:1px solid #eef1f5;
}

.collapsible-question-card.collapsed .collapsible-question-body{
  display:none;
}

.collapsible-toggle-icon{
  font-size:12px;
  color:#667085;
  transition:transform 0.2s ease;
}

.collapsible-question-card.collapsed .collapsible-toggle-icon{
  transform:rotate(-90deg);
}

.type-tag{
  font-size:11px;
  font-weight:800;
  padding:4px 10px;
  border-radius:12px;
  margin-right:10px;
  display:inline-block;
}

.type-tag.badge-input{ background:#e7f0ff; color:#1e5bb8; }
.type-tag.badge-file{ background:#fef3c7; color:#92400e; }
.type-tag.badge-checkbox, .type-tag.badge-checklist{ background:#e8faef; color:#166534; }

label{
  display:block;
  font-size:14px;
  font-weight:800;
  margin-bottom:9px;
}

.required{
  color:#c9000b;
}

input,textarea{
  width:100%;
  border:1px solid #dfe3ea;
  background:#f8fafc;
  border-radius:14px;
  padding:14px 16px;
  outline:none;
  font-size:14px;
}

textarea{
  min-height:115px;
  resize:vertical;
}

input:focus,textarea:focus{
  border-color:#1b1e3a;
  box-shadow:0 0 0 3px rgba(27,30,58,.10);
}

.error-field{
  border-color:#c9000b!important;
}

.status{
  margin-top:15px;
  color:#667085;
  font-size:14px;
}

.status.error{
  color:#c9000b;
  font-weight:800;
}

.submit{
  width:100%;
  height:56px;
  border:none;
  background:#1b1e3a;
  color:#fff;
  border-radius:14px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  margin-top:15px;
}

.submit:hover{
  background:#282c50;
}

.completed{
  background:#e8faef;
  color:#20a95a;
  padding:14px;
  border-radius:14px;
  font-weight:800;
  margin-bottom:20px;
}
.input-area{
  position:relative;
}

input,textarea{
  padding-left:50px;
}

.mic-btn{
  position:absolute;
  left:14px;
  top:14px;
  border:none;
  background:transparent;
  width:22px;
  height:22px;
  cursor:pointer;
  font-size:18px;
  color:#111;
}

.mic-btn.recording{
  color:#c9000b;
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.18);}
  100%{transform:scale(1);}
}
.question-chips{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:12px;
}

.chip-btn{
  border:none;
  background:#eef1f5;
  color:#101828;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.chip-btn:hover{
  background:#dfe3ea;
}

.confirm-box{
  margin:20px 0;
  display:flex;
  align-items:center;
}

.confirm-box label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:16px;
  color:#667085;
  cursor:pointer;
}

.confirm-box input[type="checkbox"]{
  width:22px;
  height:22px;
  cursor:pointer;
  accent-color:#1b1e3a;
}

/* File picker preview */
.file-field{
  position:relative;
}

.file-preview{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
  padding:10px 12px;
  background:#f8fafc;
  border:1px solid #dfe3ea;
  border-radius:12px;
}

.file-preview[hidden]{
  display:none;
}

.file-preview img{
  width:56px;
  height:56px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #dfe3ea;
  flex:none;
  background:#fff;
}

.file-preview img[hidden]{
  display:none;
}

.file-preview .file-name{
  flex:1;
  min-width:0;
  font-size:13px;
  color:#101828;
  word-break:break-all;
}

.file-remove{
  flex:none;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid #f0d2d4;
  background:#fff;
  color:#c9000b;
  font-size:18px;
  line-height:1;
  cursor:pointer;
}

.file-remove:hover{
  background:#fff5f5;
}

/* Read-only answers on an already-submitted survey */
.answer-box{
  background:#f8fafc;
  border:1px solid #dfe3ea;
  border-radius:14px;
  padding:16px;
  font-size:14px;
  color:#101828;
  line-height:1.6;
}

/* Checklist answers: one selected option per row. */
.answer-list{
  list-style:none;
  margin:0;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.answer-list li{
  background:#f8fafc;
  border:1px solid #dfe3ea;
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  color:#101828;
  line-height:1.5;
}

.answer-image{
  display:block;
  max-width:100%;
  max-height:320px;
  border-radius:10px;
  border:1px solid #dfe3ea;
  margin-bottom:12px;
  background:#fff;
}

.answer-file{
  display:inline-block;
  font-size:13px;
  font-weight:700;
  color:#1b1e3a;
  text-decoration:none;
  word-break:break-all;
}

.answer-file:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">

  <a href="dashboard.html" class="back">← Back to Dashboard</a>

  <div class="card">

    <div id="completedBox"></div>

    <h1 id="surveyTitle">Loading...</h1>
    <p class="subtitle" id="surveyMeta">Please answer all required questions.</p>

    <div id="questionsWrap"></div>
    <div class="confirm-box" id="confirmBox">
      <label>
        <input type="checkbox" id="confirmSubmit">
        I have reviewed all questions before submitting this form.
      </label>
    </div>
    <button class="submit" id="submitBtn" onclick="submitSurvey()">
      Submit Survey
    </button>

    <div class="status" id="status"></div>

  </div>

</div>

<script>
let token = localStorage.getItem("portal_token");

if(!token){
  window.location.href = "login.html";
}

const params = new URLSearchParams(window.location.search);
const surveyId = params.get("id");

if(!surveyId){
  alert("Survey ID missing");
  window.location.href = "dashboard.html";
}

let loadedQuestions = [];
let recognition;
let isRecording = false;
let currentButton = null;
const STORAGE_KEY = "survey_answers_" + surveyId;

function saveToLocalStorage(){
  const data = {};

  document
    .querySelectorAll("#questionsWrap input, #questionsWrap textarea")
    .forEach(field => {
      if(field.type === "checkbox"){
        data[field.dataset.questionId] = field.checked ? "checked" : "unchecked";
      } else {
        data[field.dataset.questionId] = field.value;
      }
    });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadFromLocalStorage(){
  const saved = localStorage.getItem(STORAGE_KEY);

  if(!saved) return;

  const data = JSON.parse(saved);

  Object.keys(data).forEach(key => {
    const field = document.querySelector(`[data-question-id="${key}"]`);

    if(field){
      if(field.type === "checkbox"){
        field.checked = data[key] === "checked";
      } else {
        field.value = data[key];
      }
    }
  });
}

async function loadSurvey(){

  const status = document.getElementById("status");

  try{

    const res = await fetch("api/survey-details.php?id=" + surveyId,{
      headers:{
        Authorization:"Bearer " + token
      }
    });

    const data = await res.json();

    if(!data.success){
      status.classList.add("error");
      status.innerText = data.message;
      return;
    }

    document.getElementById("surveyTitle").innerText = data.survey.title;
    document.getElementById("surveyMeta").innerText =
      "Status: " + data.survey.status + " | Created: " + data.survey.created_at;

    loadedQuestions = data.questions;
    window.loadedAnswers = data.answers || [];
    window.loadedFiles = data.files || {};
    if(data.survey.status === "completed"){
      document.getElementById("completedBox").innerHTML =
        `<div class="completed">This survey has already been submitted.</div>`;

      document.getElementById("submitBtn").style.display = "none";
      // the confirm gate belongs to the fill-in flow only
      document.getElementById("confirmBox").style.display = "none";
    }

    renderQuestions();
    loadFromLocalStorage();
  }catch(error){

    status.classList.add("error");
    status.innerText = "Connection error";

  }
}

function renderQuestions(){
  const wrap = document.getElementById("questionsWrap");

  if(!loadedQuestions.length){
    wrap.innerHTML = `<p>No questions found.</p>`;
    return;
  }

  const isCompleted = document.getElementById("submitBtn").style.display === "none";

  if(isCompleted){
    wrap.innerHTML = loadedQuestions.map(q => {

      const answerObj = (window.loadedAnswers || []).find(a => Number(a.question_id) === Number(q.id));
      const answerText = answerObj ? answerObj.answer : "No answer found";
      const isChecklist = q.question_type === "checkbox" || q.question_type === "checklist";

      let answerHTML;

      if(q.question_type === "file"){
        const upload = (window.loadedFiles || {})[q.id];

        if(upload){
          const base = "api/download-survey-file.php?id=" + upload.id +
                       "&token=" + encodeURIComponent(token);
          const isImage = String(upload.file_type || "").indexOf("image/") === 0;

          answerHTML = `
            <div class="answer-box">
              ${isImage ? `<img class="answer-image" src="${base}&mode=view" alt="${upload.original_name}">` : ""}
              <a class="answer-file" href="${base}" target="_blank" rel="noopener">
                ⬇ ${upload.original_name}
              </a>
            </div>
          `;
        }else{
          answerHTML = `<div class="answer-box">${answerText}</div>`;
        }
      }else if(isChecklist && answerObj){
        // Checklist answers are stored as "✅ item, ✅ item" — split on the comma that
        // precedes a tick so item labels containing commas stay intact.
        const items = answerText
          .split(/,\s*(?=✅)/)
          .map(s => s.trim())
          .filter(Boolean);

        answerHTML = items.length
          ? `<ul class="answer-list">${items.map(item => `<li>${item}</li>`).join("")}</ul>`
          : `<div class="answer-box">${answerText}</div>`;
      }else{
        answerHTML = `<div class="answer-box">${answerText}</div>`;
      }

      const typeBadge = isChecklist ? "Checklist" : (q.question_type === "file" ? "File Upload" : "Input");
      const typeClass = isChecklist ? "badge-checklist" : (q.question_type === "file" ? "badge-file" : "badge-input");

      return `
        <div class="collapsible-question-card">
          <div class="collapsible-question-header" onclick="this.parentElement.classList.toggle('collapsed')">
            <div style="display:flex; align-items:center; flex:1; gap:6px;">
              <span class="type-tag ${typeClass}">${typeBadge}</span>
              <span>${q.question_text}</span>
            </div>
            <span class="collapsible-toggle-icon">▼</span>
          </div>

          <div class="collapsible-question-body">
            ${answerHTML}
          </div>
        </div>
      `;
    }).join("");

    return;
  }

  wrap.innerHTML = loadedQuestions.map(q => {

    const required = Number(q.required) === 1;

    let inputHTML = "";
    let chips = [];

    try{
      chips = q.chips ? JSON.parse(q.chips) : [];
    }catch(e){
      chips = [];
    }

    const chipsHTML = chips.map(chip => `
      <button
        class="chip-btn"
        type="button"
        onclick="insertChip('${q.id}', '${chip.replace(/'/g, "\\'")}')"
      >
        ${chip}
      </button>
    `).join("");

    const isCheckbox = q.question_type === "checkbox" || q.question_type === "checklist";

    if(q.question_type === "file"){
      inputHTML = `
        <div class="file-field">
          <input
            type="file"
            data-question-id="${q.id}"
            data-question-label="${q.question_text}"
            data-required="${required ? "1" : "0"}"
            data-max-size="${q.max_file_size_mb || ""}"
            required
            onchange="handleFilePick(this)"
            style="padding-left:16px;"
          >

          <div class="file-preview" hidden>
            <img alt="" hidden>
            <span class="file-name"></span>
            <button
              type="button"
              class="file-remove"
              onclick="clearFilePick(this)"
              title="Remove file"
              aria-label="Remove file"
            >&times;</button>
          </div>
        </div>
        ${
          q.max_file_size_mb
          ? `<div style="font-size:12px;color:#667085;margin-top:6px;">Max file size: ${q.max_file_size_mb} MB</div>`
          : ""
        }
      `;
    }else if(isCheckbox){
      if(chips && chips.length > 0){
        inputHTML = `
          <div class="checklist-options-group" style="display:flex; flex-direction:column; gap:10px;">
            ${chips.map(item => `
              <label style="display:flex; align-items:center; gap:12px; cursor:pointer; font-weight:600; font-size:14px; background:#f8fafc; border:1px solid #dfe3ea; padding:10px 14px; border-radius:10px; transition:all 0.15s ease;">
                <input
                  type="checkbox"
                  class="survey-checkbox-input"
                  data-question-id="${q.id}"
                  data-question-label="${q.question_text}"
                  data-item-label="${item.replace(/"/g, '&quot;')}"
                  data-required="${required ? "1" : "0"}"
                  style="width:20px; height:20px; cursor:pointer; accent-color:#1b1e3a; margin:0;"
                >
                <span>${item}</span>
              </label>
            `).join("")}
          </div>
        `;
      }else{
        inputHTML = `
          <label style="display:flex; align-items:center; gap:12px; cursor:pointer; font-weight:600; font-size:15px; padding:4px 0; margin:0;">
            <input
              type="checkbox"
              class="survey-checkbox-input"
              data-question-id="${q.id}"
              data-question-label="${q.question_text}"
              data-item-label="${q.question_text.replace(/"/g, '&quot;')}"
              data-required="${required ? "1" : "0"}"
              style="width:24px; height:24px; cursor:pointer; accent-color:#1b1e3a; margin:0;"
            >
            <span>Complete item</span>
          </label>
        `;
      }
    }else{
      inputHTML = `
        <div class="input-area">
          <input
            type="text"
            data-question-id="${q.id}"
            data-question-label="${q.question_text}"
            data-required="${required ? "1" : "0"}"
            placeholder="Type your answer here..."
            required
          >
          <button class="mic-btn" type="button" onclick="toggleVoice('${q.id}', this)">🎙</button>
        </div>
      `;
    }

    const typeBadge = isCheckbox ? "Checklist" : (q.question_type === "file" ? "File Upload" : "Input");
    const typeClass = isCheckbox ? "badge-checkbox" : (q.question_type === "file" ? "badge-file" : "badge-input");

    return `
      <div class="collapsible-question-card">
        <div class="collapsible-question-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <div style="display:flex; align-items:center; flex:1; gap:6px;">
            <span class="type-tag ${typeClass}">${typeBadge}</span>
            <span>${q.question_text} ${required ? `<span class="required" style="color:#c9000b">*</span>` : ""}</span>
          </div>
          <span class="collapsible-toggle-icon">▼</span>
        </div>

        <div class="collapsible-question-body">
          ${inputHTML}
          ${
            !isCheckbox && q.question_type !== "file" && chipsHTML
            ? `<div class="question-chips">${chipsHTML}</div>`
            : ""
          }
        </div>
      </div>
    `;
  }).join("");

  document
    .querySelectorAll("#questionsWrap input, #questionsWrap textarea")
    .forEach(field => {
      field.addEventListener("input", function(){
        field.classList.remove("error-field");
        saveToLocalStorage();
      });

      field.addEventListener("change", function(){
        field.classList.remove("error-field");
        saveToLocalStorage();
      });
    });
}
function toggleVoice(fieldId, button){

  if(isRecording){
    stopVoice();
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    alert("Use Google Chrome");
    return;
  }

  const field = document.querySelector(`[data-question-id="${fieldId}"]`);

  if(!field){
    alert("Field not found");
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  let finalTranscript = field.value || "";

  recognition.start();

  isRecording = true;
  currentButton = button;

  button.innerHTML = "⏹";
  button.classList.add("recording");

  document.getElementById("status").classList.remove("error");
  document.getElementById("status").innerText = "🎤 Listening...";

  recognition.onresult = function(event){

    let interimTranscript = "";

    for(let i = event.resultIndex; i < event.results.length; i++){

      let transcript = event.results[i][0].transcript;

      if(event.results[i].isFinal){
        finalTranscript += transcript + " ";
      }else{
        interimTranscript += transcript;
      }
    }

    field.value = finalTranscript + interimTranscript;
    field.classList.remove("field-error");
    saveToLocalStorage();
  };

  recognition.onend = function(){
    resetButton();
  };

  recognition.onerror = function(event){
    console.log("Speech error:", event.error);
    resetButton();
  };
}

function stopVoice(){
  if(recognition){
    recognition.stop();
  }

  resetButton();
}

function resetButton(){
  isRecording = false;

  if(currentButton){
    currentButton.innerHTML = "🎙";
    currentButton.classList.remove("recording");
  }

  document.getElementById("status").innerText = "Ready";
}

function validateSurvey(){

  const fields = document.querySelectorAll("#questionsWrap input:not([type='checkbox']), #questionsWrap textarea");
  let valid = true;

  fields.forEach(field => {
    field.classList.remove("error-field");

    const required = field.dataset.required === "1";

    if(required){
      if(field.type === "file"){
        if(!field.files.length){
          field.classList.add("error-field");
          valid = false;
          return;
        }

        let maxMb = Number(field.dataset.maxSize || 0);

        if(maxMb <= 0 || maxMb > 5){
          maxMb = 5;
        }

        if(field.files[0].size > maxMb * 1024 * 1024){
          field.classList.add("error-field");
          document.getElementById("status").classList.add("error");
          document.getElementById("status").innerText =
            "Maximum file size allowed is " + maxMb + "MB.";
          valid = false;
          return;
        }

      }else if(field.value.trim() === ""){
        field.classList.add("error-field");
        valid = false;
      }
    }
  });

  const cards = document.querySelectorAll("#questionsWrap .collapsible-question-card");
  cards.forEach(card => {
    const checkboxes = card.querySelectorAll("input[type='checkbox']");
    if(checkboxes.length > 0){
      const isRequired = checkboxes[0].dataset.required === "1";
      if(isRequired){
        const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
        if(!anyChecked){
          card.classList.add("error-field");
          valid = false;
        }else{
          card.classList.remove("error-field");
        }
      }
    }
  });

  return valid;
}
function insertChip(questionId, text){
  const field = document.querySelector(`[data-question-id="${questionId}"]`);

  if(!field) return;

  if(field.type === "file") return;

  if(field.value.trim()){
    field.value += ", " + text;
  }else{
    field.value = text;
  }

  field.classList.remove("error-field");
  saveToLocalStorage();
}
// ── File picker preview ──────────────────────────────────────────────
// Images get a thumbnail; any file gets its name plus an × to clear it so a
// different one can be chosen (a file input cannot be emptied by the user).
function handleFilePick(input){
  const wrap = input.closest(".file-field");
  const preview = wrap.querySelector(".file-preview");
  const img = preview.querySelector("img");
  const name = preview.querySelector(".file-name");
  const file = input.files[0];

  if(img.dataset.url){
    URL.revokeObjectURL(img.dataset.url);
    delete img.dataset.url;
  }

  if(!file){
    img.hidden = true;
    img.removeAttribute("src");
    preview.hidden = true;
    return;
  }

  name.textContent = file.name;

  if(file.type.indexOf("image/") === 0){
    const url = URL.createObjectURL(file);
    img.dataset.url = url;
    img.src = url;
    img.hidden = false;
  }else{
    img.hidden = true;
    img.removeAttribute("src");
  }

  preview.hidden = false;
}

function clearFilePick(btn){
  const wrap = btn.closest(".file-field");
  const input = wrap.querySelector("input[type='file']");

  input.value = "";
  handleFilePick(input);
  input.focus();
}

async function submitSurvey(){

  const status = document.getElementById("status");
  status.classList.remove("error");

  const confirmSubmit = document.getElementById("confirmSubmit");

  if(!confirmSubmit.checked){
    status.classList.add("error");
    status.innerText =
    "Please confirm that you reviewed all questions.";
    return;
  }

  if(!validateSurvey()){
  status.classList.add("error");

  if(status.innerText.indexOf("Maximum file size") === -1){
    status.innerText = "Please answer all required questions.";
  }

  return;
}

  const nonCheckboxFields = document.querySelectorAll(
    "#questionsWrap input:not([type='checkbox']), #questionsWrap textarea"
  );

  const answers = [];
  const formData = new FormData();

  formData.append("surveyId", surveyId);

  nonCheckboxFields.forEach(field => {

    if(field.type === "file"){

      if(field.files.length){
        formData.append(
          "files[" + field.dataset.questionId + "]",
          field.files[0]
        );
      }

      answers.push({
        questionId: field.dataset.questionId,
        questionLabel: field.dataset.questionLabel,
        answer: field.files.length
          ? field.files[0].name
          : ""
      });

    } else {

      answers.push({
        questionId: field.dataset.questionId,
        questionLabel: field.dataset.questionLabel,
        answer: field.value.trim()
      });

    }

  });

  const checkboxGroupMap = {};
  const allCheckboxes = document.querySelectorAll("#questionsWrap input[type='checkbox']");
  allCheckboxes.forEach(cb => {
    const qId = cb.dataset.questionId;
    if(!checkboxGroupMap[qId]){
      checkboxGroupMap[qId] = {
        questionLabel: cb.dataset.questionLabel,
        items: []
      };
    }
    if(cb.checked){
      const itemLabel = cb.dataset.itemLabel || "";
      checkboxGroupMap[qId].items.push(itemLabel ? `✅ ${itemLabel}` : "✅");
    }
  });

  Object.keys(checkboxGroupMap).forEach(qId => {
    const group = checkboxGroupMap[qId];
    if(group.items.length > 0){
      answers.push({
        questionId: qId,
        questionLabel: group.questionLabel,
        answer: group.items.join(", ")
      });
    }
  });

  formData.append(
    "answers",
    JSON.stringify(answers)
  );

  status.innerText = "Submitting...";

  try{

    const res = await fetch(
      "api/submit-survey.php",
      {
        method:"POST",
        headers:{
          Authorization:"Bearer " + token
        },
        body:formData
      }
    );

    const data = await res.json();

    status.innerText = data.message;

    if(data.success){

      localStorage.removeItem(STORAGE_KEY);

      alert(
        "Survey submitted successfully"
      );

      window.location.href =
      "dashboard.html";

    }else{

      status.classList.add("error");

    }

  }catch(error){

    status.classList.add("error");
    status.innerText = "Connection error";

  }
}
loadSurvey();
</script>
