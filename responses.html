<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Survey Responses</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  background:#f6f7fb;
  color:#101828;
  padding:35px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
}

h2{
  margin-bottom:10px;
}

a{
  color:var(--nav-active);
  font-weight:bold;
}

.empty{
  background:#fff;
  padding:25px;
  border-radius:15px;
  color:#667085;
}
.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden;}
.panel-head{padding:24px 28px;border-bottom:1px solid #eef1f5;}
.panel-head h1{font-size:24px;margin-bottom:6px;}
.panel-head p{color:#667085;font-size:14px;}
.panel-body{padding:24px 28px;}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
body{padding:0}
.admin-sidebar{
  width:var(--sidebar-w);
  background:#fff;
  border-right:1px solid var(--line);
  position:fixed;top:0;left:0;bottom:0;
  padding:26px 12px 18px;
  display:flex;flex-direction:column;justify-content:space-between;
  z-index:100;
}
.side-logo{padding:0 6px;margin-bottom:30px}
.side-logo img{width:150px;max-width:100%;height:auto;display:block}

.side-nav a{
  display:flex;gap:12px;align-items:center;
  text-decoration:none;color:var(--muted);
  padding:11px 12px;border-radius:10px;margin-bottom:4px;
  font-size:14px;font-weight:600;
  transition:background .15s,color .15s;
}
.side-nav a svg{width:18px;height:18px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{
  width:100%;font:inherit;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:10px;
  display:flex;gap:10px;align-items:center;cursor:pointer;
  transition:background .15s,border-color .15s;
}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{
  width:36px;height:36px;border-radius:50%;
  background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}

.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-topbar{
  height:72px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 32px;
}
.admin-bell{
  width:40px;height:40px;border-radius:50%;border:none;background:transparent;
  color:#344054;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.admin-bell:hover{background:#f6f7f9}
.admin-bell{position:relative}
.admin-bell .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.admin-content{padding:35px}

/* ── Collapsible sidebar ── */
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{padding:0}
:root.sidebar-collapsed .side-logo img{display:none}

:root.sidebar-collapsed .side-nav a{justify-content:center;padding:12px 0}
:root.sidebar-collapsed .side-nav a span{display:none}
/* The account card is the only entry point to logout — collapse it, never hide it. */
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}
@media(max-width:950px){

  .admin-content{padding:24px 18px}
}

/* ── Account popup (sidebar card) ── */
.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.acct-modal.show{display:flex}
.acct-box{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.acct-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef1f5}
.acct-head h2{font-size:17px}
.acct-head button{border:none;background:var(--nav-active);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.acct-body{padding:24px;text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px}
.acct-body strong{display:block;font-size:16px;margin-bottom:8px}
.acct-role{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-active);background:#eef0f6;border-radius:20px;padding:5px 12px;margin-bottom:22px}
.acct-logout{width:100%;height:46px;border:1px solid #f0d2d4;background:#fff;color:var(--brand);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.acct-logout:hover{background:#fff5f5}

/* ── Shell refresh: the collapse control lives in the sidebar head ── */
.side-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  min-height:36px;margin-bottom:26px;padding:0 2px;
}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}

.side-toggle{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}

/* Collapsed to 78px the wordmark is illegible, so the head keeps only the toggle. */
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}

/* Tighter nav rows: the active/hover pill was heavier than the label needs. */
.side-nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .side-nav a{
  width:38px;height:38px;padding:0;margin:0 auto 4px;
  border-radius:10px;justify-content:center;
}

/* Header sits on the page background rather than its own white bar. */
.admin-topbar{
  height:64px;background:transparent;border-bottom:none;
  justify-content:flex-end;padding:0 35px;
}

@media(max-width:950px){
  /* Force-collapsed below this width, so the head has nothing left to show. */
  .side-head{display:none}
  .admin-topbar{padding:0 18px}
}
</style>

<script>
// Runs before paint so the collapsed state never flashes open on load.
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth <= MOBILE || prefersCollapsed()); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return; // forced collapsed, nothing to toggle
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

// Sidebar account card -> popup. Admins have no editable profile record, so this
// is identity + logout only; system config lives on settings.html.
function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = a.role === "super_admin" ? "Super Admin" : "Administrator";
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctName", name);   set("acctRole", label);   set("acctAvatar", initial);
});
</script>
</head>

<body>

<aside class="admin-sidebar">
  <div>
    <div class="side-head">
      <div class="side-logo">
        <img src="logo.png" alt="W|ZONE London" onerror="this.onerror=null;this.src='assets/WZONE%20source.png'">
      </div>
      <button class="side-toggle" type="button" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4v16"/></svg>
      </button>
    </div>
    <nav class="side-nav">
      <a href="admin.html" title="Forms">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>Forms</span>
      </a>
      <a href="responses.html" class="active" title="Responses">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Responses</span>
      </a>
      <a href="admin-content.html" title="Content">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <span>Content</span>
      </a>
      <a href="users-management.html" id="usersManagementLink" title="Users Management">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Users Management</span>
      </a>
      <a href="sources-files.html" title="Sources &amp; Files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span>Sources &amp; Files</span>
      </a>
      <a href="admin-calendar.html" title="Calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Calendar</span>
      </a>
      <a href="settings.html" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>

  <button class="side-user" type="button" onclick="openAccount()" title="Account">
    <div class="side-avatar" id="adminAvatar">A</div>
    <div class="side-meta">
      <strong id="adminName">Admin</strong>
      <span id="adminRole">Administrator</span>
    </div>
    <svg class="side-dots" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
  </button>
</aside>

<div class="admin-main">
  <header class="admin-topbar">
    <button class="admin-bell" type="button" title="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-3 7-3 7h18s-3-1-3-7"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot"></span>
    </button>
  </header>
  <div class="admin-content">

<div class="panel">
  <div class="panel-head">
    <h1 id="pageTitle">Survey Responses</h1>
    <p>View and manage survey submissions.</p>
  </div>
  <div class="panel-body">
    <div id="responses">
      <div class="empty">Loading responses...</div>
    </div>
  </div>
</div>

<script>
let adminToken = localStorage.getItem("admin_token");
let adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

// Users Management is open to every admin, so the sidebar no longer hides it.

const params = new URLSearchParams(window.location.search);
const surveyId = params.get("survey_id");

async function loadResponses(){

  const box = document.getElementById("responses");

  const apiUrl = surveyId
    ? "api/admin-responses.php?survey_id=" + surveyId
    : "api/admin-responses.php";

  try{
    const res = await fetch(apiUrl,{
      headers:{
        Authorization:"Bearer " + adminToken
      }
    });

    const data = await res.json();

    if(!data.success){
      box.innerHTML = `<div class="empty">${data.message || "Unable to load responses."}</div>`;
      return;
    }

    if(!data.responses.length){
      box.innerHTML = `<div class="empty">No responses found.</div>`;
      return;
    }

    if(surveyId){
      document.getElementById("pageTitle").innerText = "Survey Responses #" + surveyId;
    }

    box.innerHTML = data.responses.map(item => `
      <div class="card">

        <h2>${item.title || item.survey_title || "Survey"}</h2>

        <p>
          <b>User:</b>
          ${item.name}
        </p>

        <p>
          <b>Email:</b>
          ${item.email}
        </p>

        <p>
          <b>Date:</b>
          ${item.submitted_at}
        </p>

        <a href="response-details.html?id=${item.id}">
          View Answers
        </a>

      </div>
    `).join("");

  }catch(error){
    box.innerHTML = `<div class="empty">Connection error.</div>`;
  }
}

loadResponses();
</script>

  </div>
</div>

<!-- ACCOUNT POPUP (opened from the sidebar card) -->
<div class="acct-modal" id="acctModal">
  <div class="acct-box">
    <div class="acct-head">
      <h2>Account</h2>
      <button type="button" onclick="closeAccount()" aria-label="Close">&times;</button>
    </div>
    <div class="acct-body">
      <div class="acct-avatar" id="acctAvatar">A</div>
      <strong id="acctName">Admin</strong>
      <div class="acct-role" id="acctRole">Administrator</div>
      <button class="acct-logout" onclick="logoutAdmin()">&#8617; Logout</button>
    </div>
  </div>
</div>

</body>
</html>
