<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Connected apps</title>

<!--
  Connected apps live on the page each person already uses: Settings for staff,
  Profile for clients (assets/connected-apps.js). This address stays because the
  approval page links here and it has been linked from elsewhere: it works out
  which of the two you need.
-->

<script>
(function () {
  function realToken(key) {
    var t = localStorage.getItem(key);
    return t && t !== "preview" ? t : null;
  }
  location.replace(
    realToken("admin_token") ? "settings.html#connected-apps"
    : realToken("portal_token") ? "profile.html#connected-apps"
    : "login.html"
  );
})();
</script>
</head>
<body></body>
</html>
