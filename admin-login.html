<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:#f6f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:34px;
  box-shadow:0 14px 35px rgba(0,0,0,.08);
}

.logo{
  color:#c9000b;
  font-weight:800;
  font-size:24px;
  margin-bottom:10px;
}

h1{
  margin-bottom:24px;
  color:#101828;
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

input{
  width:100%;
  height:54px;
  border:1px solid #dfe3ea;
  background:#f1f3f6;
  border-radius:12px;
  padding:0 15px;
  margin-bottom:18px;
  outline:none;
}

button{
  width:100%;
  height:56px;
  border:none;
  background:#1b1e3a;
  color:#fff;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}

.status{
  margin-top:14px;
  text-align:center;
  color:#1b1e3a;
  font-size:13px;
}
.password-box{
  position:relative;
  margin-bottom:18px;
}

.password-box input{
  margin-bottom:0;
  padding-right:50px;
}

.toggle-password{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:20px;
  user-select:none;
  color:#666;
}

.toggle-password:hover{
  color:#1b1e3a;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">W zone</div>
  <h1>Admin Login</h1>

  <label>Email</label>
  <input type="email" id="email" placeholder="admin@wzone.com">

  <label>Password</label>

<div class="password-box">
  <input type="password" id="password" placeholder="Password">
  <span class="toggle-password" onclick="togglePassword()">
    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.065 7-9.542 7S3.732 16.057 2.458 12z"/>
    </svg>
</span>
</div>
<a href="forgot-password.html" 
   style="
   display:block;
   text-align:right;
   margin-bottom:18px;
   font-size:13px;
   color:#1b1e3a;
   font-weight:700;
   text-decoration:none;
   ">
   Forgot password?
</a>
  <button onclick="loginAdmin()">Login</button>
  <button type="button" onclick="devBypass()"
    style="margin-top:12px;background:#101828">
    🛠 Dev Mode — Skip Login
  </button>

  <div class="status" id="status"></div>
</div>

<script>
async function loginAdmin(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const status = document.getElementById("status");

  status.innerText = "Please wait...";

  try{
    const res = await fetch("api/admin-login.php",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        email,
        password
      })
    });

    const data = await res.json();

    if(!data.success){
      status.innerText = data.message;
      return;
    }

    localStorage.setItem("admin_token", data.token);
    localStorage.setItem("admin_user", JSON.stringify(data.admin));
    window.location.href = "admin.html";

  }catch(error){
    status.innerText = "Connection error";
  }
}

// Dev-only: skip real auth so the admin frontend can be edited without a backend.
function devBypass() {
  localStorage.setItem("admin_token", "bypass_admin_token");
  localStorage.setItem(
    "admin_user",
    JSON.stringify({ id: 1, name: "Admin", role: "super_admin" })
  );
  window.location.href = "admin.html";
}

function togglePassword() {
    const input = document.getElementById("password");

    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }
}
</script>

</body>
</html>
