<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Inquiry</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6f7fb;color:#101828;padding:0}

.breadcrumb{font-size:13px;color:#98a2b3;margin-bottom:8px}
.breadcrumb a{color:#98a2b3;text-decoration:none}
.breadcrumb a:hover{color:#1b1e3a}

.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:16px}
.page-head h1{font-size:26px}

.panel{background:#fff;border-radius:20px;box-shadow:0 14px 35px rgba(0,0,0,.06);overflow:hidden;margin-bottom:24px}
.panel-body{padding:28px}

.field-group{margin-bottom:22px}
.field-group label{display:block;font-size:13px;font-weight:800;margin-bottom:8px}
.field-group input[type="text"],
.field-group textarea,
.field-group select{
  width:100%;border:1px solid #dfe3ea;background:#f8fafc;border-radius:12px;
  padding:12px 14px;font-size:14px;outline:none;
}
.field-group select{height:48px}
.field-group textarea{min-height:90px;resize:vertical}
.field-group input:focus,.field-group textarea:focus,.field-group select:focus{
  border-color:#1b1e3a;box-shadow:0 0 0 4px rgba(27,30,58,.10);
}

.manager-chip{
  display:flex;align-items:center;gap:10px;border:1px solid #eef1f5;border-radius:12px;
  padding:10px 14px;margin-top:10px;background:#fafbfc;display:none;
}
.manager-chip .chip-avatar{
  width:30px;height:30px;border-radius:50%;background:#dce3ff;color:#3745a4;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none;
}
.manager-chip span{font-size:13px;font-weight:700}

.builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media(max-width:760px){.builder-grid{grid-template-columns:1fr}}

.custom-field-row{
  display:flex;flex-direction:column;gap:12px;margin-bottom:12px;
  border:1px solid #eef1f5;border-radius:12px;padding:16px;background:#fafbfc;
}
.field-row-top{display:flex;gap:10px;align-items:flex-end}
.field-row-top .field-group{flex:1;margin-bottom:0}
.field-row-bottom{display:flex;gap:16px;align-items:center}
.field-row-bottom .type-group{flex:1;margin-bottom:0}
.field-row-bottom .type-group select{width:100%}
.custom-field-row .required-group{flex:none;display:flex;align-items:center;gap:6px}
.remove-field-btn{
  flex:none;border:none;background:#fde8e8;color:#c9000b;
  width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:16px;
}
.add-field-btn{
  background:#eef0f6;color:#1b1e3a;border:none;padding:10px 16px;
  border-radius:10px;font-weight:800;cursor:pointer;font-size:13px;margin-top:6px;
}

.status-card{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.status-card .status-text p{color:#667085;font-size:13px;margin-top:4px}
.badge{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block}
.approved{background:#e8faef;color:#20a95a}
.pending{background:#f2f4f7;color:#667085}

.btn{border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.primary-btn{background:#1b1e3a;color:#fff}
.primary-btn:hover{background:#282c52}
.outline-btn{background:#fff;border:1px solid #dfe3ea;color:#1b1e3a}
.outline-btn:hover{background:#f8fafc}
.danger-btn{background:#fff;border:1px solid #f0d2d4;color:#c9000b}
.danger-btn:hover{background:#fff5f5}

.form-status{margin-top:14px;font-size:13px;color:#667085}

.link-box{display:flex;align-items:center;gap:10px;background:#f2f4f7;border-radius:12px;padding:12px 14px;margin-top:16px}
.link-box input{flex:1;border:none;background:transparent;font-size:13px;color:#101828;outline:none}
.link-box button{border:none;background:var(--nav-active);color:#fff;padding:9px 14px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer;flex:none}

/* ── Admin shell: sidebar + header (shared across admin pages) ── */
:root{
  --brand:#c9000b;
  --nav-active:#1b1e3a;
  --text:#101828;
  --muted:#667085;
  --line:#eaecf0;
  --sidebar-w:260px;
}
.admin-sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);position:fixed;top:0;left:0;bottom:0;padding:26px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;z-index:100}
.side-logo{padding:0 6px;margin-bottom:30px}
.side-logo img{width:150px;max-width:100%;height:auto;display:block}
.side-nav a{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--muted);padding:11px 12px;border-radius:10px;margin-bottom:4px;font-size:14px;font-weight:600;transition:background .15s,color .15s}
.side-nav a svg{width:18px;height:18px;flex:none}
.side-nav a:hover{background:#f6f7f9;color:var(--text)}
.side-nav a.active{background:var(--nav-active);color:#fff}
.side-user{width:100%;font:inherit;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.side-user:hover{background:#fafbfc;border-color:#d7dae0}
.side-avatar{width:36px;height:36px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.side-meta{flex:1;min-width:0}
.side-meta strong{display:block;font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-meta span{font-size:11px;color:#98a2b3}
.side-dots{color:#98a2b3;flex:none}
.admin-main{margin-left:var(--sidebar-w);width:calc(100% - var(--sidebar-w))}
.admin-bell{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:#344054;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.admin-bell:hover{background:#f6f7f9}
.admin-bell .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.admin-content{padding:35px}
:root.sidebar-collapsed{--sidebar-w:78px}
.admin-sidebar,.admin-main{transition:width .18s ease,margin-left .18s ease}
:root.sidebar-collapsed .admin-sidebar{padding:26px 4px 18px}
:root.sidebar-collapsed .side-logo{padding:0}
:root.sidebar-collapsed .side-logo img{display:none}
:root.sidebar-collapsed .side-nav a{justify-content:center;padding:12px 0}
:root.sidebar-collapsed .side-nav a span{display:none}
:root.sidebar-collapsed .side-user{justify-content:center;padding:8px}
:root.sidebar-collapsed .side-meta,:root.sidebar-collapsed .side-dots{display:none}
@media(max-width:950px){.admin-content{padding:24px 18px}}
.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.acct-modal.show{display:flex}
.acct-box{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.acct-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid #eef1f5}
.acct-head h2{font-size:17px}
.acct-head button{border:none;background:var(--nav-active);color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer}
.acct-body{padding:24px;text-align:center}
.acct-avatar{width:72px;height:72px;border-radius:50%;background:#dce3ff;color:#3745a4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 16px}
.acct-body strong{display:block;font-size:16px;margin-bottom:8px}
.acct-role{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--nav-active);background:#eef0f6;border-radius:20px;padding:5px 12px;margin-bottom:22px}
.acct-logout{width:100%;height:46px;border:1px solid #f0d2d4;background:#fff;color:var(--brand);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.acct-logout:hover{background:#fff5f5}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;margin-bottom:26px;padding:0 2px}
.side-logo{padding:0;margin:0;flex:1;min-width:0}
.side-logo img{width:132px;max-width:100%;height:auto;display:block}
.side-toggle{width:34px;height:34px;flex:none;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.side-toggle:hover{background:#f2f4f8;color:var(--text)}
.side-toggle svg{width:18px;height:18px}
:root.sidebar-collapsed .side-head{justify-content:center;margin-bottom:22px}
:root.sidebar-collapsed .side-logo{display:none}
.side-nav a{gap:10px;padding:8px 10px;border-radius:9px;margin-bottom:2px}
.side-nav a svg{width:17px;height:17px}
:root.sidebar-collapsed .side-nav a{width:38px;height:38px;padding:0;margin:0 auto 4px;border-radius:10px;justify-content:center}
.admin-topbar{height:64px;background:transparent;border-bottom:none;display:flex;align-items:center;justify-content:flex-end;padding:0 35px}
@media(max-width:950px){.side-head{display:none}.admin-topbar{padding:0 18px}}
</style>

<script>
(function () {
  var root = document.documentElement;
  var KEY = "wz_sidebar_collapsed";
  var MOBILE = 950;
  function prefersCollapsed(){ return localStorage.getItem(KEY) === "1"; }
  function apply(){ root.classList.toggle("sidebar-collapsed", window.innerWidth <= MOBILE || prefersCollapsed()); }
  window.toggleSidebar = function(){
    if (window.innerWidth <= MOBILE) return;
    localStorage.setItem(KEY, prefersCollapsed() ? "0" : "1");
    apply();
  };
  apply();
  window.addEventListener("resize", apply);
})();

function openAccount(){ document.getElementById("acctModal").classList.add("show"); }
function closeAccount(){ document.getElementById("acctModal").classList.remove("show"); }
function adminRoleLabel(role){
  switch(role){
    case "owner": return "Owner";
    case "super_admin": return "Super Admin";
    case "account_manager": return "Account Manager";
    case "seo_admin": return "Admin";
    default: return "Administrator";
  }
}
document.addEventListener("DOMContentLoaded", function () {
  var a = {};
  try { a = JSON.parse(localStorage.getItem("admin_user") || "{}"); } catch (e) {}
  var name = a.name || "Admin";
  var label = adminRoleLabel(a.role);
  var initial = name.charAt(0).toUpperCase();
  function set(id, v){ var el = document.getElementById(id); if (el) el.textContent = v; }
  set("adminName", name);  set("adminRole", label);  set("adminAvatar", initial);
  set("acctName", name);   set("acctRole", label);   set("acctAvatar", initial);
});
</script>
</head>

<script>
let adminToken = localStorage.getItem("admin_token");
let adminUser = JSON.parse(localStorage.getItem("admin_user") || "{}");

if(!adminToken || !adminUser.role){
  window.location.href = "admin-login.html";
}

// Creating and editing inquiries is owner-only.
if(adminUser.role !== "owner"){
  window.location.href = "inquiries.html";
}

function logoutAdmin(){
  localStorage.removeItem("admin_token");
  localStorage.removeItem("admin_user");
  window.location.href = "admin-login.html";
}

const params = new URLSearchParams(window.location.search);
const inquiryId = params.get("id") ? Number(params.get("id")) : null;
let fieldRowCounter = 0;
let accountManagers = [];

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function copyLink(url){
  navigator.clipboard.writeText(url).then(() => alert("Link copied!"));
}

function copyFormLink(){
  copyLink(document.getElementById("linkInput").value);
}

function updateStatusBadge(){
  const active = document.getElementById("formActive").value === "1";
  const badge = document.getElementById("statusBadge");
  badge.innerText = active ? "Active" : "Inactive";
  badge.className = "badge " + (active ? "approved" : "pending");
}

function updateManagerChip(){
  const select = document.getElementById("formManager");
  const chip = document.getElementById("managerChip");
  const selected = accountManagers.find(m => String(m.id) === select.value);

  if(!selected){
    chip.style.display = "none";
    return;
  }

  document.getElementById("managerChipAvatar").innerText = selected.name.charAt(0).toUpperCase();
  document.getElementById("managerChipName").innerText = selected.name + " - " + selected.email;
  chip.style.display = "flex";
}

function addFormField(label = "", type = "input", required = true){
  fieldRowCounter++;
  const rowId = "field-row-" + fieldRowCounter;

  const container = document.getElementById("formFields");
  const row = document.createElement("div");
  row.className = "custom-field-row";
  row.id = rowId;
  row.innerHTML = `
    <div class="field-row-top">
      <div class="field-group">
        <label>Label</label>
        <input type="text" class="field-label-input" value="${escapeHtml(label)}" placeholder="e.g. Phone Number">
      </div>
      <button type="button" class="remove-field-btn" onclick="document.getElementById('${rowId}').remove()">&times;</button>
    </div>
    <div class="field-row-bottom">
      <div class="type-group field-group">
        <label>Type</label>
        <select class="field-type-input">
          <option value="input" ${type === "input" ? "selected" : ""}>Short answer</option>
          <option value="textarea" ${type === "textarea" ? "selected" : ""}>Long answer</option>
        </select>
      </div>
      <div class="required-group">
        <input type="checkbox" class="field-required-input" ${required ? "checked" : ""} style="width:16px;height:16px;">
        <label style="margin:0;font-size:12px;font-weight:700;">Required</label>
      </div>
    </div>
  `;
  container.appendChild(row);
}

async function loadAccountManagers(){
  try{
    const res = await fetch("api/admin-inquiries.php", {
      headers: { Authorization: "Bearer " + adminToken }
    });
    const data = await res.json();
    accountManagers = data.accountManagers || [];

    const select = document.getElementById("formManager");
    select.innerHTML = `<option value="">Unassigned</option>` +
      accountManagers.map(mgr => `<option value="${mgr.id}">${escapeHtml(mgr.name)} - ${escapeHtml(mgr.email)}</option>`).join("");

  }catch(err){
    // Non-fatal - the form still works without the manager list loaded.
  }
}

async function loadInquiry(){
  document.getElementById("breadcrumbCurrent").innerText = "Edit Inquiry Setup";
  document.getElementById("pageTitle").innerText = "Edit Inquiry";
  document.getElementById("saveBtn").innerText = "Save Changes";
  document.getElementById("deleteBtn").style.display = "inline-flex";

  try{
    const res = await fetch("api/admin-inquiries.php?id=" + inquiryId, {
      headers: { Authorization: "Bearer " + adminToken }
    });
    const data = await res.json();

    if(!data.success){
      document.getElementById("formStatus").innerText = data.message || "Unable to load this inquiry.";
      return;
    }

    document.getElementById("formTitle").value = data.inquiry.title;
    document.getElementById("formIntro").value = data.inquiry.intro_text || "";
    document.getElementById("formActive").value = Number(data.inquiry.active) === 1 ? "1" : "0";
    updateStatusBadge();

    document.getElementById("formManager").value = data.inquiry.assigned_account_manager_id || "";
    updateManagerChip();

    const publicBase = window.location.origin + window.location.pathname.replace(/inquiry-form\.html$/, "inquiry.html");
    document.getElementById("linkInput").value = `${publicBase}?ref=${data.inquiry.slug}`;
    document.getElementById("linkSection").style.display = "block";

    (data.fields || []).forEach(f => addFormField(f.field_label, f.field_type, Number(f.required) === 1));

  }catch(err){
    document.getElementById("formStatus").innerText = "Connection error.";
  }
}

async function saveInquiry(){
  const title = document.getElementById("formTitle").value.trim();
  const introText = document.getElementById("formIntro").value.trim();
  const assignedAccountManagerId = document.getElementById("formManager").value;
  const active = document.getElementById("formActive").value;
  const statusEl = document.getElementById("formStatus");

  const rows = document.querySelectorAll("#formFields .custom-field-row");
  const fields = Array.from(rows).map(row => ({
    label: row.querySelector(".field-label-input").value.trim(),
    type: row.querySelector(".field-type-input").value,
    required: row.querySelector(".field-required-input").checked
  })).filter(f => f.label);

  if(!title){
    statusEl.innerText = "Please add a title.";
    return;
  }

  if(!fields.length){
    statusEl.innerText = "Add at least one field.";
    return;
  }

  statusEl.innerText = "Saving...";

  try{
    const res = await fetch("api/admin-inquiries.php", {
      method: inquiryId ? "PUT" : "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + adminToken
      },
      body: JSON.stringify({
        id: inquiryId,
        title,
        introText,
        assignedAccountManagerId,
        active,
        fields
      })
    });

    const data = await res.json();
    statusEl.innerText = data.message;

    if(data.success){
      if(!inquiryId && data.id){
        // Brand-new inquiry - move to the edit URL for this one so
        // Delete, the permanent link box, etc. are all in place.
        window.location.href = "inquiry-form.html?id=" + data.id;
        return;
      }

      if(data.slug){
        const publicBase = window.location.origin + window.location.pathname.replace(/inquiry-form\.html$/, "inquiry.html");
        document.getElementById("linkInput").value = `${publicBase}?ref=${data.slug}`;
        document.getElementById("linkSection").style.display = "block";
      }
    }

  }catch(err){
    statusEl.innerText = "Connection error.";
  }
}

async function deleteInquiry(){
  if(!inquiryId) return;
  if(!confirm("Delete this inquiry? This can't be undone.")) return;

  try{
    const res = await fetch("api/admin-inquiries.php?id=" + inquiryId, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + adminToken }
    });

    const data = await res.json();

    if(!data.success){
      alert(data.message || "Failed to delete inquiry.");
      return;
    }

    window.location.href = "inquiries.html";

  }catch(err){
    alert("Network or server error.");
  }
}

document.getElementById("formManager").addEventListener("change", updateManagerChip);

loadAccountManagers().then(() => {
  if(inquiryId){
    loadInquiry();
  }else{
    addFormField();
  }
});
</script>

</body>
